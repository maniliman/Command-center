<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <link rel="icon" href="https://img.icons8.com/nolan/64/safe.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; font-size: 14px; }
        
        #dashboard-content { position: relative; z-index: 10; padding: 24px; }
        .stealth-btn { position: relative; z-index: 1000 !important; cursor: pointer; }
        .stealth-active { background: #00FF41 !important; color: #000 !important; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 5000 !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }

        .overlay { display: none; position: fixed; inset: 0; z-index: 9000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); padding: 24px; padding-top: 60px; overflow-y: auto; }
        .overlay-open { display: flex !important; flex-direction: column; }
        
        summary { cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        .filter-chip { padding: 6px 12px; border-radius: 20px; font-size: 10px; border: 1px solid #262629; text-transform: uppercase; }
        .filter-active { background: #00FF41; color: black; border-color: #00FF41; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleOverlay('intel-overlay')" class="p-3 vault-card text-[10px] uppercase border border-zinc-800">📊 Intel</button>
                <button onclick="toggleOverlay('settings-overlay')" class="p-3 vault-card text-[10px] uppercase border border-zinc-800">⚙️</button>
                <button id="stealth-trigger" onclick="togglePrivacy()" class="p-3 vault-card text-[10px] uppercase border border-zinc-800">Stealth</button>
            </div>
        </header>

        <div id="sec-cash" class="vault-card p-5 mb-8 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6 underline decoration-emerald-500 underline-offset-4">Tactical Cash Split</p>
            <div class="space-y-4 font-bold">
                <div class="flex justify-between text-xs"><span class="text-zinc-500 uppercase">Bills</span><span id="alloc-bills" class="emerald-text">₦0</span></div>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Savings</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Spend</span><span id="alloc-life">₦0</span></div>
                <div class="border-t border-zinc-800 pt-4 flex justify-between items-center text-sm"><span class="text-[10px] text-zinc-400 uppercase">Total Cash</span><span id="total-cash" class="emerald-text font-mono">₦0</span></div>
            </div>
        </div>

        <details id="sec-assets" class="vault-card group mb-4 border-emerald-900/20">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase tracking-widest font-black">Asset Inventory</span><span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span></summary>
            <div id="multi-tier-assets" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>

        <details id="sec-liabilities" class="vault-card group mb-4 border-red-900/20">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase tracking-widest font-black oxblood-text">Liability Ledger</span><span id="inv-debt-total" class="text-sm font-bold oxblood-text">₦0</span></summary>
            <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
        </details>

        <details id="sec-fiduciary" class="vault-card group mb-12 border-gold-text/20">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase tracking-widest font-black gold-text">Fiduciary Ledger</span><span id="f-total-header" class="text-sm font-bold gold-text">₦0</span></summary>
            <div id="fiduciary-main-list" class="px-5 pb-5 space-y-4 border-t border-zinc-900 pt-4"></div>
        </details>
    </div>

    <div id="intel-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-6">
            <h2 class="text-xl font-bold uppercase tracking-tighter">Vault Intelligence</h2>
            
            <input id="intel-search" oninput="runQuery()" class="input-dark w-full" placeholder="Search Names, Items, Categories...">
            
            <div class="grid grid-cols-2 gap-2">
                <div><label class="text-[8px] text-zinc-500 uppercase font-bold">From</label><input id="intel-from" type="date" onchange="runQuery()" class="input-dark text-[10px]"></div>
                <div><label class="text-[8px] text-zinc-500 uppercase font-bold">To</label><input id="intel-to" type="date" onchange="runQuery()" class="input-dark text-[10px]"></div>
            </div>

            <div class="bg-[#161618] p-4 rounded-xl border border-zinc-800">
                <p class="text-[9px] text-zinc-500 uppercase mb-2">Query Results Total</p>
                <p id="intel-total" class="text-2xl font-bold emerald-text">₦0.00</p>
                <p id="intel-count" class="text-[10px] text-zinc-500 mt-1">0 entries found</p>
            </div>

            <div id="intel-results" class="space-y-2 overflow-y-auto max-h-[300px]">
                </div>

            <button onclick="downloadCSV()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Download CSV Report</button>
            <button onclick="toggleOverlay('intel-overlay')" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Close Intel</button>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-8">
            <h2 class="text-xl font-bold uppercase tracking-tighter">Command Settings</h2>
            <section>
                <p class="text-[9px] text-zinc-500 uppercase mb-3 font-bold">Security Update</p>
                <input id="set-new-pin" type="password" maxlength="4" class="input-dark w-full mb-2" placeholder="New 4-Digit PIN">
                <button onclick="updatePin()" class="w-full bg-zinc-800 p-3 rounded text-[10px] uppercase font-bold">Save PIN</button>
            </section>
            <section>
                <p class="text-[9px] text-zinc-500 uppercase mb-3 font-bold">Backup (Recovery Key)</p>
                <button onclick="exportData()" class="w-full bg-emerald-500/20 text-emerald-500 p-4 rounded text-[10px] uppercase mb-2">Generate Key</button>
                <button onclick="importData()" class="w-full border border-zinc-800 p-4 rounded text-[10px] uppercase">Import Key</button>
            </section>
            <button onclick="toggleOverlay('settings-overlay')" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Close</button>
        </div>
    </div>

    <button onclick="toggleOverlay('entry-overlay')" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-4xl font-bold">+</button>

    <div id="entry-overlay" class="overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto pb-10">
            <h2 class="text-xl font-bold uppercase tracking-tighter">New Entry</h2>
            <div class="space-y-4">
                <select id="form-category" class="input-dark"><option value="Personal">Personal</option><option value="Fiduciary">Fiduciary</option></select>
                <input id="form-date" type="date" class="input-dark">
                <input id="form-name" class="input-dark" placeholder="Label / Contributor">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                <select id="form-type" class="input-dark"><option value="Cash">Cash</option><option value="Stocks">Stocks</option><option value="Property">Property</option><option value="Liability">Liability</option></select>
            </div>
            <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Authorize</button>
            <button onclick="toggleOverlay('entry-overlay')" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Back</button>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];
        let userPin = localStorage.getItem('vault_pin') || "0000";

        document.getElementById('form-date').valueAsDate = new Date();

        function mask(val) { return stealth ? "••••" : (parseFloat(val) || 0).toLocaleString(); }

        function updateDisplay() {
            let aSum = 0, dSum = 0, fGlobal = 0, bBal = 0, sBal = 0, lBal = 0, tCash = 0;
            const dList = document.getElementById('debt-list'), fMainList = document.getElementById('fiduciary-main-list'), mAssets = document.getElementById('multi-tier-assets');
            dList.innerHTML = ''; fMainList.innerHTML = ''; mAssets.innerHTML = '';

            const assetGroups = { Stocks: {t:0, e:[]}, Property: {t:0, e:[]} };

            ledger.forEach(item => {
                const val = parseFloat(item.amount) || 0;
                if (item.type === 'Liability') {
                    dSum += val; dList.innerHTML += `<div class="flex justify-between py-1 border-b border-zinc-900"><span>${item.name}</span><span class="oxblood-text">₦${mask(val)}</span></div>`;
                } else if (item.type === 'Cash') {
                    tCash += val; bBal += (item.bills || 0); sBal += (item.savings || 0); lBal += (item.lifestyle || 0); aSum += val;
                } else {
                    const type = item.type || 'Property';
                    if(!assetGroups[type]) assetGroups[type] = {t:0, e:[]};
                    assetGroups[type].t += val; assetGroups[type].e.push(item); aSum += val;
                }
            });

            for (const cat in assetGroups) {
                if(assetGroups[cat].e.length > 0) {
                    mAssets.innerHTML += `<details class="bg-black/20 rounded-lg border border-zinc-800 mb-2"><summary class="p-3 flex justify-between items-center"><span class="text-[9px] font-bold uppercase text-zinc-500">${cat}</span><span class="text-xs font-bold emerald-text">₦${mask(assetGroups[cat].t)}</span></summary><div class="px-3 pb-3 space-y-1 border-t border-zinc-900/50 pt-2">${assetGroups[cat].e.map(e => `<div class="flex justify-between text-[9px]"><span>${e.name}</span><span>₦${mask(e.amount)}</span></div>`).join('')}</div></details>`;
                }
            }

            const fGroups = fLedger.reduce((acc, item) => {
                const val = parseFloat(item.amount) || 0;
                if (!acc[item.name]) acc[item.name] = { total: 0, entries: [] };
                acc[item.name].total += val; acc[item.name].entries.push(item); fGlobal += val; return acc;
            }, {});

            document.getElementById('f-total-header').innerText = "₦" + mask(fGlobal);
            for (const name in fGroups) {
                fMainList.innerHTML += `<details class="bg-black/20 rounded-lg border border-zinc-800 mb-2"><summary class="p-4 flex justify-between items-center"><span class="text-[10px] font-bold uppercase text-zinc-400">${name}</span><span class="text-xs font-bold gold-text">₦${mask(fGroups[name].total)}</span></summary><div class="px-4 pb-4 space-y-2 border-t border-zinc-900/50 pt-3">${fGroups[name].entries.map(e => `<div class="flex justify-between text-[9px]"><span>${e.date}</span><span class="gold-text">₦${mask(e.amount)}</span></div>`).join('')}</div></details>`;
            }

            document.getElementById('networth').innerText = "₦" + mask(aSum - dSum);
            document.getElementById('inv-assets-total').innerText = "₦" + mask(aSum);
            document.getElementById('inv-debt-total').innerText = "₦" + mask(dSum);
            document.getElementById('total-cash').innerText = "₦" + mask(tCash);
            document.getElementById('alloc-bills').innerText = "₦" + mask(bBal);
            document.getElementById('alloc-savings').innerText = "₦" + mask(sBal);
            document.getElementById('alloc-life').innerText = "₦" + mask(lBal);
        }

        function runQuery() {
            const query = document.getElementById('intel-search').value.toLowerCase();
            const from = document.getElementById('intel-from').value;
            const to = document.getElementById('intel-to').value;
            const resultsDiv = document.getElementById('intel-results');
            resultsDiv.innerHTML = '';
            
            let total = 0, count = 0;
            const combined = [...ledger.map(i => ({...i, cat:'Personal'})), ...fLedger.map(i => ({...i, cat:'Fiduciary'}))];

            combined.forEach(item => {
                const itemDate = new Date(item.rawDate);
                const matchSearch = item.name.toLowerCase().includes(query) || item.type?.toLowerCase().includes(query) || item.cat.toLowerCase().includes(query);
                const matchDate = (!from || itemDate >= new Date(from)) && (!to || itemDate <= new Date(to));

                if (matchSearch && matchDate) {
                    total += parseFloat(item.amount) || 0;
                    count++;
                    resultsDiv.innerHTML += `<div class="flex justify-between p-3 bg-white/5 rounded border border-zinc-800 text-[10px] uppercase font-bold"><div><p class="text-[8px] text-zinc-500">${item.date}</p><p>${item.name}</p></div><p class="emerald-text">₦${parseFloat(item.amount).toLocaleString()}</p></div>`;
                }
            });

            document.getElementById('intel-total').innerText = "₦" + total.toLocaleString();
            document.getElementById('intel-count').innerText = `${count} entries found`;
        }

        function downloadCSV() {
            const combined = [...ledger.map(i => ({...i, cat:'Personal'})), ...fLedger.map(i => ({...i, cat:'Fiduciary'}))];
            let csv = "Date,Name,Amount,Type,Category\n";
            combined.forEach(i => csv += `${i.date},${i.name},${i.amount},${i.type || 'N/A'},${i.cat}\n`);
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', `Sovereign_Report_${new Date().toLocaleDateString()}.csv`);
            a.click();
        }

        function toggleOverlay(id) { document.getElementById(id).classList.toggle('overlay-open'); if(id==='intel-overlay') runQuery(); }
        function togglePrivacy() { stealth = !stealth; document.getElementById('stealth-trigger').classList.toggle('stealth-active', stealth); updateDisplay(); }
        function updatePin() { const pin = document.getElementById('set-new-pin').value; if(pin.length === 4) { localStorage.setItem('vault_pin', pin); userPin = pin; alert("PIN Updated."); } }
        function submitEntry() {
            const cat = document.getElementById('form-category').value, name = document.getElementById('form-name').value, amount = parseFloat(document.getElementById('form-amount').value), dateVal = document.getElementById('form-date').value;
            if (!name || isNaN(amount) || !dateVal) return;
            const entryDate = new Date(dateVal).toLocaleDateString();
            if (cat === 'Personal') {
                const type = document.getElementById('form-type').value;
                let entry = { name, amount, type, date: entryDate, rawDate: dateVal };
                if (type === 'Cash') { entry.bills = amount * 0.40; entry.savings = amount * 0.40; entry.lifestyle = amount * 0.20; }
                ledger.push(entry); localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            } else {
                fLedger.push({ name, amount, date: entryDate, rawDate: dateVal }); localStorage.setItem('fiduciary_ledger', JSON.stringify(fLedger));
            }
            updateDisplay(); toggleOverlay('entry-overlay');
        }
        updateDisplay();
    </script>
</body>
</html>
