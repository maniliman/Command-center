<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; overflow-x: hidden; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        
        /* Layer Priority: These must be reachable at all times */
        .fab-button { 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            z-index: 9999 !important; 
            pointer-events: auto !important;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
        }
        .stealth-btn { position: relative; z-index: 1000 !important; pointer-events: auto !important; }

        /* Overlay logic */
        #menu-overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 5000; 
            background: rgba(0,0,0,0.98); 
            backdrop-filter: blur(20px); 
            padding: 30px;
            padding-top: 80px;
        }
        .menu-open { display: flex !important; flex-direction: column; align-items: center; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 8px; width: 100%; outline: none; }
    </style>
</head>
<body class="pb-40 p-6">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="stealth-btn p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800">Stealth</button>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="vault-card p-4 border-l-2 border-emerald-500">
                <p class="text-[#71717A] text-[9px] uppercase font-bold mb-1">Total Assets</p>
                <p id="total-assets" class="emerald-text font-bold text-lg font-mono">₦0</p>
            </div>
            <div class="vault-card p-4 border-l-2 border-red-500">
                <p class="text-[#71717A] text-[9px] uppercase font-bold mb-1">Total Debt</p>
                <p id="total-debt" class="oxblood-text font-bold text-lg font-mono">₦0</p>
            </div>
        </div>

        <div class="vault-card p-5 mb-10 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6 underline decoration-emerald-500 underline-offset-4">Tactical Cash Split</p>
            <div class="space-y-4 font-bold text-xs uppercase">
                <div class="flex justify-between"><span>Bills (40%)</span><span id="alloc-bills">₦0</span></div>
                <div class="flex justify-between"><span>Savings</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between"><span>Spend</span><span id="alloc-life">₦0</span></div>
            </div>
        </div>

        <p class="text-[#71717A] text-[9px] uppercase tracking-[0.3em] font-bold mb-4">Master Ledger</p>
        <div id="master-history" class="space-y-3"></div>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-4xl font-bold">+</button>

    <div id="menu-overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto">
            <h2 class="text-xl font-bold uppercase tracking-tighter">New Entry</h2>
            <div class="space-y-4">
                <input id="form-name" class="input-dark" placeholder="Label">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                <select id="form-type" class="input-dark">
                    <option value="Asset">Fixed Asset</option>
                    <option value="Cash">Liquid Cash (Split)</option>
                    <option value="Liability">Liability/Debt</option>
                </select>
            </div>
            <div class="pt-6 space-y-3">
                <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Authorize</button>
                <button onclick="toggleMenu()" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Back</button>
            </div>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];

        function updateDisplay() {
            let assetsSum = 0, debtSum = 0, totalCash = 0, bills = 0, savings = 0, spend = 0;
            const history = document.getElementById('master-history');
            history.innerHTML = '';

            ledger.slice().reverse().forEach((item, originalIndex) => {
                const index = ledger.length - 1 - originalIndex;
                const isAsset = (item.type === 'Asset' || item.type === 'Cash');
                if(isAsset) assetsSum += item.amount; else debtSum += item.amount;
                
                if(item.type === 'Cash') {
                    totalCash += item.amount;
                    bills += (item.amount * 0.4);
                    savings += (item.amount * 0.4); // Default 40% for reset stability
                    spend += (item.amount * 0.2); // Default 20%
                }

                history.innerHTML += `
                    <div class="vault-card p-4 flex justify-between items-center mb-3">
                        <div><p class="text-[8px] text-zinc-600 font-bold uppercase">${item.type}</p><p class="text-xs font-bold">${item.name}</p></div>
                        <div class="flex items-center gap-4">
                            <span class="${isAsset ? 'emerald-text' : 'oxblood-text'} font-mono text-xs">₦${stealth ? '••••' : item.amount.toLocaleString()}</span>
                            <button onclick="deleteItem(${index})" class="text-zinc-800 font-black px-2">×</button>
                        </div>
                    </div>`;
            });

            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + (assetsSum - debtSum).toLocaleString();
            document.getElementById('total-assets').innerText = "₦" + assetsSum.toLocaleString();
            document.getElementById('total-debt').innerText = "₦" + debtSum.toLocaleString();
            document.getElementById('alloc-bills').innerText = "₦" + bills.toLocaleString();
            document.getElementById('alloc-savings').innerText = "₦" + savings.toLocaleString();
            document.getElementById('alloc-life').innerText = "₦" + spend.toLocaleString();
        }

        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }

        function submitEntry() {
            const name = document.getElementById('form-name').value;
            const amount = parseFloat(document.getElementById('form-amount').value);
            const type = document.getElementById('form-type').value;
            if (!name || isNaN(amount)) return;
            ledger.push({ name, amount, type, timestamp: new Date().toLocaleDateString() });
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay(); toggleMenu();
        }

        function deleteItem(index) {
            if(confirm("Delete record?")) {
                ledger.splice(index, 1);
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
                updateDisplay();
            }
        }

        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        updateDisplay();
    </script>
</body>
</html>
