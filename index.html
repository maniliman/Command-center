<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; margin-bottom: 16px; width: 100%; position: relative; }
        .emerald-border { border: 1px solid #00FF41; background: rgba(0, 255, 65, 0.03); }
        .fiduciary-border { border: 2px solid #EAB308; background: rgba(234, 179, 8, 0.03); }
        .sub-drawer { display: none; padding: 20px; background: rgba(0,0,0,0.6); border-top: 1px solid #262629; }
        .drawer-open > .sub-drawer { display: block !important; }
        .trigger-btn { color: #00FF41; font-size: 18px; padding: 10px; cursor: pointer; display: inline-block; }
        .drawer-open > div > .trigger-btn { transform: rotate(180deg); }
        .stealth-active .maskable { filter: blur(28px); opacity: 0.3; pointer-events: none; }
        .fab-btn { position: fixed; bottom: 25px; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 9999; border: none; }
        .view-hidden { display: none !important; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 18px; border-radius: 12px; width: 100%; outline: none; }
        .pin-container { position: relative; width: 100%; }
        .pin-eye { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: #666; cursor: pointer; z-index: 10; padding: 5px; }
        #auth-screen { position: fixed; inset: 0; background: #0A0A0B; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        .toggle-switch { width: 44px; height: 22px; background: #262629; border-radius: 20px; position: relative; cursor: pointer; transition: 0.3s; }
        .toggle-switch.on { background: #00FF41; }
        .knob { width: 18px; height: 18px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.2s; pointer-events: none; }
        .on .knob { left: 24px; }
        .t-btn { flex: 1; padding: 8px; font-size: 10px; font-weight: 900; background: #262629; border-radius: 8px; color: #666; text-align: center; cursor: pointer; }
        .t-btn.active { background: #EAB308; color: black; }
        .pivot-card { background: rgba(234, 179, 8, 0.05); border: 1px solid rgba(234, 179, 8, 0.2); padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    </style>
</head>
<body id="main-body" class="p-6" style="padding-top: calc(var(--safe-top) + 20px);">

    <div id="auth-screen" class="view-hidden">
        <p class="text-[10px] tracking-[0.5em] uppercase font-black text-emerald-500 mb-8">System Lock</p>
        <div class="pin-container">
            <input id="auth-pin" type="password" class="input-dark text-center text-2xl" placeholder="PIN or Key">
            <span class="pin-eye" onclick="VaultUI.togglePinDisplay('auth-pin')">👁️</span>
        </div>
        <button onclick="VaultUI.authenticate()" class="mt-8 w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase">Unlock</button>
    </div>

    <div id="dashboard-view" class="space-y-6">
        <div class="flex justify-between items-center mb-8">
            <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/40">Sovereign Command</p>
            <div class="flex gap-3">
                <button onclick="VaultUI.toggleStealth()" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-700 m-0">👁️</button>
                <button onclick="VaultUI.changeView('settings-view')" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-700 m-0">⚙️</button>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 id="nw-display" class="text-5xl font-black tracking-tighter text-[#00FF41] maskable">₦0.00</h1>
            <div class="text-[8px] uppercase font-bold text-zinc-600 mt-3 flex justify-center gap-3">
                <span>Cash: <b id="split-cash" class="maskable text-zinc-400">₦0</b></span>
                <span>Assets: <b id="split-as" class="maskable text-zinc-400">₦0</b></span>
                <span>Debtors: <b id="split-db" class="maskable text-zinc-400">₦0</b></span>
            </div>
        </div>

        <div id="cards-container">
            <div id="feat-tactical" class="vault-card emerald-border">
                <div class="p-6 flex justify-between items-center"><span>Tactical Liquidity</span><div class="flex items-center gap-4"><b id="tc-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-tactical')">▼</span></div></div>
                <div class="sub-drawer space-y-4 text-xs font-bold uppercase">
                    <div id="bills-node">
                        <div class="flex justify-between items-center py-2 border-b border-zinc-900" onclick="VaultUI.toggleCard('bills-node')"><span>Bills</span><span id="b-total" class="maskable">₦0</span></div>
                        <div class="sub-drawer space-y-3 text-[10px] text-zinc-400 normal-case">
                            <div class="flex justify-between"><span>Core</span><span id="b-core" class="maskable">₦0</span></div>
                            <div class="flex justify-between"><span>Reserve</span><span id="b-reserve" class="maskable">₦0</span></div>
                            <div class="flex justify-between"><span>Ops</span><span id="b-ops" class="maskable">₦0</span></div>
                        </div>
                    </div>
                    <div class="flex justify-between py-2 border-b border-zinc-900"><span>Savings</span><span id="s-total" class="maskable">₦0</span></div>
                    <div class="flex justify-between py-2"><span>Spend</span><span id="l-total" class="maskable">₦0</span></div>
                </div>
            </div>
            <div id="feat-assets" class="vault-card"><div class="p-6 flex justify-between"><span>Assets</span><div class="flex items-center gap-4"><b id="as-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-assets')">▼</span></div></div><div id="as-list" class="sub-drawer"></div></div>
            <div id="feat-debtors" class="vault-card"><div class="p-6 flex justify-between"><span>Debtors</span><div class="flex items-center gap-4"><b id="db-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-debtors')">▼</span></div></div><div id="db-list" class="sub-drawer"></div></div>
            <div id="feat-creditors" class="vault-card border-red-900/40"><div class="p-6 flex justify-between"><span>Creditors</span><div class="flex items-center gap-4"><b id="cr-display" class="maskable text-red-500">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-creditors')">▼</span></div></div><div id="cr-list" class="sub-drawer"></div></div>
            <div id="feat-fiduciary" class="vault-card fiduciary-border">
                <div class="p-6 flex justify-between items-center"><span class="text-yellow-500">Fiduciary</span><div class="flex items-center gap-4"><b id="fd-display" class="maskable text-yellow-500">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-fiduciary')">▼</span></div></div>
                <div class="sub-drawer">
                    <div class="flex gap-2 mb-4"><div id="btn-goal" class="t-btn active" onclick="VaultUI.setFdView('goal')">GOAL</div><div id="btn-user" class="t-btn" onclick="VaultUI.setFdView('user')">USER</div></div>
                    <input type="text" id="fd-search" class="input-dark !p-2 !text-[11px] mb-4" placeholder="Search..." onkeyup="VaultUI.render()"><div id="fd-pivot-list" class="space-y-4"></div>
                </div>
            </div>
            <div id="feat-history" class="vault-card opacity-50"><div class="p-6 flex justify-between"><span>History</span><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-history')">
