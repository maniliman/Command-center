<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 8px; width: 100%; outline: none; transition: border-color 0.2s; }
        .input-dark:focus { border-color: #00FF41; }
        
        .stealth-btn { position: relative; z-index: 100 !important; pointer-events: auto !important; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 500 !important; pointer-events: auto !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.2); }
        #menu-overlay { display: none; position: fixed; inset: 0; z-index: 1000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); }
        .menu-open { display: flex !important; }
    </style>
</head>
<body class="p-6 pb-40">

    <div id="dashboard-content">

            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold">Global Net Worth</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="stealth-btn p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800 active:bg-zinc-800">
                Stealth
            </button>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="vault-card p-4 border-l-2 border-emerald-500">
                <p class="text-[#71717A] text-[9px] uppercase mb-1 font-bold">Total Assets</p>
                <p id="total-assets" class="emerald-text font-bold text-lg font-mono">₦0</p>
            </div>
            <div class="vault-card p-4 border-l-2 border-red-500">
                <p class="text-[#71717A] text-[9px] uppercase mb-1 font-bold">Total Debt</p>
                <p id="total-debt" class="oxblood-text font-bold text-lg font-mono">₦0</p>
            </div>
        </div>

        <div class="vault-card p-5 mb-8 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6">Tactical Cash Split</p>
            <div class="space-y-4">
                <details class="group">
                    <summary class="flex justify-between items-center list-none cursor-pointer">
                        <span class="text-xs font-bold text-zinc-500 uppercase">Bills Account</span>
                        <div class="flex items-center gap-2">
                            <span id="alloc-bills" class="text-xs font-bold emerald-text">₦0</span>
                            <span class="text-[8px] text-zinc-700 group-open:rotate-180 transition-transform">▼</span>
                        </div>
                    </summary>
                    <div class="mt-3 pl-4 space-y-2 border-l border-emerald-900/30 pt-2">
                        <div class="flex justify-between text-[10px] text-zinc-500 uppercase font-bold"><span>Emergency (40%)</span><span id="bills-emerge">₦0</span></div>
                        <div class="flex justify-between text-[10px] text-zinc-500 uppercase font-bold"><span>Operational (40%)</span><span id="bills-ops">₦0</span></div>
                        <div class="flex justify-between text-[10px] text-zinc-500 uppercase font-bold"><span>Buffer (20%)</span><span id="bills-buffer">₦0</span></div>
                    </div>
                </details>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Savings Account</span><span id="alloc-savings">₦0</span></div>
