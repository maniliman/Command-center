<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <link rel="icon" href="https://img.icons8.com/nolan/64/safe.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; }
        
        .action-layer { 
            padding-top: var(--safe-top); 
            padding-bottom: 20px;
            background: #0A0A0B;
            position: sticky; top: 0; z-index: 1000;
        }

        .fab-button { 
            position: fixed !important; bottom: 40px !important; right: 30px !important; 
            z-index: 9999 !important; display: flex !important; 
            width: 64px; height: 64px; background: #00FF41; color: black;
            border-radius: 50%; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; border: none; cursor: pointer;
        }

        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 10px; width: 100%; outline: none; }
        
        .overlay { 
            display: none; position: fixed; inset: 0; z-index: 10000 !important; 
            background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); 
            padding: 24px; padding-top: calc(var(--safe-top) + 20px); overflow-y: auto;
        }
        .overlay-open { display: flex !important; flex-direction: column; }

        .progress-bar { background: #262629; border-radius: 4px; height: 6px; overflow: hidden; margin-top: 4px; }
        .progress-fill { background: #00FF41; height: 100%; transition: width 0.6s ease; }
        
        summary { cursor: pointer; list-style: none; outline: none; }
    </style>
</head>
<body class="pb-40">

    <div class="action-layer px-6 flex justify-between items-end">
        <div>
            <p class="text-[9px] tracking-[0.4em] uppercase font-black text-emerald-500/50">Sovereign Vault</p>
            <h1 id="networth" class="text-3xl font-bold mt-1 tracking-tighter">₦0.00</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleOverlay('intel-overlay')" class="p-3 vault-card text-[14px] border border-zinc-800">📊</button>
            <button onclick="toggleOverlay('settings-overlay')" class="p-3 vault-card text-[14px] border border-zinc-800">⚙️</button>
            <button id="stealth-trigger" onclick="togglePrivacy()" class="p-3 vault-card text-[10px] uppercase border border-zinc-800 font-bold">Stealth</button>
        </div>
    </div>

    <div id="dashboard-content" class="px-6 space-y-6 mt-6">
        <div class="vault-card p-6 border border-emerald-900/20">
            <div class="flex justify-between items-center mb-6">
                <p class="text-[10px] uppercase tracking-widest font-black text-zinc-500">Liquid Engine</p>
                <span id="total-cash" class="text-sm emerald-text font-mono font-bold">₦0</span>
            </div>
            <div class="space-y-4">
                <div class="flex justify-between text-xs font-bold uppercase"><span>Bills</span><span id="alloc-bills">₦0</span></div>
                <div class="flex justify-between text-xs font-bold uppercase"><span>Savings</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between text-xs font-bold uppercase"><span>Spend</span><span id="alloc-life">₦0</span></div>
            </div>
        </div>

        <details class="vault-card group border border-emerald-900/10" open>
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black tracking-widest">Assets</span><span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span></summary>
            <div id="multi-tier-assets" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>

        <details class="vault-card group border border-red-900/20" open>
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black tracking-widest oxblood-text">Outflow</span><span id="inv-expenses-total" class="text-sm font-bold oxblood-text">₦0</span></summary>
            <div id="multi-tier-expenses" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>

        <details class="vault-card group border border-yellow-900/10">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black tracking-widest text-yellow-500">Fiduciary</span><span id="f-total-header" class="text-sm font-bold text-yellow-500">₦0</span></summary>
            <div id="fiduciary-main-list" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>
    </div>

    <button onclick="toggleOverlay('entry-overlay')" class="fab-button">+</button>

    <div id="intel-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-8 pb-32">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold uppercase tracking-tighter">Intel Suite</h2>
                <button onclick="toggleOverlay('intel-overlay')" class="text-zinc-600 font-bold uppercase text-[10px]">Close</button>
            </div>

            <div class="vault-card p-5 space-y-6">
                <div>
                    <div class="flex justify-between text-[10px] font-bold uppercase mb-1"><span>Liquidity Ratio</span><span id="txt-liq-ratio">0%</span></div>
                    <div class="progress-bar"><div id="bar-liq" class="progress-fill" style="width: 0%"></div></div>
                </div>
                <div>
                    <div class="flex justify-between text-[10px] font-bold uppercase mb-1"><span>Debt/Expense Load</span><span id="txt-debt-ratio">0%</span></div>
                    <div class="progress-bar"><div id="bar-debt" class="progress-fill !bg-red-500" style="width: 0%"></div></div>
                </div>
            </div>

            <div class="space-y-4">
                <p class="text-[9px] uppercase font-black text-zinc-500">Fiduciary & Expense Auditor</p>
                <input id="intel-search" oninput="runIntelligenceQuery()" class="input-dark" placeholder="Search Contributor or Category...">
                <div id="intel-summary-box" class="hidden p-4 vault-card border-emerald-500/30">
                    <p class="text-[8px] uppercase text-zinc-500">Query Result Total</p>
                    <p id="intel-query-total" class="text-xl font-bold emerald-text">₦0.00</p>
                </div>
                <div id="intel-results" class="space-y-2 max-h-60 overflow-y-auto"></div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <button onclick="downloadCSV()" class="p-4 vault-card text-[9px] font-black uppercase border border-zinc-800">Export CSV</button>
                <button onclick="window.print()" class="p-4 vault-card text-[9px] font-black uppercase border border-zinc-800">Generate PDF</button>
            </div>
        </div>
    </div>

    <div id="entry-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-6 pb-20">
            <h2 class="text-xl font-bold uppercase tracking-tighter">Transaction</h2>
            <div class="space-y-4">
                <select id="form-category" class="input-dark" onchange="handleCatChange()">
                    <option value="Income">Liquid Cash [+]</option>
                    <option value="FixedAsset">Fixed Asset [+]</option>
                    <option value="Expense">Expense [-]</option>
                    <option value="Transfer">Transfer [⇄]</option>
                    <option value="Fiduciary">Fiduciary [💼]</option>
                </select>
                <input id="form-date" type="date" class="input-dark">
                <input id="form-name" class="input-dark" placeholder="Description/Name">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                <div id="fixed-asset-fields" class="hidden">
                    <select id="asset-type" class="input-dark"><option value="Stocks">Stocks</option><option value="Property">Property</option><option value="Vehicles">Vehicles</option></select>
                </div>
                <div id="expense-fields" class="hidden space-y-4">
                    <select id="expense-tier" class="input-dark"><option value="Logistics">Logistics</option><option value="Staffing">Staffing</option><option value="Personal">Personal</option></select>
                    <select id="form-source" class="input-dark"><option value="lifestyle">Deduct: Spend</option><option value="bills">Deduct: Bills</option><option value="savings">Deduct: Savings</option></select>
                </div>
                <div id="transfer-fields" class="hidden space-y-4">
                    <select id="trans-source" class="input-dark"><option value="bills">From Bills</option><option value="savings">From Savings</option><option value="lifestyle">From Spend</option></select>
                    <select id="trans-dest" class="input-dark"><option value="savings">To Savings</option><option value="lifestyle">To Spend</option><option value="bills">To Bills</option></select>
                </div>
            </div>
            <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-black uppercase">Authorize</button>
            <button onclick="toggleOverlay('entry-overlay')" class="w-full text-zinc-600 uppercase text-[10px] font-bold">Cancel</button>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-8">
            <h2 class="text-xl font-bold uppercase tracking-tighter">Settings</h2>
            <input id="set-new-pin" type="password" maxlength="4" class="input-dark" placeholder="Set New PIN">
            <button onclick="updatePin()" class="w-full bg-zinc-800 p-4 rounded uppercase font-bold text-[10px]">Update PIN</button>
            <button onclick="exportData()" class="w-full bg-emerald-500/10 text-emerald-500 p-4 rounded uppercase font-bold text-[10px]">Export Backup</button>
            <button onclick="importData()" class="w-full border border-zinc-800 p-4 rounded uppercase font-bold text-[10px]">Restore Backup</button>
            <button onclick="securePurge()" class="w-full p-4 mt-20 text-red-900 border border-red-900 rounded uppercase font-bold text-[10px]">Wipe All Data</button>
            <button onclick="toggleOverlay('settings-overlay')" class="w-full text-zinc-600 uppercase text-[10px] font-bold">Back</button>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];
        let userPin = localStorage.getItem('vault_pin') || "0000";
        let liq = { bills: 0, savings: 0, lifestyle: 0 };

        document.getElementById('form-date').valueAsDate = new Date();

        function mask(val) { return stealth ? "••••" : (Math.abs(parseFloat(val)) || 0).toLocaleString(); }

        function updateDisplay() {
            let aSum = 0, eSum = 0, fGlobal = 0;
            liq = { bills: 0, savings: 0, lifestyle: 0 };
            const exL = document.getElementById('multi-tier-expenses'), asL = document.getElementById('multi-tier-assets'), fL = document.getElementById('fiduciary-main-list');
            exL.innerHTML = ''; asL.innerHTML = ''; fL.innerHTML = '';
            
            const expGroups = {}, assetGroups = {};

            ledger.forEach(item => {
                const val = parseFloat(item.amount) || 0;
                liq.bills += (item.bills || 0); liq.savings += (item.savings || 0); liq.lifestyle += (item.lifestyle || 0);
                if (val < 0) {
                    const t = item.tier || 'Other'; expGroups[t] = (expGroups[t] || 0) + Math.abs(val); eSum += Math.abs(val);
                } else {
                    const t = item.type || 'Cash'; assetGroups[t] = (assetGroups[t] || 0) + val; aSum += val;
                }
            });

            for (const t in expGroups) exL.innerHTML += `<div class="flex justify-between text-[11px] font-bold"><span>${t}</span><span class="oxblood-text">₦${mask(expGroups[t])}</span></div>`;
            for (const t in assetGroups) asL.innerHTML += `<div class="flex justify-between text-[11px] font-bold"><span>${t}</span><span class="emerald-text">₦${mask(assetGroups[t])}</span></div>`;

            const fGroups = fLedger.reduce((acc, item) => {
                const val = parseFloat(item.amount) || 0;
                if (!acc[item.name]) acc[item.name] = { total: 0 };
                acc[item.name].total += val; fGlobal += val; return acc;
            }, {});
            for (const n in fGroups) fL.innerHTML += `<div class="flex justify-between text-[11px] font-bold"><span>${n}</span><span class="text-yellow-500">₦${mask(fGroups[n].total)}</span></div>`;

            const cashT = liq.bills + liq.savings + liq.lifestyle;
            document.getElementById('alloc-bills').innerText = "₦" + mask(liq.bills);
            document.getElementById('alloc-savings').innerText = "₦" + mask(liq.savings);
            document.getElementById('alloc-life').innerText = "₦" + mask(liq.lifestyle);
            document.getElementById('total-cash').innerText = "₦" + mask(cashT);
            document.getElementById('inv-expenses-total').innerText = "₦" + mask(eSum);
            document.getElementById('inv-assets-total').innerText = "₦" + mask(aSum);
            document.getElementById('f-total-header').innerText = "₦" + mask(fGlobal);
            document.getElementById('networth').innerText = "₦" + mask(aSum - eSum);

            // INTEL PROGRESS
            const lRatio = aSum > 0 ? (cashT / aSum) * 100 : 0;
            document.getElementById('bar-liq').style.width = lRatio + "%";
            document.getElementById('txt-liq-ratio').innerText = Math.round(lRatio) + "%";
            const eRatio = aSum > 0 ? (eSum / aSum) * 100 : 0;
            document.getElementById('bar-debt').style.width = Math.min(eRatio, 100) + "%";
            document.getElementById('txt-debt-ratio').innerText = Math.round(eRatio) + "%";
        }

        function handleCatChange() {
            const cat = document.getElementById('form-category').value;
            document.getElementById('fixed-asset-fields').classList.toggle('hidden', cat !== 'FixedAsset');
            document.getElementById('expense-fields').classList.toggle('hidden', cat !== 'Expense');
            document.getElementById('transfer-fields').classList.toggle('hidden', cat !== 'Transfer');
        }

        function toggleOverlay(id) { document.getElementById(id).classList.toggle('overlay-open'); }
        function togglePrivacy() { stealth = !stealth; document.getElementById('stealth-trigger').classList.toggle('stealth-active', stealth); updateDisplay(); }

        function submitEntry() {
            const cat = document.getElementById('form-category').value, name = document.getElementById('form-name').value;
            const amount = parseFloat(document.getElementById('form-amount').value), dateVal = document.getElementById('form-date').value;
            if (!name || isNaN(amount)) return;
            const entryDate = new Date(dateVal).toLocaleDateString();

            if (cat === 'Expense') {
                const src = document.getElementById('form-source').value, tier = document.getElementById('expense-tier').value;
                if (amount > liq[src]) { alert("Denied: Overdraft."); return; }
                ledger.push({ name, amount: -amount, [src]: -amount, tier, date: entryDate, rawDate: dateVal });
            } else if (cat === 'Income') {
                ledger.push({ name, amount, bills: amount*0.4, savings: amount*0.4, lifestyle: amount*0.2, date: entryDate, rawDate: dateVal, type: 'Cash' });
            } else if (cat === 'FixedAsset') {
                const type = document.getElementById('asset-type').value;
                ledger.push({ name, amount, type, date: entryDate, rawDate: dateVal });
            } else if (cat === 'Transfer') {
                const src = document.getElementById('trans-source').value, dest = document.getElementById('trans-dest').value;
                if (amount > liq[src]) { alert("Insufficient funds."); return; }
                ledger.push({ name: `Transfer: ${name}`, amount: 0, [src]: -amount, [dest]: amount, date: entryDate, rawDate: dateVal });
            } else { fLedger.push({ name, amount, date: entryDate, rawDate: dateVal }); }

            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            localStorage.setItem('fiduciary_ledger', JSON.stringify(fLedger));
            updateDisplay(); toggleOverlay('entry-overlay');
        }

        function runIntelligenceQuery() {
            const q = document.getElementById('intel-search').value.toLowerCase();
            const res = document.getElementById('intel-results');
            const summaryBox = document.getElementById('intel-summary-box');
            res.innerHTML = ''; let total = 0;
            if(!q) { summaryBox.classList.add('hidden'); return; }
            summaryBox.classList.remove('hidden');
            [...ledger, ...fLedger].forEach(i => {
                if(i.name.toLowerCase().includes(q) || (i.tier && i.tier.toLowerCase().includes(q))) {
                    total += Math.abs(parseFloat(i.amount));
                    res.innerHTML += `<div class="flex justify-between p-3 vault-card text-[10px] font-bold uppercase"><span>${i.name}</span><span class="${i.amount < 0 ? 'oxblood-text' : 'emerald-text'}">₦${mask(i.amount)}</span></div>`;
                }
            });
            document.getElementById('intel-query-total').innerText = "₦" + total.toLocaleString();
        }

        function updatePin() { const p = document.getElementById('set-new-pin').value; if(p.length===4){localStorage.setItem('vault_pin',p);userPin=p;alert("Updated.");} }
        function securePurge() { if(prompt("PIN:")===userPin){localStorage.clear();location.reload();} }
        function exportData() { prompt("Key:", btoa(JSON.stringify({ledger, fLedger}))); }
        function importData() { const k = prompt("Key:"); if(k){ const p = JSON.parse(atob(k)); ledger=p.ledger; fLedger=p.fLedger; updateDisplay(); } }
        function downloadCSV() { let csv = "Date,Name,Amount\n"; [...ledger, ...fLedger].forEach(i => csv += `${i.date},${i.name},${i.amount}\n`); const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='Vault.csv'; a.click(); }

        updateDisplay();
    </script>
</body>
</html>
