<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Vault v80</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/shield.png">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Vault%22,%22short_name%22:%22Vault%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#10B981%22,%22icons%22:[{%22src%22:%22https://img.icons8.com/fluency/512/shield.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #E5E5E5;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-blue: #3B82F6;
            --accent-yellow: #EAB308;
            --zinc-800: #27272a;
            --zinc-900: #18181b;
            --glass: rgba(20, 20, 20, 0.8);
            --safe-top: env(safe-area-inset-top, 20px);
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; outline: none; }
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: 'Inter', sans-serif; 
            margin: 0; padding: 0; 
            padding-top: calc(var(--safe-top) + 10px); 
            padding-bottom: 120px; 
            overflow-x: hidden;
            transition: background 0.4s ease;
        }

        .mono { font-family: 'JetBrains Mono', monospace; letter-spacing: -0.5px; }

        /* UTILITIES */
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 8px; } .gap-4 { gap: 16px; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
        .p-5 { padding: 20px; } .p-6 { padding: 24px; }
        .text-xs { font-size: 11px; } .text-sm { font-size: 14px; } .font-bold { font-weight: 700; } .font-black { font-weight: 900; }
        .uppercase { text-transform: uppercase; letter-spacing: 1px; }
        .hidden { display: none !important; }

        /* CYBER CARDS */
        .glass-panel { background: var(--glass); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        
        .hero-card { 
            background: linear-gradient(145deg, #0a0a0a 0%, #000 100%); 
            border: 1px solid rgba(16, 185, 129, 0.15); 
            border-radius: 32px; 
            padding: 40px 20px; 
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.05);
            margin: 10px;
        }

        .vault-card { 
            background: #080808; 
            border: 1px solid #1a1a1a; 
            border-radius: 20px; 
            margin-bottom: 12px; 
            width: 100%; 
            overflow: hidden; 
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card-glow-green { border-color: rgba(16, 185, 129, 0.3); box-shadow: 0 0 15px rgba(16, 185, 129, 0.05); }
        .card-glow-red { border-color: rgba(239, 68, 68, 0.3); box-shadow: 0 0 15px rgba(239, 68, 68, 0.05); }
        .card-glow-blue { border-color: rgba(59, 130, 246, 0.3); box-shadow: 0 0 15px rgba(59, 130, 246, 0.05); }

        .sub-drawer { 
            display: none; 
            padding: 20px; 
            background: #040404; 
            border-top: 1px solid #111; 
            animation: slideIn 0.3s ease-out;
        }
        .drawer-open > .sub-drawer { display: block; }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        /* INPUTS */
        .input-ghost { background: transparent; border: none; color: white; font-size: 18px; width: 100%; padding: 16px 0; border-bottom: 1px solid #222; border-radius: 0; }
        .input-ghost:focus { border-bottom-color: var(--accent-green); }
        .amount-hero { font-family: 'JetBrains Mono', monospace; font-size: 56px; font-weight: 900; text-align: center; color: #fff; width: 100%; background: transparent; border: none; padding: 30px 0; }
        
        /* BOTTOM ZONE NAV */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            padding: 20px; padding-bottom: calc(var(--safe-bottom) + 10px);
            background: linear-gradient(transparent, #000);
            display: flex; justify-content: center; gap: 20px; z-index: 5000;
        }

        .fab-btn { 
            width: 72px; height: 72px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 32px; border: none; cursor: pointer;
            transition: transform 0.2s active;
        }
        .fab-btn:active { transform: scale(0.9); }
        .fab-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: #000; box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3); }
        .fab-back { background: var(--zinc-800); color: white; }

        /* GRID ENTRY */
        .btn-grid { 
            background: #0a0a0a; border: 1px solid #222; border-radius: 24px; padding: 25px; 
            display: flex; flex-direction: column; align-items: center; gap: 12px; cursor: pointer;
        }
        .btn-grid:active { background: #111; border-color: #444; }

        /* SMART FLUID BAR */
        .fluid-bar { display: flex; border-radius: 16px; overflow: hidden; margin: 25px 0; border: 1px solid #222; background: #050505; }
        .fluid-seg { padding: 15px 0; text-align: center; font-size: 10px; font-weight: 800; border-right: 1px solid #111; color: #555; width: 33.33%; }
        .fluid-input { background: transparent; width: 100%; text-align: center; color: var(--accent-green); font-size: 16px; font-weight: 900; border: none; font-family: 'JetBrains Mono'; }

        /* OVERLAYS */
        .view-hidden { display: none !important; }
        .full-overlay { 
            position: fixed; inset: 0; background: black; z-index: 4000; 
            padding: 20px; padding-top: calc(var(--safe-top) + 20px); 
            overflow-y: auto; 
            animation: morphIn 0.3s cubic-bezier(0.19, 1, 0.22, 1);
        }
        @keyframes morphIn { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* COLORS & TYPES */
        .text-emerald { color: var(--accent-green); }
        .text-red { color: var(--accent-red); }
        .text-blue { color: var(--accent-blue); }
        .text-yellow { color: var(--accent-yellow); }
        .text-zinc { color: #52525b; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        /* STEALTH */
        .stealth-active .maskable { filter: blur(15px); opacity: 0.2; }
    </style>
</head>
<body>

    <div id="auth-screen" class="full-overlay view-hidden" style="z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="font-size: 64px; margin-bottom: 30px;">🔒</div>
        <input id="auth-pin" type="password" class="mono" style="background:transparent; border:none; color:white; text-align: center; font-size: 48px; letter-spacing: 15px; width: 220px;" placeholder="••••" maxlength="4" inputmode="numeric">
        <button onclick="VaultUI.authenticate()" class="p-5 w-full glass-panel font-black uppercase" style="margin-top: 50px; border-color: var(--accent-green);">Access Vault</button>
    </div>

    <div class="flex justify-between items-center p-5 mb-2">
        <span class="text-xs font-black uppercase text-zinc">Sovereign v80</span>
        <div class="flex gap-4">
            <button onclick="VaultUI.changeView('query-lab')" style="background:none; border:none; font-size: 20px;">🔍</button>
            <button onclick="VaultUI.toggleStealth()" style="background:none; border:none; font-size: 20px;">👁️</button>
            <button onclick="VaultUI.changeView('settings-view')" style="background:none; border:none; font-size: 20px;">⚙️</button>
        </div>
    </div>

    <div id="dashboard-view">
        <div class="hero-card text-center">
            <h1 id="nw-display" class="amount-hero maskable mono">₦0.00</h1>
            <div class="flex justify-center gap-6" style="opacity: 0.6;">
                <div class="text-center"><p id="split-cash" class="mono text-sm font-bold maskable text-emerald">₦0</p><p class="text-xs font-black text-zinc uppercase" style="font-size: 8px;">Liquid</p></div>
                <div class="text-center"><p id="split-as" class="mono text-sm font-bold maskable text-blue">₦0</p><p class="text-xs font-black text-zinc uppercase" style="font-size: 8px;">Assets</p></div>
                <div class="text-center"><p id="split-db" class="mono text-sm font-bold maskable text-yellow">₦0</p><p class="text-xs font-black text-zinc uppercase" style="font-size: 8px;">Debt</p></div>
            </div>
        </div>

        <div id="cards-container" style="padding: 10px;">
            <div id="feat-tactical" class="vault-card card-glow-green">
                <div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-tactical')">
                    <span class="text-xs font-black uppercase">Liquidity</span>
                    <b id="tc-display" class="maskable mono text-sm text-emerald">₦0</b>
                </div>
                <div class="sub-drawer">
                    <div class="flex justify-between uppercase text-xs mb-4"><span>Bills</span><span id="b-total" class="maskable mono font-bold">₦0</span></div>
                    <div class="flex justify-between uppercase text-xs mb-4"><span>Savings</span><span id="s-total" class="maskable mono font-bold">₦0</span></div>
                    <div class="flex justify-between uppercase text-xs"><span>Spend</span><span id="l-total" class="maskable mono font-bold">₦0</span></div>
                </div>
            </div>
            
            <div id="feat-expenses" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-expenses')"><span class="text-xs font-black uppercase text-red">Expenses</span><b id="ex-display" class="maskable mono text-sm text-red">₦0</b></div><div id="ex-list" class="sub-drawer"></div></div>
            <div id="feat-assets" class="vault-card card-glow-blue"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-assets')"><span class="text-xs font-black uppercase text-blue">Assets</span><b id="as-display" class="maskable mono text-sm text-blue">₦0</b></div><div id="as-list" class="sub-drawer"></div></div>
            <div id="feat-debtors" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-debtors')"><span class="text-xs font-black uppercase">Debtors</span><b id="db-display" class="maskable mono text-sm text-emerald">₦0</b></div><div id="db-list" class="sub-drawer"></div></div>
            <div id="feat-creditors" class="vault-card card-glow-red"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-creditors')"><span class="text-xs font-black uppercase text-zinc">Creditors</span><b id="cr-display" class="maskable mono text-sm text-red">₦0</b></div><div id="cr-list" class="sub-drawer"></div></div>
            <div id="feat-fiduciary" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-fiduciary')"><span class="text-xs font-black uppercase text-yellow">Fiduciary</span><b id="fd-display" class="maskable mono text-sm text-yellow">₦0</b></div><div class="sub-drawer"><div id="fd-pivot-list"></div></div></div>
            <div id="feat-history" class="vault-card" style="opacity: 0.5;"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-history')"><span class="text-xs font-black uppercase text-zinc">Audit Trail</span><span>▼</span></div><div class="sub-drawer"><div id="hi-list"></div></div></div>
        </div>
    </div>

    <div id="entry-grid" class="full-overlay view-hidden">
        <h2 class="text-sm font-black uppercase mb-6 text-center">Select Transmission</h2>
        <div class="grid-2">
            <button onclick="VaultUI.openForm('income')" class="btn-grid" style="border-color: #064E3B;">📥<span class="text-xs font-bold uppercase text-emerald">Inflow</span></button>
            <button onclick="VaultUI.openForm('expense')" class="btn-grid" style="border-color: #7F1D1D;">📤<span class="text-xs font-bold uppercase text-red">Expense</span></button>
            <button onclick="VaultUI.openForm('asset')" class="btn-grid">💎<span class="text-xs font-bold uppercase text-blue">Asset</span></button>
            <button onclick="VaultUI.openForm('creditor')" class="btn-grid">🔴<span class="text-xs font-bold uppercase text-red">Borrow</span></button>
            <button onclick="VaultUI.openForm('debtor')" class="btn-grid">🟢<span class="text-xs font-bold uppercase text-emerald">Lend</span></button>
            <button onclick="VaultUI.openForm('fiduciary')" class="btn-grid">💼<span class="text-xs font-bold uppercase text-yellow">Fiduciary</span></button>
        </div>
    </div>

    <div id="entry-form" class="full-overlay view-hidden">
        <div id="settle-toggle-container" class="mb-6"></div>
        <input id="e-amount" type="number" class="amount-hero" placeholder="0" inputmode="decimal">
        
        <div id="fluid-container" class="hidden">
            <div class="fluid-bar">
                <div class="fluid-seg">BILLS<input id="fluid-bills" type="number" class="fluid-input" value="40" oninput="VaultUI.smartBalance('bills')"></div>
                <div class="fluid-seg">SAVE<input id="fluid-save" type="number" class="fluid-input" value="40" oninput="VaultUI.smartBalance('save')"></div>
                <div class="fluid-seg" style="border-right: none;">SPEND<input id="fluid-spend" type="number" class="fluid-input" value="20" oninput="VaultUI.smartBalance('spend')"></div>
            </div>
            <div id="fluid-preview" class="text-center text-xs text-zinc mb-4 mono"></div>
        </div>

        <div id="dynamic-inputs" class="mb-4"></div>
        <input id="e-name" class="input-ghost" placeholder="Description" list="active-list">
        <datalist id="active-list"></datalist>
        
        <button onclick="VaultCore.execute()" class="p-6 w-full glass-panel font-black uppercase" style="margin-top: 40px; border-color: var(--accent-green); color: var(--accent-green);">Execute Transaction</button>
    </div>

    <div id="settings-view" class="full-overlay view-hidden">
        <h2 class="text-sm font-black uppercase mb-6">Security & Backup</h2>
        <div class="glass-panel p-6 mb-4">
            <p class="text-xs font-black uppercase mb-4">Authentication</p>
            <input id="set-pin" type="password" maxlength="4" class="input-ghost text-center mono" style="letter-spacing: 15px;" placeholder="••••">
            <button onclick="VaultCore.savePin()" class="w-full p-4 glass-panel text-xs font-bold mt-4">Update PIN</button>
        </div>
        <div class="grid-2">
            <button onclick="VaultCore.export()" class="p-5 glass-panel text-xs font-black">BACKUP</button>
            <button onclick="VaultCore.wipe()" class="p-5 glass-panel text-xs font-black text-red">WIPE</button>
        </div>
    </div>

    <div id="query-lab" class="full-overlay view-hidden">
        <input type="text" id="q-search" class="input-ghost" placeholder="Search Archives..." onkeyup="VaultUI.runQuery()">
        <div id="q-results" class="flex-col gap-2 mt-6"></div>
    </div>

    <div class="bottom-nav">
        <button id="nav-back" onclick="VaultUI.handleBack()" class="fab-btn fab-back hidden">↩</button>
        <button id="nav-fab" onclick="VaultUI.changeView('entry-grid')" class="fab-btn fab-primary">+</button>
    </div>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('SOV_DB_V80')) || [];
            let pin = localStorage.getItem('SOV_PIN_V80') || "";
            const save = () => { 
                localStorage.setItem('SOV_DB_V80', JSON.stringify(db)); 
                localStorage.setItem('SOV_PIN_V80', pin); 
            };
            
            return {
                db: () => db,
                pin: () => pin,
                savePin: () => { 
                    const p = document.getElementById('set-pin').value;
                    if(p.length === 4) { pin = p; save(); alert("PIN SET"); }
                },
                execute: () => {
                    const amt = parseFloat(document.getElementById('e-amount').value);
                    const desc = document.getElementById('e-name').value;
                    if(!desc || isNaN(amt)) return;

                    let entry = { 
                        id: Date.now(), 
                        name: desc, 
                        total: amt, 
                        type: activeType, 
                        date: new Date().toLocaleDateString(),
                        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
                    };

                    if(activeType === 'income') {
                        const bP = parseInt(document.getElementById('fluid-bills').value)/100;
                        const sP = parseInt(document.getElementById('fluid-save').value)/100;
                        const lP = parseInt(document.getElementById('fluid-spend').value)/100;
                        entry.b = amt * bP; entry.s = amt * sP; entry.l = amt * lP;
                    } 
                    else if(activeType === 'expense') entry.total = -amt;
                    else if(activeType === 'asset') entry.cat = document.getElementById('e-as-cat').value;
                    else if(activeType === 'creditor') { entry.total = -amt; entry.creditor = desc; }
                    else if(activeType === 'debtor') entry.debtor = desc;
                    else if(activeType === 'fiduciary') { entry.goal = document.getElementById('e-fd-goal').value; entry.user = document.getElementById('e-fd-user').value; }

                    db.push(entry);
                    save();
                    VaultUI.changeView('dashboard-view');
                },
                delete: id => { if(confirm("Purge?")) { db = db.filter(x => x.id !== id); save(); VaultUI.render(); } },
                export: () => {
                    const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                    a.download = `Vault_Backup_${Date.now()}.json`; a.click();
                },
                wipe: () => { if(confirm("FACTORY RESET?")) { localStorage.clear(); location.reload(); } }
            };
        })();

        let activeType = 'income', lastModified = ['bills', 'save'];

        const VaultUI = (() => {
            return {
                init: () => {
                    if(VaultCore.pin()) VaultUI.changeView('auth-screen');
                    else VaultUI.render();
                },
                authenticate: () => {
                    if(document.getElementById('auth-pin').value === VaultCore.pin()) {
                        document.getElementById('auth-screen').classList.add('view-hidden');
                        VaultUI.render();
                    } else alert("DENIED");
                },
                toggleCard: id => document.getElementById(id).classList.toggle('drawer-open'),
                toggleStealth: () => document.body.classList.toggle('stealth-active'),
                
                smartBalance: (field) => {
                    if (lastModified[0] !== field) {
                        lastModified[1] = lastModified[0];
                        lastModified[0] = field;
                    }
                    
                    const f1 = document.getElementById(`fluid-${lastModified[0]}`);
                    const f2 = document.getElementById(`fluid-${lastModified[1]}`);
                    const remainingField = ['bills', 'save', 'spend'].find(f => !lastModified.includes(f));
                    const f3 = document.getElementById(`fluid-${remainingField}`);

                    let v1 = parseInt(f1.value) || 0;
                    let v2 = parseInt(f2.value) || 0;
                    
                    if(v1 + v2 > 100) { v2 = 100 - v1; f2.value = v2; }
                    f3.value = 100 - (v1 + v2);

                    const amt = parseFloat(document.getElementById('e-amount').value) || 0;
                    document.getElementById('fluid-preview').innerText = 
                        `₦${(amt * v1/100).toLocaleString()} | ₦${(amt * v2/100).toLocaleString()} | ₦${(amt * (100-v1-v2)/100).toLocaleString()}`;
                },

                changeView: id => {
                    document.querySelectorAll('.full-overlay, #dashboard-view').forEach(v => v.classList.add('view-hidden'));
                    document.getElementById(id).classList.remove('view-hidden');
                    
                    const fab = document.getElementById('nav-fab');
                    const back = document.getElementById('nav-back');

                    if(id === 'dashboard-view') {
                        fab.classList.remove('hidden'); back.classList.add('hidden');
                        VaultUI.render();
                    } else {
                        fab.classList.add('hidden'); back.classList.remove('hidden');
                    }
                },

                handleBack: () => {
                    const current = Array.from(document.querySelectorAll('.full-overlay')).find(v => !v.classList.contains('view-hidden'));
                    if(current.id === 'entry-form') VaultUI.changeView('entry-grid');
                    else VaultUI.changeView('dashboard-view');
                },

                openForm: type => {
                    activeType = type;
                    VaultUI.changeView('entry-form');
                    const dyn = document.getElementById('dynamic-inputs'), fluid = document.getElementById('fluid-container');
                    dyn.innerHTML = ''; fluid.classList.add('hidden');

                    if(type === 'income') fluid.classList.remove('hidden');
                    else if(type === 'asset') dyn.innerHTML = '<select id="e-as-cat" class="input-ghost"><option value="Property">Property</option><option value="Stock">Stock</option><option value="Crypto">Crypto</option></select>';
                    else if(type === 'fiduciary') dyn.innerHTML = '<input id="e-fd-goal" class="input-ghost mb-4" placeholder="Project Name"><input id="e-fd-user" class="input-ghost" placeholder="Contributor">';
                },

                render: () => {
                    const db = VaultCore.db();
                    let nw = 0, cash = 0, b = 0, s = 0, l = 0, assets = 0, debt = 0, fd = 0, ex = 0;
                    
                    document.querySelectorAll('.sub-drawer').forEach(d => { if(!d.id.includes('list')) return; d.innerHTML = ''; });
                    
                    db.slice().reverse().forEach(i => {
                        if(i.type === 'fiduciary') fd += i.total;
                        else {
                            nw += i.total; cash += (i.b || 0) + (i.s || 0) + (i.l || 0);
                            b += i.b || 0; s += i.s || 0; l += i.l || 0;
                            if(i.type === 'expense') ex += Math.abs(i.total);
                            if(i.type === 'asset') assets += i.total;
                            if(i.type === 'creditor') debt += Math.abs(i.total);
                            if(i.type === 'debtor') debt -= i.total;
                        }
                        
                        const itemHtml = `<div class="flex justify-between py-3 border-b border-zinc-900 text-xs mono">
                            <span>${i.time} | ${i.name}</span>
                            <div class="flex gap-4"><b class="${i.total < 0 ? 'text-red' : 'text-emerald'}">₦${Math.abs(i.total).toLocaleString()}</b>
                            <button onclick="VaultCore.delete(${i.id})" style="background:none; border:none; color:#555;">✕</button></div>
                        </div>`;
                        document.getElementById('hi-list').innerHTML += itemHtml;
                    });

                    const set = (id, v) => { if(document.getElementById(id)) document.getElementById(id).innerText = "₦" + Math.round(v).toLocaleString(); };
                    set('nw-display', nw); set('split-cash', cash); set('split-as', assets); set('split-db', debt);
                    set('tc-display', cash); set('b-total', b); set('s-total', s); set('l-total', l);
                    set('ex-display', ex); set('as-display', assets); set('db-display', debt); set('fd-display', fd);
                },

                runQuery: () => {
                    const s = document.getElementById('q-search').value.toLowerCase();
                    const res = document.getElementById('q-results'); res.innerHTML = '';
                    VaultCore.db().filter(i => i.name.toLowerCase().includes(s)).reverse().forEach(i => {
                        res.innerHTML += `<div class="glass-panel p-4 mb-2 flex justify-between mono text-xs"><span>${i.date} | ${i.name}</span><b>₦${Math.abs(i.total).toLocaleString()}</b></div>`;
                    });
                }
            };
        })();

        window.onload = VaultUI.init;
    </script>
</body>
</html>
