<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .menu-btn { width: 100%; padding: 20px; border-radius: 12px; background: #161618; border: 1px solid #262629; text-align: left; display: flex; justify-content: space-between; align-items: center; }
        .view-container { display: none; }
        .view-container.active { display: block; }
    </style>
</head>
<body class="p-6">

    <div id="view-menu" class="view-container active">
        <header class="mb-10 pt-4">
            <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase">Sovereign Vault</p>
            <h1 id="main-nw" class="text-4xl font-bold mt-2 tracking-tighter">₦0</h1>
        </header>

        <div class="space-y-4">
            <button onclick="showView('view-assets')" class="menu-btn">
                <span>💰 Assets & Cash</span>
                <span class="text-[#71717A]">→</span>
            </button>
            <button onclick="showView('view-goals')" class="menu-btn">
                <span>🎯 Strategic Goals</span>
                <span class="text-[#71717A]">→</span>
            </button>
            <button onclick="showView('view-debt')" class="menu-btn">
                <span>⚖️ Debtors & Creditors</span>
                <span class="text-[#71717A]">→</span>
            </button>
            <button onclick="showView('view-history')" class="menu-btn">
                <span>📜 Global Ledger</span>
                <span class="text-[#71717A]">→</span>
            </button>
        </div>
    </div>

    <div id="view-assets" class="view-container">
        <button onclick="showView('view-menu')" class="mb-6 text-[#71717A] text-xs">← BACK TO MENU</button>
        <h2 class="text-xl font-bold mb-6">Asset Management</h2>
        <div class="vault-card p-6 mb-6">
            <p class="text-[10px] uppercase text-[#71717A]">Liquid Cash</p>
            <p id="asset-total" class="text-2xl font-bold emerald-text mt-1">₦0</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="logTx('IN', 'gen')" class="vault-card p-4 text-center border-emerald-900/30">Deposit</button>
            <button onclick="logTx('OUT', 'gen')" class="vault-card p-4 text-center border-red-900/30">Spend</button>
        </div>
    </div>

    <div id="view-goals" class="view-container">
        <button onclick="showView('view-menu')" class="mb-6 text-[#71717A] text-xs">← BACK TO MENU</button>
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold">Target Envelopes</h2>
            <button onclick="createGoal()" class="emerald-text text-xs">+ NEW</button>
        </div>
        <div id="goals-list" class="space-y-4"></div>
    </div>

    <div id="view-debt" class="view-container">
        <button onclick="showView('view-menu')" class="mb-6 text-[#71717A] text-xs">← BACK TO MENU</button>
        <h2 class="text-xl font-bold mb-6">Liability & Credit</h2>
        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="vault-card p-4">
                <p class="text-[8px] uppercase text-[#71717A]">Owed to Me</p>
                <p id="total-debtors" class="emerald-text text-sm font-bold">₦0</p>
            </div>
            <div class="vault-card p-4">
                <p class="text-[8px] uppercase text-[#71717A]">Owed to Others</p>
                <p id="total-creditors" class="oxblood-text text-sm font-bold">₦0</p>
            </div>
        </div>
        <div class="space-y-4">
            <button onclick="logTx('DEBTOR', 'debt')" class="w-full vault-card p-4 text-left">➕ Add Debtor (Person owes me)</button>
            <button onclick="logTx('CREDITOR', 'debt')" class="w-full vault-card p-4 text-left">➖ Add Creditor (I owe person)</button>
        </div>
    </div>

    <div id="view-history" class="view-container">
        <button onclick="showView('view-menu')" class="mb-6 text-[#71717A] text-xs">← BACK TO MENU</button>
        <h2 class="text-xl font-bold mb-6">Global History</h2>
        <div id="master-ledger" class="space-y-3"></div>
    </div>

    <script>
        let history = JSON.parse(localStorage.getItem('sov_history')) || [];
        let goals = JSON.parse(localStorage.getItem('sov_goals')) || [];

        function showView(viewId) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            updateDisplay();
        }

        function updateDisplay() {
            let nw = 0; let assets = 0; let debtors = 0; let creditors = 0;
            const goalBals = {}; goals.forEach(g => goalBals[g.id] = 0);

            history.forEach(item => {
                if (item.type === 'IN') { assets += item.amount; nw += item.amount; if(goalBals.hasOwnProperty(item.goalId)) goalBals[item.goalId] += item.amount; }
                if (item.type === 'OUT') { assets -= item.amount; nw -= item.amount; if(goalBals.hasOwnProperty(item.goalId)) goalBals[item.goalId] -= item.amount; }
                if (item.type === 'DEBTOR') { debtors += item.amount; nw += item.amount; }
                if (item.type === 'CREDITOR') { creditors += item.amount; nw -= item.amount; }
            });

            document.getElementById('main-nw').innerText = "₦" + nw.toLocaleString();
            if(document.getElementById('asset-total')) document.getElementById('asset-total').innerText = "₦" + assets.toLocaleString();
            if(document.getElementById('total-debtors')) document.getElementById('total-debtors').innerText = "₦" + debtors.toLocaleString();
            if(document.getElementById('total-creditors')) document.getElementById('total-creditors').innerText = "₦" + creditors.toLocaleString();

            // Goals Rendering
            document.getElementById('goals-list').innerHTML = goals.map(g => {
                const bal = goalBals[g.id] || 0;
                const pct = g.target > 0 ? Math.min((bal/g.target)*100, 100) : 0;
                return `<div class="vault-card p-4">
                    <div class="flex justify-between text-xs mb-2"><span>${g.name}</span><span class="emerald-text font-bold">${Math.floor(pct)}%</span></div>
                    <div class="h-1 bg-[#262629] rounded-full overflow-hidden"><div class="h-full bg-[#00FF41]" style="width:${pct}%"></div></div>
                    <div class="flex justify-between text-[10px] mt-2 text-[#71717A]"><span>₦${bal.toLocaleString()}</span><span>Goal: ₦${g.target.toLocaleString()}</span></div>
                    <button onclick="logTx('IN', '${g.id}')" class="mt-3 text-[10px] emerald-text uppercase">Add Funds</button>
                </div>`;
            }).join('');

            // History Rendering
            document.getElementById('master-ledger').innerHTML = history.slice().reverse().map((item, idx) => {
                const realIdx = history.length - 1 - idx;
                return `<div class="flex justify-between border-b border-[#262629] pb-2 items-center text-[10px]">
                    <div><p class="text-[#71717A]">${item.date} | ${item.type}</p><p class="font-bold">₦${item.amount.toLocaleString()}</p></div>
                    <button onclick="deleteTx(${realIdx})" class="text-red-900/50 px-2">×</button>
                </div>`;
            }).join('');
        }

        function logTx(type, goalId) {
            const amount = prompt(`Enter amount for ${type}:`);
            if (!amount || isNaN(amount)) return;
            const now = new Date();
            history.push({
                type, amount: parseFloat(amount), goalId,
                date: now.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}),
                time: now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})
            });
            localStorage.setItem('sov_history', JSON.stringify(history));
            updateDisplay();
        }

        function createGoal() {
            const name = prompt("Goal Name:");
            const target = prompt("Target (₦):");
            if (name && target) {
                goals.push({ id: 'g' + Date.now(), name, target: parseFloat(target) });
                localStorage.setItem('sov_goals', JSON.stringify(goals));
                updateDisplay();
            }
        }

        function deleteTx(idx) {
            if(confirm("Delete?")) { history.splice(idx, 1); localStorage.setItem('sov_history', JSON.stringify(history)); updateDisplay(); }
        }

        updateDisplay();
    </script>
</body>
</html>
