<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; overflow: hidden; }
        
        /* THE FIX: Absolute Pointer Isolation */
        .page-layer { position: relative; height: 100vh; overflow-y: auto; z-index: 10; padding-top: var(--safe-top); }
        
        .overlay { 
            position: fixed; inset: 0; z-index: -1; opacity: 0;
            background: rgba(10, 10, 11, 0.98); backdrop-filter: blur(30px); 
            padding: 24px; padding-top: calc(var(--safe-top) + 20px);
            transition: opacity 0.3s ease, z-index 0s 0.3s;
            overflow-y: auto;
        }
        .overlay-open { z-index: 5000; opacity: 1; transition: opacity 0.3s ease, z-index 0s 0s; }

        .fab-container { position: fixed; bottom: 40px; left: 0; right: 0; padding: 0 30px; display: flex; justify-content: space-between; z-index: 6000; pointer-events: none; }
        .fab-btn { 
            width: 70px; height: 70px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 28px; border: none; pointer-events: auto; cursor: pointer;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }
        .fab-add { background: #00FF41; color: black; box-shadow: 0 0 30px rgba(0, 255, 65, 0.3); }
        .fab-back { background: #161618; color: #EDEDED; border: 1px solid #262629; display: none; }

        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 24px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 20px; border-radius: 16px; width: 100%; outline: none; font-size: 16px; }
        
        .progress-bar { background: #262629; border-radius: 20px; height: 12px; overflow: hidden; }
        .progress-fill { background: #00FF41; height: 100%; transition: width 0.8s ease; }
    </style>
</head>
<body>

    <div class="page-layer pb-40">
        <div class="px-8 text-center mb-10">
            <div class="flex justify-between items-center mb-12">
                <p class="text-[10px] tracking-[0.5em] uppercase font-black text-emerald-500/40">Vault Command</p>
                <div class="flex gap-4">
                    <button onclick="toggleOverlay('intel-overlay')" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-800">📊</button>
                    <button onclick="toggleOverlay('settings-overlay')" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-800">⚙️</button>
                </div>
            </div>
            <p class="text-[12px] uppercase text-zinc-500 font-bold mb-2">Total Sovereign Wealth</p>
            <h1 id="networth" class="text-6xl font-black tracking-tighter emerald-text">₦0.00</h1>
        </div>

        <div class="px-6 space-y-6">
            <div class="vault-card p-8 border-l-8 border-emerald-500">
                <p class="text-[11px] uppercase font-black text-zinc-500 mb-6">Tactical Split</p>
                <div class="space-y-6">
                    <div class="flex justify-between items-end border-b border-zinc-800 pb-3">
                        <span class="text-xs font-bold text-zinc-400">BILLS (40%)</span>
                        <span id="alloc-bills" class="text-2xl font-black emerald-text">₦0</span>
                    </div>
                    <div class="flex justify-between items-end border-b border-zinc-800 pb-3">
                        <span class="text-xs font-bold text-zinc-400">SAVINGS (40%)</span>
                        <span id="alloc-savings" class="text-2xl font-black emerald-text">₦0</span>
                    </div>
                    <div class="flex justify-between items-end">
                        <span class="text-xs font-bold text-zinc-400">SPEND (20%)</span>
                        <span id="alloc-life" class="text-2xl font-black emerald-text">₦0</span>
                    </div>
                </div>
            </div>

            <div class="vault-card p-6">
                <p class="text-[11px] font-black uppercase text-zinc-500 mb-4 tracking-widest">Fixed Wealth <span id="inv-assets-total" class="emerald-text float-right">₦0</span></p>
                <div id="multi-tier-assets" class="space-y-3"></div>
            </div>

            <div class="vault-card p-6 border border-red-900/20">
                <p class="text-[11px] font-black uppercase oxblood-text mb-4 tracking-widest">Outflow Ledger <span id="inv-expenses-total" class="float-right">₦0</span></p>
                <div id="multi-tier-expenses" class="space-y-3"></div>
            </div>

            <div class="vault-card p-6 border border-yellow-900/20">
                <p class="text-[11px] font-black uppercase text-yellow-500 mb-4 tracking-widest">Fiduciary <span id="f-total-header" class="float-right">₦0</span></p>
                <div id="fiduciary-main-list" class="space-y-3 text-yellow-500/70"></div>
            </div>
        </div>
    </div>

    <div class="fab-container">
        <button id="fab-back" onclick="closeAll()" class="fab-btn fab-back">✕</button>
        <button id="fab-add" onclick="toggleOverlay('entry-overlay')" class="fab-btn fab-add">+</button>
    </div>

    <div id="entry-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-8">
            <h2 class="text-4xl font-black uppercase tracking-tighter">Authorize</h2>
            <div class="space-y-6">
                <select id="form-category" class="input-dark" onchange="handleCatChange()">
                    <option value="Income">Liquid Cash [+]</option>
                    <option value="FixedAsset">Fixed Asset [+]</option>
                    <option value="Expense">Expense/Debit [-]</option>
                    <option value="Transfer">Transfer [⇄]</option>
                    <option value="Fiduciary">Fiduciary [💼]</option>
                </select>
                <input id="form-date" type="date" class="input-dark">
                <input id="form-name" class="input-dark" placeholder="Description">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                <div id="fixed-asset-fields" class="hidden">
                    <select id="asset-type" class="input-dark"><option value="Stocks">Stocks</option><option value="Property">Property</option></select>
                </div>
                <div id="expense-fields" class="hidden space-y-4">
                    <select id="expense-tier" class="input-dark"><option value="Logistics">Logistics</option><option value="Staffing">Staffing</option><option value="Utilities">Utilities</option></select>
                    <select id="form-source" class="input-dark"><option value="lifestyle">From Spend</option><option value="bills">From Bills</option><option value="savings">From Savings</option></select>
                </div>
            </div>
            <button onclick="submitEntry()" class="w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase tracking-widest">Execute</button>
        </div>
    </div>

    <div id="intel-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-10 pb-40">
            <h2 class="text-4xl font-black uppercase tracking-tighter">Auditor</h2>
            
            <div class="grid grid-cols-2 gap-4">
                <div class="vault-card p-6">
                    <p class="text-[10px] uppercase font-black text-zinc-500 mb-2">Liquidity</p>
                    <p id="txt-liq-ratio" class="text-3xl font-black">0%</p>
                    <div class="progress-bar mt-2"><div id="bar-liq" class="progress-fill" style="width: 0%"></div></div>
                </div>
                <div class="vault-card p-6">
                    <p class="text-[10px] uppercase font-black text-zinc-500 mb-2">Outflow</p>
                    <p id="txt-debt-ratio" class="text-3xl font-black">0%</p>
                    <div class="progress-bar mt-2"><div id="bar-debt" class="progress-fill !bg-red-500" style="width: 0%"></div></div>
                </div>
            </div>

            <div class="vault-card p-8 bg-emerald-500/5 border-emerald-500/20">
                <p class="text-[11px] font-black uppercase text-zinc-500 mb-2">Audit Search</p>
                <input id="intel-search" oninput="runQuery()" class="input-dark text-center" placeholder="Contributor or Period...">
                <div id="intel-summary" class="mt-6 text-center">
                    <p class="text-[10px] font-bold text-zinc-500 uppercase">Calculated Auditor Total</p>
                    <p id="intel-total" class="text-4xl font-black emerald-text">₦0.00</p>
                </div>
            </div>
            <div id="intel-results" class="space-y-4"></div>
            <button onclick="downloadCSV()" class="w-full p-5 vault-card font-black uppercase text-xs">Export CSV</button>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-10">
            <h2 class="text-4xl font-black uppercase tracking-tighter">Registry</h2>
            <div class="vault-card p-8 space-y-8">
                <button onclick="exportData()" class="w-full border border-zinc-800 p-6 rounded-2xl font-black uppercase text-xs">Backup Registry</button>
                <button onclick="importData()" class="w-full border border-zinc-800 p-6 rounded-2xl font-black uppercase text-xs">Restore Registry</button>
                <button onclick="securePurge()" class="w-full p-6 bg-red-900/20 text-red-500 rounded-2xl font-black uppercase text-xs">Purge Vault</button>
            </div>
        </div>
    </div>

    <script>
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];
        let userPin = localStorage.getItem('vault_pin') || "0000";
        let liq = { bills: 0, savings: 0, lifestyle: 0 };

        function updateDisplay() {
            let aSum = 0, eSum = 0, fSum = 0;
            liq = { bills: 0, savings: 0, lifestyle: 0 };
            const exL = document.getElementById('multi-tier-expenses'), asL = document.getElementById('multi-tier-assets'), fL = document.getElementById('fiduciary-main-list');
            exL.innerHTML = ''; asL.innerHTML = ''; fL.innerHTML = '';
            
            const expGroups = {}, assetGroups = {};

            ledger.forEach(item => {
                const val = parseFloat(item.amount) || 0;
                liq.bills += (item.bills || 0); liq.savings += (item.savings || 0); liq.lifestyle += (item.lifestyle || 0);
                if (val < 0) {
                    const t = item.tier || 'Other'; expGroups[t] = (expGroups[t] || 0) + Math.abs(val); eSum += Math.abs(val);
                } else {
                    const t = item.type || 'Liquid Cash'; assetGroups[t] = (assetGroups[t] || 0) + val; aSum += val;
                }
            });

            for (const t in expGroups) exL.innerHTML += `<div class="flex justify-between font-black uppercase text-xs"><span>${t}</span><span class="oxblood-text">₦${expGroups[t].toLocaleString()}</span></div>`;
            for (const t in assetGroups) asL.innerHTML += `<div class="flex justify-between font-black uppercase text-xs"><span>${t}</span><span class="emerald-text">₦${assetGroups[t].toLocaleString()}</span></div>`;

            fLedger.reduce((acc, item) => {
                const val = parseFloat(item.amount) || 0;
                if (!acc[item.name]) acc[item.name] = { total: 0 };
                acc[item.name].total += val; fSum += val; return acc;
            }, {});

            document.getElementById('alloc-bills').innerText = "₦" + liq.bills.toLocaleString();
            document.getElementById('alloc-savings').innerText = "₦" + liq.savings.toLocaleString();
            document.getElementById('alloc-life').innerText = "₦" + liq.lifestyle.toLocaleString();
            document.getElementById('inv-expenses-total').innerText = "₦" + eSum.toLocaleString();
            document.getElementById('inv-assets-total').innerText = "₦" + aSum.toLocaleString();
            document.getElementById('networth').innerText = "₦" + (aSum - eSum).toLocaleString();

            const cashT = liq.bills + liq.savings + liq.lifestyle;
            const lPct = aSum > 0 ? (cashT / aSum) * 100 : 0;
            document.getElementById('bar-liq').style.width = lPct + "%";
            document.getElementById('txt-liq-ratio').innerText = Math.round(lPct) + "%";
            const ePct = aSum > 0 ? (eSum / aSum) * 100 : 0;
            document.getElementById('bar-debt').style.width = Math.min(ePct, 100) + "%";
            document.getElementById('txt-debt-ratio').innerText = Math.round(ePct) + "%";
        }

        function toggleOverlay(id) { 
            document.getElementById(id).classList.add('overlay-open'); 
            document.getElementById('fab-back').style.display = 'flex';
            document.getElementById('fab-add').style.display = 'none';
        }

        function closeAll() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('overlay-open'));
            document.getElementById('fab-back').style.display = 'none';
            document.getElementById('fab-add').style.display = 'flex';
        }

        function submitEntry() {
            const cat = document.getElementById('form-category').value, name = document.getElementById('form-name').value, amount = parseFloat(document.getElementById('form-amount').value);
            if (!name || isNaN(amount)) return;
            const d = new Date().toLocaleDateString();

            if (cat === 'Expense') {
                const src = document.getElementById('form-source').value, tier = document.getElementById('expense-tier').value;
                if (amount > liq[src]) { alert("Denied: Overdraft."); return; }
                ledger.push({ name, amount: -amount, [src]: -amount, tier, date: d });
            } else if (cat === 'Income') {
                ledger.push({ name, amount, bills: amount*0.4, savings: amount*0.4, lifestyle: amount*0.2, date: d, type: 'Liquid Cash' });
            } else if (cat === 'FixedAsset') {
                ledger.push({ name, amount, type: document.getElementById('asset-type').value, date: d });
            } else if (cat === 'Transfer') {
                const src = document.getElementById('trans-source').value, dest = document.getElementById('trans-dest').value;
                if (amount > liq[src]) { alert("Insufficient funds."); return; }
                ledger.push({ name: `Transfer: ${name}`, amount: 0, [src]: -amount, [dest]: amount, date: d });
            } else { fLedger.push({ name, amount, date: d }); }

            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            localStorage.setItem('fiduciary_ledger', JSON.stringify(fLedger));
            updateDisplay(); closeAll();
        }

        function runQuery() {
            const q = document.getElementById('intel-search').value.toLowerCase();
            const res = document.getElementById('intel-results');
            res.innerHTML = ''; let total = 0;
            if(!q) return;
            [...ledger, ...fLedger].forEach(i => {
                if(i.name.toLowerCase().includes(q)) {
                    total += Math.abs(parseFloat(i.amount));
                    res.innerHTML += `<div class="flex justify-between p-5 vault-card text-[11px] font-black uppercase"><span>${i.name}</span><span class="${i.amount < 0 ? 'oxblood-text' : 'emerald-text'}">₦${i.amount.toLocaleString()}</span></div>`;
                }
            });
            document.getElementById('intel-total').innerText = "₦" + total.toLocaleString();
        }

        function handleCatChange() {
            const cat = document.getElementById('form-category').value;
            document.getElementById('fixed-asset-fields').classList.toggle('hidden', cat !== 'FixedAsset');
            document.getElementById('expense-fields').classList.toggle('hidden', cat !== 'Expense');
        }

        function exportData() { prompt("Key:", btoa(JSON.stringify({ledger, fLedger}))); }
        function importData() { const k = prompt("Key:"); if(k){ const p = JSON.parse(atob(k)); ledger=p.ledger; fLedger=p.fLedger; updateDisplay(); } }
        function securePurge() { if(confirm("Wipe all data?")) { localStorage.clear(); location.reload(); } }

        updateDisplay();
    </script>
</body>
</html>
