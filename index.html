<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .ledger-item { border-bottom: 1px solid #262629; }
    </style>
</head>
<body class="p-6">
    <header class="mb-10 flex justify-between items-start pt-4">
        <div>
            <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase">True Net Worth</p>
            <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
        </div>
        <button onclick="togglePrivacy()" class="p-3 vault-card text-[10px] tracking-widest uppercase">Stealth</button>
    </header>

    <div class="space-y-4 mb-10">
        <button onclick="addEntry()" class="w-full vault-card p-5 flex justify-between items-center text-left">
            <div>
                <p class="text-xs font-bold uppercase emerald-text">Quick Entry (40/40/20)</p>
                <p id="split-display" class="text-[10px] text-[#71717A]">Add Funds & Auto-Allocate</p>
            </div>
            <span class="text-xl">⚡</span>
        </button>

        <button onclick="addLoan()" class="w-full vault-card p-5 flex justify-between items-center text-left border-dashed border-red-900/30">
            <div>
                <p class="text-xs font-bold uppercase oxblood-text">Debt Destroyer</p>
                <p id="loan-display" class="text-[10px] text-[#71717A]">Log Liabilities</p>
            </div>
            <span class="text-xl">📉</span>
        </button>
    </div>

    <div class="vault-card p-5">
        <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase mb-4">Tactical Ledger</p>
        <div id="ledger-list" class="space-y-3 max-h-60 overflow-y-auto"></div>
    </div>

    <script>
        let stealth = false;
        let history = JSON.parse(localStorage.getItem('vault_history')) || [];

        function updateDisplay() {
            // Calculate totals from history
            let currentBalance = 0;
            let currentLoans = 0;
            
            history.forEach(item => {
                if (type === 'IN') currentBalance += item.amount;
                if (type === 'DEBT') currentLoans = item.amount; // Sets the current debt level
            });

            const netWorth = currentBalance - currentLoans;
            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + netWorth.toLocaleString();
            document.getElementById('loan-display').innerText = "Current Debt: ₦" + currentLoans.toLocaleString();
            
            const list = document.getElementById('ledger-list');
            list.innerHTML = history.slice().reverse().map((item, index) => {
                const actualIndex = history.length - 1 - index;
                return `
                <div class="ledger-item pb-2 flex justify-between items-center">
                    <div class="flex flex-col">
                        <span class="text-[10px] uppercase text-[#71717A]">${item.date}</span>
                        <span class="${item.type === 'IN' ? 'emerald-text' : 'oxblood-text'} text-[10px] font-bold">
                            ${item.type === 'IN' ? '+' : 'DEBT:'} ₦${item.amount.toLocaleString()}
                        </span>
                    </div>
                    <button onclick="deleteEntry(${actualIndex})" class="text-[#71717A] hover:text-white px-2 text-lg">×</button>
                </div>
            `}).join('');
        }

        function togglePrivacy() {
            stealth = !stealth;
            updateDisplay();
        }

        function addEntry() {
            const amount = prompt("Enter deposit amount (₦):");
            if (amount && !isNaN(amount)) {
                saveTransaction('IN', parseFloat(amount));
            }
        }

        function addLoan() {
            const amount = prompt("Enter total debt amount (₦):");
            if (amount && !isNaN(amount)) {
                saveTransaction('DEBT', parseFloat(amount));
            }
        }

        function saveTransaction(type, amount) {
            const date = new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
            history.push({ type, amount, date });
            localStorage.setItem('vault_history', JSON.stringify(history));
            updateDisplay();
        }

        function deleteEntry(index) {
            if(confirm("Remove this entry from the ledger?")) {
                history.splice(index, 1);
                localStorage.setItem('vault_history', JSON.stringify(history));
                updateDisplay();
            }
        }

        updateDisplay();
    </script>
</body>
</html>
