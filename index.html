<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 8px; width: 100%; outline: none; transition: border-color 0.2s; }
        .input-dark:focus { border-color: #00FF41; }
        
        .stealth-btn { position: relative; z-index: 100 !important; pointer-events: auto !important; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 500 !important; pointer-events: auto !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.2); }
        #menu-overlay { display: none; position: fixed; inset: 0; z-index: 1000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); }
        .menu-open { display: flex !important; }
    </style>
</head>
<body class="p-6 pb-40">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold">Global Net Worth</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="stealth-btn p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800 active:bg-zinc-800">
                Stealth
            </button>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="vault-card p-4 border-l-2 border-emerald-500">
                <p class="text-[#71717A] text-[9px] uppercase mb-1 font-bold">Total Assets</p>
                <p id="total-assets" class="emerald-text font-bold text-lg font-mono">₦0</p>
            </div>
            <div class="vault-card p-4 border-l-2 border-red-500">
                <p class="text-[#71717A] text-[9px] uppercase mb-1 font-bold">Total Debt</p>
                <p id="total-debt" class="oxblood-text font-bold text-lg font-mono">₦0</p>
            </div>
        </div>

        <div class="vault-card p-5 mb-8 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6">Tactical Cash Split</p>
            <div class="space-y-4">
                <details class="group">
                    <summary class="flex justify-between items-center list-none cursor-pointer">
                        <span class="text-xs font-bold text-zinc-500 uppercase">Bills Account</span>
                        <div class="flex items-center gap-2">
                            <span id="alloc-bills" class="text-xs font-bold emerald-text">₦0</span>
                            <span class="text-[8px] text-zinc-700 group-open:rotate-180 transition-transform">▼</span>
                        </div>
                    </summary>
                    <div class="mt-3 pl-4 space-y-2 border-l border-emerald-900/30 pt-2">
                        <div class="flex justify-between text-[10px] text-zinc-500 uppercase font-bold"><span>Emergency (40%)</span><span id="bills-emerge">₦0</span></div>
                        <div class="flex justify-between text-[10px] text-zinc-500 uppercase font-bold"><span>Operational (40%)</span><span id="bills-ops">₦0</span></div>
                        <div class="flex justify-between text-[10px] text-zinc-500 uppercase font-bold"><span>Buffer (20%)</span><span id="bills-buffer">₦0</span></div>
                    </div>
                </details>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Savings Account</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Spend Account</span><span id="alloc-life">₦0</span></div>
                <div class="border-t border-emerald-500/20 pt-4 flex justify-between items-center"><span class="text-[10px] text-zinc-400 uppercase font-bold">Total Cash Balance</span><span id="total-cash" class="text-sm font-bold emerald-text font-mono">₦0</span></div>
            </div>
        </div>

        <details class="vault-card group mb-4">
            <summary class="p-5 flex justify-between items-center list-none cursor-pointer"><span class="text-[10px] uppercase tracking-widest font-black">Asset Inventory</span><span class="text-zinc-600 group-open:rotate-180 transition-transform">▼</span></summary>
            <div id="asset-list" class="px-5 pb-5 space-y-2 border-t border-zinc-800 pt-4 text-[11px]"></div>
        </details>

        <details class="vault-card group mb-4">
            <summary class="p-5 flex justify-between items-center list-none cursor-pointer"><span class="text-[10px] uppercase tracking-widest font-black">Liability Ledger</span><span class="text-zinc-600 group-open:rotate-180 transition-transform">▼</span></summary>
            <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-800 pt-4 text-[11px]"></div>
        </details>

        <button onclick="resetVault()" class="w-full mt-10 p-4 text-[9px] uppercase tracking-widest text-zinc-800 border border-zinc-900 rounded-lg">Purge Data</button>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-3xl font-bold active:scale-90 transition-transform">+</button>

    <div id="menu-overlay" class="flex-col items-center justify-start p-8 pt-20 overflow-y-auto">
        <div class="w-full space-y-6 max-w-sm">
            <div class="flex justify-between items-end mb-4">
                <h2 class="text-xl font-bold uppercase tracking-tighter">New Entry</h2>
                <p class="text-[9px] text-zinc-600 uppercase tracking-widest">Sovereign Vault v3</p>
            </div>
            <div class="space-y-4">
                <input id="form-name" class="input-dark" placeholder="Label (e.g. Salary, Plot 4)">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                <select id="form-type" class="input-dark" onchange="toggleCashFields()">
                    <option value="Asset">Fixed Asset</option>
                    <option value="Cash">Liquid Cash</option>
                    <option value="Liability">Liability</option>
                </select>
                <div id="cash-fields" class="hidden space-y-4 pt-4 border-t border-zinc-800">
                    <p class="text-[10px] text-emerald-500 font-bold uppercase underline">Split Allocation</p>
                    <div class="flex gap-4">
                        <div class="flex-1"><label class="text-[9px] text-zinc-500 block mb-1 font-bold">Savings %</label><input id="form-save-pct" type="number" class="input-dark" value="40"></div>
                        <div class="flex-1"><label class="text-[9px] text-zinc-500 block mb-1 font-bold">Spend %</label><input id="form-life-pct" type="number" class="input-dark" value="20"></div>
                    </div>
                </div>
            </div>
            <div class="pt-6 space-y-3">
                <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs tracking-widest">Authorize Entry</button>
                <button onclick="toggleMenu()" class="w-full p-4 text-zinc-500 uppercase text-[10px] tracking-widest text-center">Back to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];

        function updateDisplay() {
            let assetsSum = 0; let debtSum = 0; 
            let billsSum = 0; let savingsSum = 0; let lifestyleSum = 0; let totalCash = 0;
            const assetList = document.getElementById('asset-list');
            const debtList = document.getElementById('debt-list');
            assetList.innerHTML = ''; debtList.innerHTML = '';

            ledger.forEach((item, index) => {
                const isAsset = (item.type === 'Asset' || item.type === 'Cash');
                const isDebt = (item.type === 'Liability');
                if(isAsset) assetsSum += item.amount; 
                if(isDebt) debtSum += item.amount;
                if(item.type === 'Cash') {
                    totalCash += item.amount;
                    billsSum += item.bills || 0;
                    savingsSum += item.savings || 0;
                    lifestyleSum += item.lifestyle || 0;
                }
                const target = isAsset ? assetList : debtList;
                target.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b border-zinc-900 last:border-0">
                        <span class="text-zinc-400 font-bold uppercase text-[9px]">${item.name}</span>
                        <div class="flex items-center gap-4">
                            <span class="${isAsset ? 'emerald-text' : 'oxblood-text'} font-mono text-[10px]">₦${stealth ? '••••' : item.amount.toLocaleString()}</span>
                            <button onclick="deleteItem(${index})" class="text-zinc-800 px-2 font-black">×</button>
                        </div>
                    </div>`;
            });

            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + (assetsSum - debtSum).toLocaleString();
            document.getElementById('total-assets').innerText = stealth ? "••••" : "₦" + assetsSum.toLocaleString();
            document.getElementById('total-debt').innerText = stealth ? "••••" : "₦" + debtSum.toLocaleString();
            document.getElementById('total-cash').innerText = stealth ? "••••" : "₦" + totalCash.toLocaleString();
            document.getElementById('alloc-bills').innerText = stealth ? "••••" : "₦" + billsSum.toLocaleString();
            document.getElementById('alloc-savings').innerText = stealth ? "••••" : "₦" + savingsSum.toLocaleString();
            document.getElementById('alloc-life').innerText = stealth ? "••••" : "₦" + lifestyleSum.toLocaleString();
            document.getElementById('bills-emerge').innerText = stealth ? "••••" : "₦" + (billsSum * 0.4).toLocaleString();
            document.getElementById('bills-ops').innerText = stealth ? "••••" : "₦" + (billsSum * 0.4).toLocaleString();
            document.getElementById('bills-buffer').innerText = stealth ? "••••" : "₦" + (billsSum * 0.2).toLocaleString();
        }

        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }
        function toggleCashFields() {
            const type = document.getElementById('form-type').value;
            const fields = document.getElementById('cash-fields');
            type === 'Cash' ? fields.classList.remove('hidden') : fields.classList.add('hidden');
        }

        function submitEntry() {
            const name = document.getElementById('form-name').value;
            const amount = parseFloat(document.getElementById('form-amount').value);
            const type = document.getElementById('form-type').value;
            if (!name || isNaN(amount)) return;
            let entry = { name, amount, type };
            if (type === 'Cash') {
                const sPct = parseFloat(document.getElementById('form-save-pct').value) || 0;
                const lPct = parseFloat(document.getElementById('form-life-pct').value) || 0;
                entry.bills = amount * 0.40;
                entry.savings = amount * (sPct / 100);
                entry.lifestyle = amount * (lPct / 100);
            }
            ledger.push(entry);
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay();
            toggleMenu();
        }

        function deleteItem(index) {
            if(confirm("Permanently delete?")) {
                ledger.splice(index, 1);
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
                updateDisplay();
            }
        }

        function resetVault() {
            if(confirm("Wipe all data?")) {
                ledger = [];
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
                updateDisplay();
            }
        }

        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        updateDisplay();
    </script>
</body>
</html>
