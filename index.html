<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 60px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; }
        
        .glass-header { 
            padding-top: calc(var(--safe-top) + 20px); 
            padding-bottom: 30px; 
            background: rgba(10, 10, 11, 0.9); 
            backdrop-filter: blur(10px);
            position: sticky; top: 0; z-index: 1000;
            border-bottom: 1px solid #161618;
        }

        .fab-button { 
            position: fixed; bottom: 40px; right: 30px; z-index: 9999; 
            width: 70px; height: 70px; background: #00FF41; color: black; 
            border-radius: 50%; display: flex; justify-content: center; align-items: center; 
            font-size: 36px; font-weight: bold; border: none; 
            box-shadow: 0 0 40px rgba(0, 255, 65, 0.3); 
        }

        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 20px; overflow: hidden; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 18px; border-radius: 14px; width: 100%; outline: none; appearance: none; }
        
        .overlay { 
            display: none; position: fixed; inset: 0; z-index: 10000; 
            background: rgba(0,0,0,0.98); backdrop-filter: blur(30px); 
            padding: 24px; padding-top: calc(var(--safe-top) + 40px); overflow-y: auto; 
        }
        .overlay-open { display: flex !important; flex-direction: column; }
        
        .progress-bar { background: #262629; border-radius: 12px; height: 12px; overflow: hidden; }
        .progress-fill { background: #00FF41; height: 100%; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        
        summary { cursor: pointer; list-style: none; outline: none; }
    </style>
</head>
<body class="pb-60">

    <div class="glass-header px-8 text-center">
        <div class="flex justify-between items-center mb-10">
            <p class="text-[10px] tracking-[0.6em] uppercase font-black text-emerald-500/40">Sovereign Command</p>
            <div class="flex gap-4">
                <button onclick="toggleOverlay('intel-overlay')" class="text-2xl">📊</button>
                <button onclick="toggleOverlay('settings-overlay')" class="text-2xl">⚙️</button>
            </div>
        </div>
        
        <p class="text-[12px] uppercase text-zinc-500 font-bold mb-2">Net Worth</p>
        <h1 id="networth" class="text-6xl font-black tracking-tighter emerald-text">₦0.00</h1>
    </div>

    <div id="dashboard-content" class="px-6 space-y-8 mt-10">
        
        <div class="vault-card p-8 border-t-4 border-emerald-500">
            <div class="flex justify-between items-center mb-8">
                <p class="text-[11px] uppercase font-black text-zinc-500 tracking-widest">Tactical Liquidity</p>
                <span id="total-cash" class="text-sm font-mono opacity-60">₦0</span>
            </div>
            <div class="grid gap-6">
                <div class="flex justify-between items-end border-b border-zinc-800 pb-2">
                    <span class="text-xs text-zinc-400 font-bold">BILLS (40%)</span>
                    <span id="alloc-bills" class="text-xl font-black emerald-text">₦0</span>
                </div>
                <div class="flex justify-between items-end border-b border-zinc-800 pb-2">
                    <span class="text-xs text-zinc-400 font-bold">SAVINGS (40%)</span>
                    <span id="alloc-savings" class="text-xl font-black emerald-text">₦0</span>
                </div>
                <div class="flex justify-between items-end">
                    <span class="text-xs text-zinc-400 font-bold">SPEND (20%)</span>
                    <span id="alloc-life" class="text-xl font-black emerald-text">₦0</span>
                </div>
            </div>
        </div>

        <details class="vault-card" open>
            <summary class="p-6 flex justify-between items-center font-black text-[12px] uppercase">Asset Inventory <span id="inv-assets-total" class="emerald-text">₦0</span></summary>
            <div id="multi-tier-assets" class="p-6 bg-zinc-900/30 space-y-4"></div>
        </details>

        <details class="vault-card" open>
            <summary class="p-6 flex justify-between items-center font-black text-[12px] uppercase oxblood-text">Expense Ledger <span id="inv-expenses-total">₦0</span></summary>
            <div id="multi-tier-expenses" class="p-6 bg-zinc-900/30 space-y-4"></div>
        </details>

        <details class="vault-card">
            <summary class="p-6 flex justify-between items-center font-black text-[12px] uppercase text-yellow-500">Fiduciary Ledger <span id="f-total-header">₦0</span></summary>
            <div id="fiduciary-main-list" class="p-6 bg-zinc-900/30 space-y-4"></div>
        </details>

        <details class="vault-card border-zinc-800">
            <summary class="p-6 flex justify-between items-center text-zinc-600 font-black uppercase text-[10px]">Master Audit Trail <span>▼</span></summary>
            <div id="master-audit-list" class="p-6 space-y-4 max-h-96 overflow-y-auto bg-black/50"></div>
        </details>
    </div>

    <button onclick="toggleOverlay('entry-overlay')" class="fab-button">+</button>

    <div id="intel-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-10 pb-32">
            <div class="flex justify-between items-center">
                <h2 class="text-3xl font-black uppercase tracking-tighter">Auditor</h2>
                <button onclick="toggleOverlay('intel-overlay')" class="text-zinc-600 font-bold text-xs uppercase">Back</button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div class="vault-card p-5">
                    <p class="text-[9px] uppercase font-black text-zinc-500 mb-2">Liquidity</p>
                    <p id="txt-liq-ratio" class="text-2xl font-black">0%</p>
                    <div class="progress-bar mt-2"><div id="bar-liq" class="progress-fill" style="width: 0%"></div></div>
                </div>
                <div class="vault-card p-5">
                    <p class="text-[9px] uppercase font-black text-zinc-500 mb-2">Liability</p>
                    <p id="txt-debt-ratio" class="text-2xl font-black">0%</p>
                    <div class="progress-bar mt-2"><div id="bar-debt" class="progress-fill !bg-red-500" style="width: 0%"></div></div>
                </div>
            </div>

            <div class="space-y-4">
                <p class="text-[10px] uppercase font-black text-zinc-500">Search Entity/Period</p>
                <input id="intel-search" oninput="runIntelligenceQuery()" class="input-dark" placeholder="Name, Date, or Category...">
                <div id="intel-summary-box" class="hidden p-6 vault-card border-emerald-500/50 bg-emerald-500/5">
                    <p class="text-[10px] font-black uppercase text-zinc-500">Calculated Auditor Total</p>
                    <p id="intel-query-total" class="text-4xl font-black emerald-text">₦0.00</p>
                </div>
                <div id="intel-results" class="space-y-3"></div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <button onclick="downloadCSV()" class="p-5 vault-card text-[11px] font-black uppercase
