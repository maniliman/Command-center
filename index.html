<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 60px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; }
        
        .top-nav { 
            padding-top: calc(var(--safe-top) + 40px);
            padding-bottom: 20px;
            background: #0A0A0B;
            text-align: center;
        }

        /* DUAL FAB ARCHITECTURE */
        .fab-container { position: fixed; bottom: 40px; width: 100%; padding: 0 30px; display: flex; justify-content: space-between; z-index: 11000; pointer-events: none; }
        .fab-btn { 
            width: 64px; height: 64px; border-radius: 50%; 
            display: flex; justify-content: center; align-items: center; 
            font-size: 24px; font-weight: bold; border: none; 
            pointer-events: auto; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .fab-add { background: #00FF41; color: black; box-shadow: 0 0 30px rgba(0, 255, 65, 0.3); }
        .fab-back { background: #161618; color: #EDEDED; border: 1px solid #262629; display: none; }

        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 20px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 18px; border-radius: 14px; width: 100%; outline: none; }
        
        .overlay { 
            display: none; position: fixed; inset: 0; z-index: 10000; 
            background: rgba(0,0,0,0.98); backdrop-filter: blur(30px); 
            padding: 24px; padding-top: calc(var(--safe-top) + 40px); overflow-y: auto; 
        }
        .overlay-open { display: flex !important; flex-direction: column; }
    </style>
</head>
<body class="pb-60">

    <div class="top-nav px-6">
        <div class="flex justify-between items-center mb-8">
            <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/50">Command Center</p>
            <div class="flex gap-4 items-center">
                <button onclick="toggleOverlay('intel-overlay')" class="text-xl p-2 bg-zinc-900 rounded-lg">📊</button>
                <button onclick="toggleOverlay('settings-overlay')" class="text-xl p-2 bg-zinc-900 rounded-lg">⚙️</button>
                <button onclick="togglePrivacy()" id="stealth-btn" class="px-3 py-2 bg-zinc-900 rounded-lg text-[10px] font-bold uppercase border border-zinc-800">Stealth</button>
            </div>
        </div>
        
        <p class="text-[12px] uppercase text-zinc-500 font-bold mb-2">Total Net Worth</p>
        <h1 id="networth" class="text-6xl font-black tracking-tighter emerald-text">₦0.00</h1>
    </div>

    <div class="px-6 space-y-8 mt-10">
        <div class="vault-card p-8 border-l-4 border-emerald-500 shadow-xl shadow-emerald-500/5">
            <p class="text-[11px] uppercase font-black text-zinc-500 mb-6 tracking-widest">Tactical Liquidity</p>
            <div class="grid gap-6 font-black">
                <div class="flex justify-between border-b border-zinc-800 pb-3"><span>Bills (40%)</span><span id="alloc-bills" class="emerald-text text-xl">₦0</span></div>
                <div class="flex justify-between border-b border-zinc-800 pb-3"><span>Savings (40%)</span><span id="alloc-savings" class="emerald-text text-xl">₦0</span></div>
                <div class="flex justify-between"><span>Spend (20%)</span><span id="alloc-life" class="emerald-text text-xl">₦0</span></div>
            </div>
        </div>

        <div class="vault-card p-6">
            <p class="text-[11px] font-black uppercase text-zinc-500 mb-4 tracking-widest">Wealth Inventory <span id="inv-assets-total" class="emerald-text float-right">₦0</span></p>
            <div id="multi-tier-assets" class="space-y-3 text-sm"></div>
        </div>

        <div class="vault-card p-6">
            <p class="text-[11px] font-black uppercase oxblood-text mb-4 tracking-widest">Expenses <span id="inv-expenses-total" class="float-right">₦0</span></p>
            <div id="multi-tier-expenses" class="space-y-3 text-sm"></div>
        </div>

        <div class="vault-card p-6">
            <p class="text-[11px] font-black uppercase text-yellow-500 mb-4 tracking-widest">Fiduciary <span id="f-total-header" class="float-right">₦0</span></p>
            <div id="fiduciary-main-list" class="space-y-3 text-sm text-yellow-500/80"></div>
        </div>

        <div class="vault-card p-6 opacity-40">
            <p class="text-[10px] font-black uppercase mb-4">Audit Trail</p>
            <div id="master-audit-list" class="space-y-2 text-[10px] max-h-40 overflow-y-auto"></div>
        </div>
    </div>

    <div class="fab-container">
        <button id="fab-back" onclick="closeAllOverlays()" class="fab-btn fab-back">✕</button>
        <button id="fab-add" onclick="toggleOverlay('entry-overlay')" class="fab-btn fab-add">+</button>
    </div>

    <div id="entry-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-6 pb-40">
            <h2 class="text-3xl font-black uppercase tracking-tighter">Authorize</h2>
            <select id="form-category" class="input-dark" onchange="handleCatChange()">
                <option value="Income">Liquid Cash Inflow [+]</option>
                <option value="FixedAsset">Fixed Asset [+]</option>
                <option value="Expense">Expense/Debit [-]</option>
                <option value="Transfer">Account Transfer [⇄]</option>
                <option value="Fiduciary">Fiduciary [💼]</option>
            </select>
            <input id="form-date" type="date" class="input-dark">
            <input id="form-name" class="input-dark" placeholder="Description/Entity">
            <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
            
            <div id="fixed-asset-fields" class="hidden">
                <select id="asset-type" class="input-dark"><option value="Stocks">Stocks</option><option value="Property">Property</option></select>
            </div>
            <div id="expense-fields" class="hidden space-y-4">
                <select id="expense-tier" class="input-dark"><option value="Logistics">Logistics</option><option value="Staffing">Staffing</option><option value="Personal">Personal</option></select>
                <select id="form-source" class="input-dark"><option value="lifestyle">From Spend</option><option value="bills">From Bills</option><option value="savings">From Savings</option></select>
            </div>
            <div id="transfer-fields" class="hidden space-y-4">
                <select id="trans-source" class="input-dark"><option value="bills">From Bills</option><option value="savings">From Savings</option><option value="lifestyle">From Spend</option></select>
                <select id="trans-dest" class="input-dark"><option value="savings">To Savings</option><option value="lifestyle">To Spend</option><option value="bills">To Bills</option></select>
            </div>
            <button onclick="submitEntry()" class="w-full bg-emerald-500 p-5 rounded-2xl text-black font-black uppercase tracking-widest text-lg">Authorize</button>
        </div>
    </div>

    <div id="intel-overlay" class="overlay text-center">
        <div class="w-full max-w-sm mx-auto space-y-8 pb-32">
            <h2 class="text-3xl font-black uppercase tracking-tighter">Intelligence</h2>
            <div id="intel-summary-box" class="p-8 vault-card border-emerald-500/50 bg-emerald-500/5">
                <p class="text-[10px] font-black uppercase text-zinc-500 mb-2">Calculated Total</p>
                <p id="intel-query-total" class="text-4xl font-black emerald-text">₦0.00</p>
            </div>
            <input id="intel-search" oninput="runIntelligenceQuery()" class="input-dark text-center" placeholder="Search Contributor or Category...">
            <div id="intel-results" class="space-y-3"></div>
            <button onclick="downloadCSV()" class="w-full py-4 border border-zinc-800 rounded uppercase font-bold text-[10px]">Export Ledger (CSV)</button>
        </div>
    </div>

    <div id="settings-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-10">
            <h2 class="text-2xl font-black uppercase tracking-tighter">Registry Control</h2>
            <button onclick="exportData()" class="w-full border border-zinc-800 p-5 rounded font-black uppercase text-xs">Backup Registry</button>
            <button onclick="importData()" class="w-full border border-zinc-800 p-5 rounded font-black uppercase text-xs">Restore Registry</button>
            <button onclick="securePurge()" class="w-full p-5 mt-20 text-red-900 border border-red-900 rounded font-black uppercase text-xs">Purge All Data</button>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];
        let liq = { bills: 0, savings: 0, lifestyle: 0 };

        document.getElementById('form-date').valueAsDate = new Date();

        function mask(val) { return stealth ? "••••" : (Math.abs(parseFloat(val)) || 0).toLocaleString(); }

        function updateDisplay() {
            let aSum = 0, eSum = 0, fSum = 0;
            liq = { bills: 0, savings: 0, lifestyle: 0 };
            const exL = document.getElementById('multi-tier-expenses'), asL = document.getElementById('multi-tier-assets'), fL = document.getElementById('fiduciary-main-list'), auditL = document.getElementById('master-audit-list');
            exL.innerHTML = ''; asL.innerHTML = ''; fL.innerHTML = ''; auditL.innerHTML = '';
            
            const expGroups = {}, assetGroups = {};

            ledger.forEach(item => {
                const val = parseFloat(item.amount) || 0;
                liq.bills += (item.bills || 0); liq.savings += (item.savings || 0); liq.lifestyle += (item.lifestyle || 0);
                
                if (val < 0) {
                    const t = item.tier || 'Other'; expGroups[t] = (expGroups[t] || 0) + Math.abs(val); eSum += Math.abs(val);
                } else {
                    const t = item.type || 'Liquid Cash'; assetGroups[t] = (assetGroups[t] || 0) + val; aSum += val;
                }
                auditL.innerHTML += `<div class="flex justify-between py-1 border-b border-zinc-900"><span>${item.date} ${item.name}</span><span class="${val < 0 ? 'oxblood-text' : 'emerald-text'}">₦${mask(val)}</span></div>`;
            });

            for (const t in expGroups) exL.innerHTML += `<div class="flex justify-between font-black uppercase text-xs"><span>${t}</span><span class="oxblood-text">₦${mask(expGroups[t])}</span></div>`;
            for (const t in assetGroups) asL.innerHTML += `<div class="flex justify-between font-black uppercase text-xs"><span>${t}</span><span class="emerald-text">₦${mask(assetGroups[t])}</span></div>`;

            const fGroups = fLedger.reduce((acc, item) => {
                const val = parseFloat(item.amount) || 0;
                if (!acc[item.name]) acc[item.name] = { total: 0 };
                acc[item.name].total += val; fSum += val; return acc;
            }, {});
            for (const n in fGroups) fL.innerHTML += `<div class="flex justify-between font-black uppercase text-xs"><span>${n}</span><span>₦${mask(fGroups[n].total)}</span></div>`;

            document.getElementById('alloc-bills').innerText = "₦" + mask(liq.bills);
            document.getElementById('alloc-savings').innerText = "₦" + mask(liq.savings);
            document.getElementById('alloc-life').innerText = "₦" + mask(liq.lifestyle);
            document.getElementById('inv-expenses-total').innerText = "₦" + mask(eSum);
            document.getElementById('inv-assets-total').innerText = "₦" + mask(aSum);
            document.getElementById('f-total-header').innerText = "₦" + mask(fSum);
            document.getElementById('networth').innerText = "₦" + mask(aSum - eSum);
        }

        function handleCatChange() {
            const cat = document.getElementById('form-category').value;
            document.getElementById('fixed-asset-fields').classList.toggle('hidden', cat !== 'FixedAsset');
            document.getElementById('expense-fields').classList.toggle('hidden', cat !== 'Expense');
            document.getElementById('transfer-fields').classList.toggle('hidden', cat !== 'Transfer');
        }

        function toggleOverlay(id) { 
            const overlays = document.querySelectorAll('.overlay');
            overlays.forEach(o => o.classList.remove('overlay-open'));
            document.getElementById(id).classList.add('overlay-open'); 
            document.getElementById('fab-back').style.display = 'flex';
            document.getElementById('fab-add').style.display = 'none';
        }

        function closeAllOverlays() {
            document.querySelectorAll('.overlay').forEach(o => o.classList.remove('overlay-open'));
            document.getElementById('fab-back').style.display = 'none';
            document.getElementById('fab-add').style.display = 'flex';
        }

        function togglePrivacy() { stealth = !stealth; document.getElementById('stealth-btn').innerText = stealth ? "Show" : "Stealth"; updateDisplay(); }

        function submitEntry() {
            const cat = document.getElementById('form-category').value, name = document.getElementById('form-name').value;
            const amount = parseFloat(document.getElementById('form-amount').value), dateVal = document.getElementById('form-date').value;
            if (!name || isNaN(amount)) return;
            const entryDate = new Date(dateVal).toLocaleDateString();

            if (cat === 'Expense') {
                const src = document.getElementById('form-source').value, tier = document.getElementById('expense-tier').value;
                if (amount > liq[src]) { alert("Denied: Overdraft."); return; }
                ledger.push({ name, amount: -amount, [src]: -amount, tier, date: entryDate, rawDate: dateVal });
            } else if (cat === 'Income') {
                ledger.push({ name, amount, bills: amount*0.4, savings: amount*0.4, lifestyle: amount*0.2, date: entryDate, rawDate: dateVal, type: 'Liquid Cash' });
            } else if (cat === 'FixedAsset') {
                const type = document.getElementById('asset-type').value;
                ledger.push({ name, amount, type, date: entryDate, rawDate: dateVal });
            } else if (cat === 'Transfer') {
                const src = document.getElementById('trans-source').value, dest = document.getElementById('trans-dest').value;
                if (amount > liq[src]) { alert("Insufficient funds."); return; }
                ledger.push({ name: `Transfer: ${name}`, amount: 0, [src]: -amount, [dest]: amount, date: entryDate, rawDate: dateVal });
            } else { fLedger.push({ name, amount, date: entryDate, rawDate: dateVal }); }

            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            localStorage.setItem('fiduciary_ledger', JSON.stringify(fLedger));
            updateDisplay(); closeAllOverlays();
        }

        function runIntelligenceQuery() {
            const q = document.getElementById('intel-search').value.toLowerCase();
            const res = document.getElementById('intel-results');
            res.innerHTML = ''; let total = 0;
            if(!q) return;
            [...ledger, ...fLedger].forEach(i => {
                if(i.name.toLowerCase().includes(q) || (i.tier && i.tier.toLowerCase().includes(q))) {
                    total += Math.abs(parseFloat(i.amount));
                    res.innerHTML += `<div class="flex justify-between p-4 vault-card text-[11px] font-black uppercase"><span>${i.name}</span><span class="${i.amount < 0 ? 'oxblood-text' : 'emerald-text'}">₦${mask(i.amount)}</span></div>`;
                }
            });
            document.getElementById('intel-query-total').innerText = "₦" + total.toLocaleString();
        }

        function exportData() { prompt("Copy Key:", btoa(JSON.stringify({ledger, fLedger}))); }
        function importData() { const k = prompt("Paste Key:"); if(
