<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .filter-btn { padding: 6px 12px; border-radius: 6px; font-size: 10px; font-weight: bold; text-transform: uppercase; transition: 0.2s; border: 1px solid #262629; }
        .filter-active { background: #FF3131; color: black; border-color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 8px; width: 100%; outline: none; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 500 !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }
        #menu-overlay { display: none; position: fixed; inset: 0; z-index: 1000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); padding: 24px; padding-top: 80px; overflow-y: auto; }
        .menu-open { display: flex !important; flex-direction: column; align-items: center; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content" class="p-6">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800 active:bg-zinc-800">Stealth</button>
        </header>

        <div class="grid grid-cols-1 gap-4 mb-8">
            <div class="vault-card p-5 border-l-4 border-red-500">
                <p class="text-[#71717A] text-[9px] uppercase font-bold mb-1">Total Monies Owed (Creditors)</p>
                <p id="inv-debt-total" class="oxblood-text font-bold text-2xl font-mono">₦0</p>
            </div>
        </div>

        <div class="flex justify-between items-center mb-6">
            <p class="text-[#71717A] text-[9px] uppercase tracking-[0.3em] font-bold">Master Ledger</p>
            <button id="debt-filter-btn" onclick="toggleDebtFilter()" class="filter-btn">
                Filter: Debt Only
            </button>
        </div>
        
        <div id="master-history" class="space-y-4"></div>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-3xl font-bold active:scale-90">+</button>

    <div id="menu-overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto pb-20">
            <h2 class="text-xl font-bold uppercase tracking-tighter">New Entry</h2>
            <div class="space-y-4">
                <input id="form-name" class="input-dark" placeholder="Entity Name">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                <select id="form-type" class="input-dark" onchange="toggleSpecialFields()">
                    <option value="Asset">Fixed Asset</option>
                    <option value="Cash">Liquid Cash</option>
                    <option value="Liability">Liability (I Owe)</option>
                    <option value="Debtor">Debtor (Owes Me)</option>
                </select>

                <div id="debt-fields" class="hidden space-y-4 pt-4 border-t border-zinc-800">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[9px] text-zinc-500 uppercase font-bold">Interest %</label><input id="form-interest" type="number" class="input-dark" value="0"></div>
                        <div><label class="text-[9px] text-zinc-500 uppercase font-bold">Due Date</label><input id="form-due" type="date" class="input-dark"></div>
                    </div>
                </div>
            </div>
            <div class="pt-6 space-y-3 text-center">
                <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Authorize</button>
                <button onclick="toggleMenu()" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold">Back</button>
            </div>
        </div>
    </div>

    <script>
        let stealth = false;
        let debtFilter = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];

        function updateDisplay() {
            let assetsSum = 0, debtSum = 0;
            const masterHistory = document.getElementById('master-history');
            masterHistory.innerHTML = '';

            ledger.slice().reverse().forEach((item, originalIndex) => {
                const idx = ledger.length - 1 - originalIndex;
                const interestAmt = (item.amount * (item.interest || 0) / 100);
                const paid = item.paid || 0;
                const forgiven = item.forgiven || 0;
                const balance = item.amount + interestAmt - paid - forgiven;

                const isDebt = (item.type === 'Liability');
                const isAssetGroup = (item.type === 'Asset' || item.type === 'Cash' || item.type === 'Debtor');
                
                if(isAssetGroup) assetsSum += balance; else debtSum += balance;

                // FILTER LOGIC
                if (debtFilter && !isDebt) return;

                const color = item.type === 'Debtor' ? 'text-blue-400' : (isAssetGroup ? 'emerald-text' : 'oxblood-text');
                
                masterHistory.innerHTML += `
                    <div class="vault-card p-4 border-l-4 ${isAssetGroup ? 'border-emerald-500' : 'border-red-500'} mb-4">
                        <div class="flex justify-between items-start mb-2">
                            <p class="text-[8px] text-zinc-600 font-bold uppercase">${item.timestamp}</p>
                            <div class="flex gap-2">
                                <button onclick="serviceDebt(${idx})" class="text-[8px] border border-zinc-800 px-2 py-1 rounded text-zinc-400 uppercase font-bold">Service</button>
                                <button onclick="deleteItem(${idx})" class="text-zinc-800 hover:text-red-500 px-1 font-black text-xs">×</button>
                            </div>
                        </div>
                        <p class="text-xs font-black uppercase tracking-tight">${item.name}</p>
                        ${item.dueDate ? `<p class="text-[8px] text-zinc-500 mt-1 uppercase font-bold">Due: ${item.dueDate} | Interest: ${item.interest}%</p>` : ''}
                        <div class="flex justify-between items-end mt-2">
                            <span class="text-[7px] text-zinc-600 uppercase tracking-widest">${item.type}</span>
                            <p class="${color} font-mono text-xs font-bold">₦${stealth ? '••••' : balance.toLocaleString()}</p>
                        </div>
                    </div>`;
            });

            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + (assetsSum - debtSum).toLocaleString();
            document.getElementById('inv-debt-total').innerText = stealth ? "••••" : "₦" + debtSum.toLocaleString();
        }

        function toggleDebtFilter() {
            debtFilter = !debtFilter;
            const btn = document.getElementById('debt-filter-btn');
            btn.classList.toggle('filter-active', debtFilter);
            updateDisplay();
        }

        function serviceDebt(index) {
            const pay = parseFloat(prompt("Amount Paid (₦):", "0")) || 0;
            const forgive = parseFloat(prompt("Amount Forgiven (₦):", "0")) || 0;
            ledger[index].paid = (ledger[index].paid || 0) + pay;
            ledger[index].forgiven = (ledger[index].forgiven || 0) + forgive;
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay();
        }

        function toggleSpecialFields() {
            const type = document.getElementById('form-type').value;
            document.getElementById('debt-fields').classList.toggle('hidden', type !== 'Liability' && type !== 'Debtor');
        }

        function submitEntry() {
            const name = document.getElementById('form-name').value, amount = parseFloat(document.getElementById('form-amount').value), type = document.getElementById('form-type').value;
            if (!name || isNaN(amount)) return;
            ledger.push({
                name, amount, type, timestamp: new Date().toLocaleDateString(),
                interest: parseFloat(document.getElementById('form-interest').value) || 0,
                dueDate: document.getElementById('form-due').value,
                paid: 0, forgiven: 0
            });
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay(); toggleMenu();
        }

        function deleteItem(index) { if(confirm("Purge record?")) { ledger.splice(index, 1); localStorage.setItem('vault_ledger', JSON.stringify(ledger)); updateDisplay(); } }
        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }
        updateDisplay();
    </script>
</body>
</html>
