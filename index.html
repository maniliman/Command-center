<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Vault v53</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #000000; color: #E5E5E5; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        /* Platinum Glass Aesthetic */
        .glass-panel { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .hero-card { background: linear-gradient(145deg, #111 0%, #050505 100%); border: 1px solid rgba(16, 185, 129, 0.2); box-shadow: 0 0 40px rgba(16, 185, 129, 0.05); border-radius: 28px; position: relative; overflow: hidden; }
        .hero-glow { position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(16,185,129,0.03) 0%, transparent 70%); pointer-events: none; }
        
        .vault-card { background: #111; border: 1px solid #222; border-radius: 18px; margin-bottom: 12px; width: 100%; position: relative; overflow: hidden; transition: transform 0.1s; }
        .vault-card:active { transform: scale(0.99); }
        .sub-drawer { display: none; padding: 20px; background: #080808; border-top: 1px solid #222; }
        .drawer-open > .sub-drawer { display: block !important; }
        
        /* Inputs & Toggles */
        .input-ghost { background: transparent; border: none; color: white; font-size: 16px; width: 100%; outline: none; padding: 16px 0; border-bottom: 1px solid #333; border-radius: 0; transition: 0.2s; }
        .input-ghost:focus { border-bottom-color: #10B981; }
        /* Custom Select Styling */
        select.input-ghost { -webkit-appearance: none; border-radius: 0; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23007CB2%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E"); background-repeat: no-repeat; background-position: right 0.7em top 50%; background-size: 0.65em auto; padding-right: 1.5em; }

        .amount-hero { font-size: 48px; font-weight: 800; text-align: center; background: transparent; border: none; color: #fff; width: 100%; outline: none; padding: 20px 0; letter-spacing: -2px; }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #222; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: #666; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10B981; }
        input:checked + .slider:before { transform: translateX(22px); background-color: white; }

        /* Navigation FAB - HYPER RESPONSIVE */
        .fab-btn { position: fixed; bottom: 40px; right: 30px; width: 72px; height: 72px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; z-index: 50; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); touch-action: none; -webkit-tap-highlight-color: transparent; cursor: pointer; }
        .fab-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: black; }
        .fab-back { background: #333; color: white; }
        .fab-btn:active { transform: scale(0.92); }

        /* Fluid Bar */
        .fluid-bar { display: flex; border-radius: 12px; overflow: hidden; margin-top: 10px; border: 1px solid #333; }
        .fluid-seg { padding: 12px 0; text-align: center; font-size: 10px; font-weight: 700; color: #aaa; background: #111; border-right: 1px solid #222; transition: 0.2s; }
        .fluid-input { background: transparent; width: 100%; text-align: center; color: #fff; font-weight: 700; outline: none; font-size: 14px; }
        .fluid-seg:focus-within { background: #222; color: #10B981; }

        .view-hidden { display: none !important; }
        .stealth-active .maskable { filter: blur(12px); opacity: 0.5; }
        
        /* Grid Icons */
        .grid-btn { background: #111; border: 1px solid #222; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; touch-action: manipulation; }
        .grid-btn:active { background: #18181b; }
        
        /* Segmented Control */
        .seg-control { display: flex; background: #000; padding: 4px; border-radius: 14px; border: 1px solid #222; margin-bottom: 20px; }
        .seg-btn { flex: 1; text-align: center; padding: 12px; font-size: 10px; font-weight: 800; color: #555; border-radius: 10px; transition: 0.2s; touch-action: manipulation; }
        .seg-btn.active.green { background: #064E3B; color: #6EE7B7; border: 1px solid #065F46; }
        .seg-btn.active.red { background: #7F1D1D; color: #FCA5A5; border: 1px solid #991B1B; }
    </style>
</head>
