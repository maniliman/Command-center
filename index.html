<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; margin-bottom: 16px; width: 100%; position: relative; }
        .emerald-border { border: 1px solid #00FF41; background: rgba(0, 255, 65, 0.03); }
        .fiduciary-border { border: 2px solid #EAB308; background: rgba(234, 179, 8, 0.03); }
        .sub-drawer { display: none; padding: 20px; background: rgba(0,0,0,0.6); border-top: 1px solid #262629; }
        .drawer-open > .sub-drawer { display: block !important; }
        .trigger-btn { color: #00FF41; font-size: 18px; padding: 10px; cursor: pointer; }
        .stealth-active .maskable { filter: blur(28px); opacity: 0.3; pointer-events: none; }
        .fab-btn { position: fixed; bottom: 25px; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 999; border: none; }
        .view-hidden { display: none !important; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 18px; border-radius: 12px; width: 100%; outline: none; }
        
        /* PERSISTENT TOGGLE SWITCH */
        .switch-box { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #222; }
        .switch { width: 44px; height: 22px; background: #262629; border-radius: 20px; position: relative; cursor: pointer; }
        .switch.on { background: #00FF41; }
        .knob { width: 18px; height: 18px; background: white; border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.2s; }
        .on .knob { left: 24px; }
    </style>
</head>
<body id="main-body" class="p-6" style="padding-top: calc(var(--safe-top) + 20px);">

    <div id="auth-screen" class="fixed inset-0 bg-[#0A0A0B] z-[10000] flex flex-col items-center justify-center p-10 hidden">
        <p class="text-[10px] tracking-[0.5em] text-emerald-500 mb-8 uppercase font-bold">Secure Access</p>
        <input id="auth-pin" type="password" class="input-dark text-center text-2xl w-full" placeholder="PIN">
        <button onclick="VaultUI.authenticate()" class="mt-8 w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase">Unlock</button>
    </div>

    <div id="dashboard-view" class="space-y-6">
        <div class="flex justify-between items-center mb-8">
            <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/40">Sovereign Command</p>
            <div class="flex gap-3">
                <button onclick="VaultUI.toggleStealth()" class="w-12 h-12 vault-card flex items-center justify-center m-0">👁️</button>
                <button onclick="VaultUI.changeView('settings-view')" class="w-12 h-12 vault-card flex items-center justify-center m-0">⚙️</button>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 id="nw-display" class="text-5xl font-black tracking-tighter text-[#00FF41] maskable">₦0.00</h1>
            <div class="text-[8px] uppercase font-bold text-zinc-600 mt-4 flex justify-center gap-4">
                <span>Cash: <b id="split-cash" class="maskable">₦0</b></span>
                <span>Assets: <b id="split-as" class="maskable">₦0</b></span>
                <span>Debtors: <b id="split-db" class="maskable">₦0</b></span>
            </div>
        </div>

        <div id="cards-container">
            <div id="feat-tactical" class="vault-card emerald-border">
                <div class="p-6 flex justify-between items-center"><span>Tactical Liquidity</span><div class="flex items-center gap-4"><b id="tc-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-tactical')">▼</span></div></div>
                <div class="sub-drawer space-y-4 text-xs font-bold uppercase">
                    <div id="bills-node">
                        <div class="flex justify-between items-center py-2 border-b border-zinc-900" onclick="VaultUI.toggleCard('bills-node')"><span>Bills</span><span id="b-total" class="maskable">₦0</span></div>
                        <div class="sub-drawer space-y-3 text-[10px] text-zinc-400 normal-case">
                            <div class="flex justify-between"><span>Core (40%)</span><span id="b-core" class="maskable">₦0</span></div>
                            <div class="flex justify-between"><span>Reserve (40%)</span><span id="b-reserve" class="maskable">₦0</span></div>
                            <div class="flex justify-between"><span>Ops (20%)</span><span id="b-ops" class="maskable">₦0</span></div>
                        </div>
                    </div>
                    <div class="flex justify-between py-2 border-b border-zinc-900"><span>Savings</span><span id="s-total" class="maskable">₦0</span></div>
                    <div class="flex justify-between py-2"><span>Spend</span><span id="l-total" class="maskable">₦0</span></div>
                </div>
            </div>

            <div id="feat-assets" class="vault-card"><div class="p-6 flex justify-between"><span>Assets</span><div class="flex items-center gap-4"><b id="as-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-assets')">▼</span></div></div><div id="as-list" class="sub-drawer"></div></div>
            <div id="feat-debtors" class="vault-card"><div class="p-6 flex justify-between"><span>Debtors</span><div class="flex items-center gap-4"><b id="db-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-debtors')">▼</span></div></div><div id="db-list" class="sub-drawer"></div></div>
            <div id="feat-creditors" class="vault-card border-red-900/40"><div class="p-6 flex justify-between"><span>Creditors</span><div class="flex items-center gap-4"><b id="cr-display" class="maskable text-red-500">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-creditors')">▼</span></div></div><div id="cr-list" class="sub-drawer"></div></div>

            <div id="feat-fiduciary" class="vault-card fiduciary-border">
                <div class="p-6 flex justify-between items-center text-yellow-500"><span>Fiduciary</span><div class="flex items-center gap-4"><b id="fd-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-fiduciary')">▼</span></div></div>
                <div class="sub-drawer">
                    <div class="flex gap-2 mb-4"><div id="btn-goal" class="t-btn active" onclick="VaultCore.setFdView('goal')">GOAL</div><div id="btn-user" class="t-btn" onclick="VaultCore.setFdView('user')">USER</div></div>
                    <input type="text" id="fd-search" class="input-dark !p-3 !text-xs mb-4" placeholder="Search..." onkeyup="VaultUI.render()">
                    <div id="fd-pivot-list" class="space-y-4"></div>
                </div>
            </div>
            
            <div id="feat-history" class="vault-card opacity-50"><div class="p-6 flex justify-between"><span>History</span><span class="trigger-btn" onclick="VaultUI.toggleCard('feat-history')">▼</span></div><div id="hi-list" class="sub-drawer space-y-2 max-h-64 overflow-y-auto"></div></div>
        </div>
    </div>

    <div id="entry-view" class="view-hidden space-y-6 pb-40">
        <h2 class="text-3xl font-black">AUTHORIZE</h2>
        <select id="e-type" class="input-dark" onchange="VaultUI.updateForm()"><option value="income">Inflow [+]</option><option value="fiduciary">Fiduciary [💼]</option><option value="asset">Asset [+]</option><option value="debtor">Debtor [+]</option><option value="creditor">Creditor [-]</option><option value="expense">Expense [-]</option></select>
        <div id="dynamic-inputs" class="space-y-4"></div>
        <input id="e-datetime" type="datetime-local" class="input-dark"><input id="e-name" class="input-dark" placeholder="Label"><input id="e-amount" type="number" class="input-dark" placeholder="Amount ₦">
        <button onclick="VaultCore.execute()" class="w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase">Execute</button>
    </div>

    <div id="settings-view" class="view-hidden space-y-8">
        <h2 class="text-3xl font-black uppercase">Registry</h2>
        <div class="vault-card p-6 space-y-2" id="toggle-container"></div>
        <div class="vault-card p-6 space-y-4">
            <input id="set-pin" type="password" maxlength="4" class="input-dark" placeholder="New PIN">
            <button onclick="VaultCore.savePin()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-black uppercase text-[10px]">Update Lock</button>
        </div>
        <button onclick="VaultCore.wipe()" class="w-full p-4 border border-red-900 text-red-900 rounded-xl font-bold uppercase text-xs">Purge All Records</button>
    </div>

    <button id="f-add" onclick="VaultUI.changeView('entry-view')" class="fab-btn bg-emerald-500 text-black right-8">+</button>
    <button id="f-back" onclick="VaultUI.changeView('dashboard-view')" class="fab-btn bg-zinc-800 text-white left-8 view-hidden">✕</button>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('VAULT_DB')) || [];
            let pin = localStorage.getItem('VAULT_PIN') || "";
            let config = JSON.parse(localStorage.getItem('VAULT_CFG')) || { tactical:true, assets:true, debtors:true, creditors:true, fiduciary:true, history:true };
            let fdView = 'goal';

            return {
                db: () => db, pin: () => pin, config: () => config, fdView: () => fdView,
                setFdView: (v) => { fdView = v; VaultUI.render(); },
                toggle: (k) => { config[k] = !config[k]; localStorage.setItem('VAULT_CFG', JSON.stringify(config)); VaultUI.render(); },
                savePin: () => { const p = document.getElementById('set-pin').value; if(p.length === 4 || p === "") { localStorage.setItem('VAULT_PIN', p); pin = p; alert("PIN Updated"); } },
                execute: () => {
                    const t = document.getElementById('e-type').value, n = document.getElementById('e-name').value, a = parseFloat(document.getElementById('e-amount').value), dt = document.getElementById('e-datetime').value;
                    if (!n || isNaN(a)) return;
                    let e = { id: Date.now(), name: n, total: a, type: t, rawDate: dt };
                    if (t === 'income') { e.b = a * (parseFloat(document.getElementById('ps-b').value)/100 || 0.4); e.s = a * (parseFloat(document.getElementById('ps-s').value)/100 || 0.4); e.l = a * (parseFloat(document.getElementById('ps-l').value)/100 || 0.2); }
                    else if (t === 'expense') { e.total = -a; const s = document.getElementById('e-src').value; if(s === 'bills') e.b = -a; else if(s === 'savings') e.s = -a; else e.l = -a; }
                    else if (t === 'fiduciary') { e.goal = document.getElementById('e-fd-goal').value; e.user = document.getElementById('e-fd-user').value; }
                    else if (t === 'debtor' || t === 'creditor') { e.total = t==='creditor' ? -a : a; e.rate = document.getElementById('e-rate').value; }
                    else if (t === 'asset') e.cat = document.getElementById('e-as-cat').value;
                    db.push(e); localStorage.setItem('VAULT_DB', JSON.stringify(db)); VaultUI.changeView('dashboard-view');
                },
                delete: (id) => { if(confirm("Delete?")) { db = db.filter(i => i.id !== id); localStorage.setItem('VAULT_DB', JSON.stringify(db)); VaultUI.render(); } },
                wipe: () => { if(confirm("Purge?")) { localStorage.clear(); location.reload(); } }
            };
        })();

        const VaultUI = (() => {
            return {
                toggleCard: (id) => document.getElementById(id).classList.toggle('drawer-open'),
                toggleStealth: () => document.body.classList.toggle('stealth-active'),
                authenticate: () => { if(document.getElementById('auth-pin').value === VaultCore.pin()) { document.getElementById('auth-screen').classList.add('hidden'); VaultUI.render(); } else alert("Denied"); },
                changeView: (id) => {
                    ['dashboard-view', 'entry-view', 'settings-view'].forEach(v => document.getElementById(v).classList.add('view-hidden'));
                    document.getElementById(id).classList.remove('view-hidden');
                    document.getElementById('f-add').classList.toggle('view-hidden', id !== 'dashboard-view');
                    document.getElementById('f-back').classList.toggle('view-hidden', id === 'dashboard-view');
                    VaultUI.render(); VaultUI.updateForm();
                },
                updateForm: () => {
                    const t = document.getElementById('e-type').value, c = document.getElementById('dynamic-inputs'); c.innerHTML = '';
                    if(t === 'income') c.innerHTML = '<div class="vault-card p-6 border-emerald-500/20"><div class="grid grid-cols-3 gap-3"><input id="ps-b" type="number" class="input-dark !p-3" placeholder="Bills %"><input id="ps-s" type="number" class="input-dark !p-3" placeholder="Save %"><input id="ps-l" type="number" class="input-dark !p-3" placeholder="Spend %"></div></div>';
                    if(t === 'fiduciary') c.innerHTML = '<input id="e-fd-goal" class="input-dark" placeholder="Goal"><input id="e-fd-user" class="input-dark mt-4" placeholder="Contributor">';
                    if(t === 'asset') c.innerHTML = '<select id="e-as-cat" class="input-dark"><option value="Property">Property</option><option value="Vehicle">Vehicle</option></select>';
                    if(t === 'debtor' || t === 'creditor') c.innerHTML = '<input id="e-rate" type="number" class="input-dark" placeholder="Rate %"><input id="e-terms" type="number" class="input-dark mt-4" placeholder="Months">';
                    if(t === 'expense') c.innerHTML = '<select id="e-src" class="input-dark"><option value="bills">Bills Account</option><option value="savings">Savings Account</option></select>';
                },
                render: () => {
                    const db = VaultCore.db(), cfg = VaultCore.config(), search = (document.getElementById('fd-search')?.value || "").toLowerCase();
                    let nw=0, b=0, sA=0, l=0, as=0, fd=0, dbT=0, crT=0;
                    
                    // TOGGLE RENDERING
                    Object.keys(cfg).forEach(k => {
                        const card = document.getElementById(`feat-${k}`);
                        if(card) card.classList.toggle('view-hidden', !cfg[k]);
                    });
                    const tContainer = document.getElementById('toggle-container');
                    if(tContainer) {
                        tContainer.innerHTML = '<p class="text-[10px] font-bold text-zinc-500 uppercase mb-2">Visibility</p>';
                        Object.keys(cfg).forEach(k => {
                            tContainer.innerHTML += `<div class="switch-box"><span class="text-[10px] font-bold uppercase">${k}</span><div class="switch ${cfg[k]?'on':''}" onclick="VaultCore.toggle('${k}')"><div class="knob"></div></div></div>`;
                        });
                    }

                    // DATA RENDERING
                    ['as-list','db-list','cr-list','fd-pivot-list','hi-list'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerHTML = ''; });
                    const pv = {};
                    db.slice().reverse().forEach(i => {
                        if(i.type === 'fiduciary') {
                            fd += i.total; const m = VaultCore.fdView()==='goal'?i.goal:i.user, sb = VaultCore.fdView()==='goal'?i.user:i.goal;
                            if(!pv[m]) pv[m]={t:0,sb:[]}; pv[m].t+=i.total; pv[m].sb.push({n:sb,a:i.total});
                        } else {
                            nw += i.total; b += (i.b||0); sA += (i.s||0); l += (i.l||0);
                            if(i.type==='asset') as+=i.total; if(i.type==='debtor') dbT+=i.total; if(i.type==='creditor') crT+=Math.abs(i.total);
                        }
                        const hi = document.getElementById('hi-list');
                        if(hi) hi.innerHTML += `<div class="flex justify-between py-2 border-b border-zinc-800 text-[10px] uppercase"><span>${i.name}</span><div class="flex items-center gap-4"><span>₦${Math.abs(i.total).toLocaleString()}</span><button onclick="VaultCore.delete(${i.id})">✕</button></div></div>`;
                    });

                    Object.keys(pv).forEach(k => {
                        if(k.toLowerCase().includes(search)) {
                            let rows = pv[k].sb.map(x=>`<div class="flex justify-between py-1 opacity-60"><span>${x.n}</span><span>₦${x.a.toLocaleString()}</span></div>`).join('');
                            document.getElementById('fd-pivot-list').innerHTML += `<div class="pivot-card"><div class="flex justify-between font-black text-xs text-yellow-500 uppercase"><span>${k}</span><span>₦${pv[k].t.toLocaleString()}</span></div><div class="mt-2 pt-2 border-t border-white/5 text-[9px]">${rows}</div></div>`;
                        }
                    });

                    const set = (id, v) => { const el = document.getElementById(id); if(el) el.innerText = "₦" + v.toLocaleString(); };
                    set('nw-display', nw); set('tc-display', (b+sA+l)); set('split-cash', (b+sA+l)); set('b-total', b); set('s-total', sA); set('l-total', l); set('fd-display', fd); set('cr-display', crT); set('as-display', as); set('db-display', dbT); set('split-as', as); set('split-db', dbT);
                }
            };
        })();

        window.onload = () => { if(VaultCore.pin()) document.getElementById('auth-screen').classList.remove('hidden'); else VaultUI.render(); };
    </script>
</body>
</html>
