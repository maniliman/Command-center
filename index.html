<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <link rel="icon" href="https://img.icons8.com/nolan/64/safe.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; font-size: 14px; }
        
        #dashboard-content { position: relative; z-index: 10; padding: 24px; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 5000 !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }

        .overlay { display: none; position: fixed; inset: 0; z-index: 9000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); padding: 24px; padding-top: 60px; overflow-y: auto; }
        .overlay-open { display: flex !important; flex-direction: column; }
        
        summary { cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        .balance-chip { background: #0A0A0B; border: 1px solid #262629; border-radius: 8px; padding: 8px; font-size: 10px; text-align: center; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleOverlay('intel-overlay')" class="p-3 vault-card text-[10px] uppercase border border-zinc-800">📊 Intel</button>
                <button onclick="toggleOverlay('settings-overlay')" class="p-3 vault-card text-[10px] uppercase border border-zinc-800">⚙️</button>
                <button id="stealth-trigger" onclick="togglePrivacy()" class="p-3 vault-card text-[10px] uppercase border border-zinc-800">Stealth</button>
            </div>
        </header>

        <div id="sec-cash" class="vault-card p-5 mb-8 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6 underline decoration-emerald-500 underline-offset-4">Tactical Cash Split</p>
            <div class="space-y-4 font-bold">
                <div class="flex justify-between text-xs"><span class="text-zinc-500 uppercase">Bills Account</span><span id="alloc-bills" class="emerald-text">₦0</span></div>
                <div class="flex justify-between text-xs"><span class="text-zinc-500 uppercase">Savings</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between text-xs"><span class="text-zinc-500 uppercase">Spend</span><span id="alloc-life">₦0</span></div>
                <div class="border-t border-zinc-800 pt-4 flex justify-between items-center text-sm"><span class="text-[10px] text-zinc-400 uppercase font-black">Total Cash Balance</span><span id="total-cash" class="emerald-text font-mono">₦0</span></div>
            </div>
        </div>

        <details id="sec-assets" class="vault-card group mb-4 border-emerald-900/20">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black">Asset Inventory</span><span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span></summary>
            <div id="multi-tier-assets" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>

        <details id="sec-liabilities" class="vault-card group mb-4 border-red-900/20">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black oxblood-text">Liability Ledger</span><span id="inv-debt-total" class="text-sm font-bold oxblood-text">₦0</span></summary>
            <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4"></div>
        </details>

        <details id="sec-fiduciary" class="vault-card group mb-12 border-gold-text/20">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black gold-text">Fiduciary Ledger</span><span id="f-total-header" class="text-sm font-bold gold-text">₦0</span></summary>
            <div id="fiduciary-main-list" class="px-5 pb-5 space-y-4 border-t border-zinc-900 pt-4"></div>
        </details>
    </div>

    <div id="entry-overlay" class="overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto pb-10">
            <h2 class="text-xl font-bold uppercase tracking-tighter">New Transaction</h2>
            
            <div id="transfer-preview" class="hidden grid grid-cols-3 gap-2 mb-4">
                <div class="balance-chip"><p class="text-zinc-600 uppercase">Bills</p><p id="live-bills" class="emerald-text font-bold">₦0</p></div>
                <div class="balance-chip"><p class="text-zinc-600 uppercase">Save</p><p id="live-save" class="emerald-text font-bold">₦0</p></div>
                <div class="balance-chip"><p class="text-zinc-600 uppercase">Spend</p><p id="live-life" class="emerald-text font-bold">₦0</p></div>
            </div>

            <div class="space-y-4">
                <select id="form-category" class="input-dark" onchange="handleCatChange()">
                    <option value="Personal">Personal wealth</option>
                    <option value="Fiduciary">Fiduciary Contribution</option>
                    <option value="Transfer">Internal Transfer</option>
                </select>
                
                <input id="form-date" type="date" class="input-dark">
                <input id="form-name" class="input-dark" placeholder="Description">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                
                <div id="standard-fields">
                    <select id="form-type" class="input-dark">
                        <option value="Cash">Cash (Auto-Split)</option>
                        <option value="Stocks">Stocks</option>
                        <option value="Property">Property</option>
                        <option value="Liability">Liability</option>
                    </select>
                </div>

                <div id="transfer-fields" class="hidden space-y-4">
                    <div class="space-y-2">
                        <label class="text-[8px] text-zinc-500 uppercase font-black">Source Account</label>
                        <select id="trans-source" class="input-dark"><option value="bills">From Bills</option><option value="savings">From Savings</option><option value="lifestyle">From Spend</option></select>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[8px] text-zinc-500 uppercase font-black">Destination</label>
                        <select id="trans-dest" class="input-dark"><option value="savings">To Savings</option><option value="lifestyle">To Spend</option><option value="bills">To Bills</option></select>
                    </div>
                </div>
            </div>
            <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs mt-4">Authorize Transaction</button>
            <button onclick="toggleOverlay('entry-overlay')" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Back</button>
        </div>
    </div>

    <div id="intel-overlay" class="overlay"></div>
    <div id="settings-overlay" class="overlay"></div>

    <button onclick="toggleOverlay('entry-overlay')" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-4xl font-bold">+</button>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];
        let userPin = localStorage.getItem('vault_pin') || "0000";
        
        // Global Liquidity Counters for Live Check
        let globalLiquidity = { bills: 0, savings: 0, lifestyle: 0 };

        document.getElementById('form-date').valueAsDate = new Date();

        function mask(val) { return stealth ? "••••" : (parseFloat(val) || 0).toLocaleString(); }

        function updateDisplay() {
            let aSum = 0, dSum = 0, fGlobal = 0;
            globalLiquidity = { bills: 0, savings: 0, lifestyle: 0 };
            
            const dList = document.getElementById('debt-list'), fMainList = document.getElementById('fiduciary-main-list'), mAssets = document.getElementById('multi-tier-assets');
            dList.innerHTML = ''; fMainList.innerHTML = ''; mAssets.innerHTML = '';

            const assetGroups = { Stocks: {t:0, e:[]}, Property: {t:0, e:[]} };

            ledger.forEach(item => {
                const val = parseFloat(item.amount) || 0;
                if (item.type === 'Liability') {
                    dSum += val;
                    dList.innerHTML += `<div class="flex justify-between py-1 border-b border-zinc-900"><span>${item.name}</span><span class="oxblood-text">₦${mask(val)}</span></div>`;
                } else if (item.type === 'Cash') {
                    globalLiquidity.bills += (item.bills || 0);
                    globalLiquidity.savings += (item.savings || 0);
                    globalLiquidity.lifestyle += (item.lifestyle || 0);
                    aSum += val;
                } else {
                    const type = item.type || 'Property';
                    if(!assetGroups[type]) assetGroups[type] = {t:0, e:[]};
                    assetGroups[type].t += val; assetGroups[type].e.push(item); aSum += val;
                }
            });

            const tCash = globalLiquidity.bills + globalLiquidity.savings + globalLiquidity.lifestyle;

            // Update UI Counters
            document.getElementById('alloc-bills').innerText = "₦" + mask(globalLiquidity.bills);
            document.getElementById('alloc-savings').innerText = "₦" + mask(globalLiquidity.savings);
            document.getElementById('alloc-life').innerText = "₦" + mask(globalLiquidity.lifestyle);
            document.getElementById('total-cash').innerText = "₦" + mask(tCash);
            document.getElementById('networth').innerText = "₦" + mask(aSum - dSum);
            document.getElementById('inv-assets-total').innerText = "₦" + mask(aSum);
            document.getElementById('inv-debt-total').innerText = "₦" + mask(dSum);

            // Update Live Indicators in Transfer Modal
            document.getElementById('live-bills').innerText = "₦" +
