<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Vault v61</title>
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Sovereign%22,%22short_name%22:%22Vault%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#10B981%22}">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #000000; color: #E5E5E5; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .hero-card { background: linear-gradient(145deg, #111 0%, #050505 100%); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 28px; position: relative; }
        .vault-card { background: #111; border: 1px solid #222; border-radius: 18px; margin-bottom: 12px; width: 100%; overflow: hidden; }
        .sub-drawer { display: none; padding: 20px; background: #080808; border-top: 1px solid #222; }
        .drawer-open > .sub-drawer { display: block !important; }
        .input-ghost { background: transparent; border: none; color: white; font-size: 16px; width: 100%; outline: none; padding: 12px 0; border-bottom: 1px solid #333; }
        .amount-hero { font-size: 48px; font-weight: 800; text-align: center; color: #fff; width: 100%; outline: none; padding: 20px 0; letter-spacing: -2px; background: transparent; border: none; }
        .fab-btn { position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; z-index: 9999; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .fab-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: black; }
        .fab-back { background: #333; color: white; }
        .seg-control { display: flex; background: #000; padding: 4px; border-radius: 14px; border: 1px solid #222; margin-bottom: 20px; }
        .seg-btn { flex: 1; text-align: center; padding: 10px; font-size: 10px; font-weight: 800; color: #555; border-radius: 10px; }
        .seg-btn.active.yellow { background: #78350f; color: #fcd34d; }
        .view-hidden { display: none !important; }
        .stealth-active .maskable { filter: blur(12px); opacity: 0.5; }
        .grid-btn { background: #111; border: 1px solid #222; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .q-tag { font-size: 7px; font-weight: 900; padding: 2px 4px; border-radius: 3px; text-transform: uppercase; margin-right: 6px; }
    </style>
</head>
<body id="main-body" class="p-4" style="padding-top: calc(var(--safe-top) + 10px);">

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-black flex flex-col items-center justify-center p-8 view-hidden">
        <div class="w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center mb-8 text-2xl">🔒</div>
        <input id="auth-pin" type="password" class="bg-transparent border-b border-zinc-800 text-center text-4xl tracking-[0.5em] w-2/3 outline-none text-white focus:border-emerald-500" placeholder="••••" maxlength="4">
        <button onclick="VaultUI.authenticate()" class="mt-12 w-full glass-panel py-5 text-xs font-black uppercase text-white">Unlock</button>
    </div>

    <div id="dashboard-view" class="space-y-6 pb-32">
        <div class="flex justify-between items-center px-2 mb-4">
            <span class="text-[10px] font-black tracking-widest text-zinc-600 uppercase">Sovereign v61</span>
            <div class="flex gap-2">
                <button onclick="VaultUI.changeView('query-lab')" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">🔍</button>
                <button onclick="VaultUI.toggleStealth()" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">👁️</button>
                <button onclick="VaultUI.changeView('settings-view')" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">⚙️</button>
            </div>
        </div>

        <div class="hero-card p-10 text-center mt-6">
            <h1 id="nw-display" class="text-5xl font-black tracking-tighter text-white maskable">₦0.00</h1>
            <div class="flex justify-center gap-6 mt-6 opacity-80">
                <div class="text-center"><p id="split-cash" class="text-xs font-bold maskable text-emerald-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Cash</p></div>
                <div class="text-center"><p id="split-as" class="text-xs font-bold maskable text-blue-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Assets</p></div>
                <div class="text-center"><p id="split-db" class="text-xs font-bold maskable text-yellow-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Debt</p></div>
            </div>
        </div>

        <div id="cards-container">
            <div id="feat-tactical" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-tactical')"><span class="text-xs font-bold uppercase">Liquidity</span><b id="tc-display" class="maskable text-sm text-emerald-500">₦0</b></div><div class="sub-drawer space-y-4"><div class="flex justify-between uppercase text-[10px]"><span>Bills</span><span id="b-total" class="maskable">₦0</span></div><div class="flex justify-between uppercase text-[10px]"><span>Savings</span><span id="s-total" class="maskable">₦0</span></div><div class="flex justify-between uppercase text-[10px]"><span>Spend</span><span id="l-total" class="maskable">₦0</span></div></div></div>
            <div id="feat-expenses" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-expenses')"><span class="text-xs font-bold uppercase text-red-500">Expenses Ledger</span><b id="ex-display" class="maskable text-sm text-red-400">₦0</b></div><div id="ex-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-assets" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-assets')"><span class="text-xs font-bold uppercase text-blue-500">Assets</span><b id="as-display" class="maskable text-sm text-blue-400">₦0</b></div><div id="as-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-debtors" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-debtors')"><span class="text-xs font-bold uppercase">Debtors</span><b id="db-display" class="maskable text-sm text-emerald-500">₦0</b></div><div id="db-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-creditors" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-creditors')"><span class="text-xs font-bold uppercase">Creditors</span><b id="cr-display" class="maskable text-sm text-red-500">₦0</b></div><div id="cr-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-fiduciary" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-fiduciary')"><span class="text-xs font-bold uppercase text-yellow-600">Fiduciary</span><b id="fd-display" class="maskable text-sm text-yellow-500">₦0</b></div><div class="sub-drawer"><div class="seg-control"><div class="seg-btn active yellow" id="fd-v-goal" onclick="VaultCore.setFdView('goal')">GOAL</div><div class="seg-btn" id="fd-v-user" onclick="VaultCore.setFdView('user')">USER</div></div><input type="text" id="fd-search" class="input-ghost !text-xs mb-4" placeholder="Search Projects..." onkeyup="VaultUI.render()"><div id="fd-pivot-list" class="space-y-4"></div></div></div>
            
            <div id="feat-history" class="vault-card opacity-50"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-history')"><span class="text-xs font-bold uppercase">Audit Trail</span><span>▼</span></div><div class="sub-drawer"><input type="text" id="hi-search" class="input-ghost !text-xs mb-4" placeholder="Search History..." onkeyup="VaultUI.render()"><div id="hi-list" class="space-y-2 max-h-64 overflow-y-auto"></div></div></div>
        </div>
    </div>

    <div id="query-lab" class="view-hidden fixed inset-0 bg-black z-[2000] p-6 overflow-y-auto pt-20">
        <input type="text" id="q-search" class="input-ghost text-2xl" placeholder="Query anything..." onkeyup="VaultUI.runQuery()">
        <div class="flex gap-2 mt-4"><input type="date" id="q-start" class="input-ghost text-[10px]" onchange="VaultUI.runQuery()"><input type="date" id="q-end" class="input-ghost text-[10px]" onchange="VaultUI.runQuery()"></div>
        <div id="q-results" class="mt-10 space-y-4 pb-32"></div>
    </div>

    <div id="entry-grid" class="view-hidden fixed inset-0 bg-black z-[1000] p-6 flex flex-col pt-24">
        <div class="grid grid-cols-2 gap-4">
            <button onclick="VaultUI.openForm('income')" class="grid-btn border-emerald-900/30">📥<span class="text-[10px] font-bold text-emerald-500 uppercase">Inflow</span></button>
            <button onclick="VaultUI.openForm('expense')" class="grid-btn border-red-900/30">📤<span class="text-[10px] font-bold text-red-500 uppercase">Expense</span></button>
            <button onclick="VaultUI.openForm('asset')" class="grid-btn">💎<span class="text-[10px] font-bold uppercase">Asset</span></button>
            <button onclick="VaultUI.openForm('fiduciary')" class="grid-btn">💼<span class="text-[10px] font-bold uppercase">Fiduciary</span></button>
            <button onclick="VaultUI.openForm('debtor')" class="grid-btn">🟢<span class="text-[10px] font-bold uppercase">Lend</span></button>
            <button onclick="VaultUI.openForm('creditor')" class="grid-btn">🔴<span class="text-[10px] font-bold uppercase">Borrow</span></button>
        </div>
    </div>

    <div id="entry-form" class="view-hidden fixed inset-0 bg-black z-[2000] p-6 pt-20">
        <div id="settle-toggle-container" class="mb-6"></div>
        <input id="e-amount" type="number" class="amount-hero" placeholder="0">
        <div id="dynamic-inputs" class="space-y-4"></div>
        <input id="e-name" class="input-ghost" placeholder="Description" list="active-list">
        <datalist id="active-list"></datalist>
        <button onclick="VaultCore.execute()" class="fixed bottom-10 left-6 right-6 glass-panel py-6 text-sm font-black text-white uppercase bg-zinc-900">Confirm Execution</button>
    </div>

    <div id="settings-view" class="view-hidden space-y-8 p-4 pt-20">
        <div class="glass-panel p-6 space-y-6">
            <div class="flex justify-between items-center"><p class="text-sm font-bold uppercase">Security PIN</p><label class="switch"><input type="checkbox" id="tog-pin" onchange="VaultCore.toggleSetting('reqPin')"><span class="slider"></span></label></div>
            <input id="set-pin" type="text" maxlength="4" class="input-ghost text-center tracking-[0.5em]" placeholder="••••">
            <button onclick="VaultCore.savePin()" class="w-full bg-zinc-800 py-3 rounded-xl text-[10px] font-black uppercase">Update Access PIN</button>
        </div>
        <div class="flex gap-2"><button onclick="VaultCore.export()" class="flex-1 bg-zinc-800 py-4 rounded-xl text-[10px] font-bold uppercase">Export Backup</button><button onclick="document.getElementById('file-input').click()" class="flex-1 bg-zinc-800 py-4 rounded-xl text-[10px] font-bold uppercase text-emerald-400">Import Data</button><input type="file" id="file-input" class="hidden" onchange="VaultCore.import(this)"></div>
        <button onclick="VaultCore.wipe()" class="w-full py-4 border border-red-900/50 text-red-700 rounded-xl text-[10px] font-black uppercase">Factory Reset</button>
    </div>

    <button id="nav-fab" onclick="VaultUI.handleFab()" class="fab-btn fab-primary">+</button>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('SOV_DB_V61')) || [];
            let config = JSON.parse(localStorage.getItem('SOV_CFG_V61')) || { reqPin: true };
            let pin = localStorage.getItem('SOV_PIN_V61') || "";
            let fdView = 'goal', activeType = 'income', settlement = false;

            const save = () => { localStorage.setItem('SOV_DB_V61', JSON.stringify(db)); localStorage.setItem('SOV_CFG_V61', JSON.stringify(config)); };

            return {
                db: () => db, config: () => config, pin: () => pin, fdView: () => fdView,
                getType: () => activeType, isSettlement: () => settlement,
                setType: t => { activeType = t; settlement = false; },
                setSettlement: b => { settlement = b; VaultUI.updateFormUI(); },
                setFdView: v => { fdView = v; VaultUI.render(); },
                toggleSetting: k => { config[k] = !config[k]; save(); },
                savePin: () => { const p = document.getElementById('set-pin').value; if(p.length===4){ pin=p; localStorage.setItem('SOV_PIN_V61', p); alert("PIN Locked"); }},
                execute: () => {
                    const a = parseFloat(document.getElementById('e-amount').value), desc = document.getElementById('e-name').value;
                    if(!desc || isNaN(a)) return;
                    let e = { id: Date.now(), name: desc, total: a, type: activeType, date: new Date().toISOString().split('T')[0] };
                    if(activeType==='debtor'||activeType==='creditor'){ e.rate = document.getElementById('e-rate')?.value; e.term = document.getElementById('e-term')?.value; }
                    if(activeType === 'income') { if(settlement){ e.type='debt_repayment'; e.debtor=desc; } e.b=a*0.4; e.s=a*0.4; e.l=a*0.2; }
                    else if(activeType === 'expense') { e.total=-a; if(settlement){ e.type='credit_settlement
