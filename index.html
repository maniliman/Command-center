<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        
        .stealth-btn { position: relative; z-index: 100 !important; pointer-events: all !important; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 999 !important; pointer-events: all !important; box-shadow: 0 0 20px rgba(0, 255, 65, 0.3); }
        #menu-overlay { display: none; position: fixed; inset: 0; z-index: 1000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(20px); }
        .menu-open { display: flex !important; }
    </style>
</head>
<body class="p-6 pb-40">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold">Global Net Worth</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="stealth-btn p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800 active:bg-zinc-800">
                Stealth
            </button>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="vault-card p-4 border-l-2 border-emerald-500">
                <p class="text-[#71717A] text-[9px] uppercase mb-1 font-bold">Total Assets</p>
                <p id="total-assets" class="emerald-text font-bold text-lg font-mono">₦0</p>
            </div>
            <div class="vault-card p-4 border-l-2 border-red-500">
                <p class="text-[#71717A] text-[9px] uppercase mb-1 font-bold">Total Debt</p>
                <p id="total-debt" class="oxblood-text font-bold text-lg font-mono">₦0</p>
            </div>
        </div>

        <div class="vault-card p-5 mb-8 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6 underline decoration-emerald-500 underline-offset-4">Tactical Cash Split</p>
            <div class="space-y-4">
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Bills / Compulsory (40%)</span><span id="alloc-bills" class="font-mono text-emerald-500">₦0</span></div>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Custom Savings</span><span id="alloc-savings" class="font-mono">₦0</span></div>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Lifestyle Spend</span><span id="alloc-life" class="font-mono">₦0</span></div>
                <div class="border-t border-emerald-500/20 pt-4 flex justify-between items-center">
                    <span class="text-[10px] text-zinc-400 uppercase font-bold">Liquid Cash Balance</span>
                    <span id="total-cash" class="text-sm font-bold emerald-text font-mono">₦0</span>
                </div>
            </div>
        </div>

        <details class="vault-card group mb-4">
            <summary class="p-5 flex justify-between items-center list-none cursor-pointer"><span class="text-[10px] uppercase tracking-widest font-black">Asset Inventory</span><span class="text-zinc-600 group-open:rotate-180">▼</span></summary>
            <div id="asset-list" class="px-5 pb-5 space-y-2 border-t border-zinc-800 pt-4 text-[11px]"></div>
        </details>

        <details class="vault-card group mb-4">
            <summary class="p-5 flex justify-between items-center list-none cursor-pointer"><span class="text-[10px] uppercase tracking-widest font-black">Liability Ledger</span><span class="text-zinc-600 group-open:rotate-180">▼</span></summary>
            <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-800 pt-4 text-[11px]"></div>
        </details>

        <button onclick="resetVault()" class="w-full mt-10 p-4 text-[9px] uppercase tracking-widest text-zinc-800 border border-zinc-900 rounded-lg active:bg-zinc-800">Reset Dashboard</button>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-3xl font-bold active:scale-90 transition-transform">+</button>

    <div id="menu-overlay" class="flex-col items-center justify-center p-8">
        <div class="w-full space-y-4 max-w-sm">
            <button onclick="addCashEntry()" class="w-full vault-card p-6 text-left border-l-4 border-emerald-500 active:bg-zinc-800"><p class="emerald-text font-bold uppercase text-xs">Add Liquid Cash</p></button>
            <button onclick="addEntry('Asset')" class="w-full vault-card p-6 text-left border-l-4 border-zinc-600 active:bg-zinc-800"><p class="text-zinc-300 font-bold uppercase text-xs">Add Fixed Asset</p></button>
            <button onclick="addEntry('Liability')" class="w-full vault-card p-6 text-left border-l-4 border-red-500 active:bg-zinc-800"><p class="oxblood-text font-bold uppercase text-xs">Add Liability</p></button>
            <button onclick="toggleMenu()" class="w-full p-6 text-zinc-600 text-[10px] uppercase tracking-widest text-center mt-6">Close</button>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];

        // Legacy cleanup: Move old balance into the new ledger system
        const oldBalance = parseFloat(localStorage.getItem('vault_balance'));
        if (!isNaN(oldBalance) && oldBalance > 0) {
            ledger.push({ name: "Legacy Balance", amount: oldBalance, type: 'Asset' });
            localStorage.removeItem('vault_balance'); // Clear the old slot
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
        }

        function updateDisplay() {
            let assetsSum = 0; let debtSum = 0; 
            let billsSum = 0; let savingsSum = 0; let lifestyleSum = 0; let totalCash = 0;
            
            const assetList = document.getElementById('asset-list');
            const debtList = document.getElementById('debt-list');
            assetList.innerHTML = ''; debtList.innerHTML = '';

            ledger.forEach((item, index) => {
                const isAsset = (item.type === 'Asset' || item.type === 'Cash');
                const isDebt = (item.type === 'Liability');
                
                if(isAsset) assetsSum += item.amount; 
                if(isDebt) debtSum += item.amount;
                
                if(item.type === 'Cash') {
                    totalCash += item.amount;
                    billsSum += item.bills || 0;
                    savingsSum += item.savings || 0;
                    lifestyleSum += item.lifestyle || 0;
                }

                const target = isAsset ? assetList : debtList;
                target.innerHTML += `
                    <div class="flex justify-between items-center py-2 border-b border-zinc-900 last:border-0">
                        <span class="text-zinc-400 font-bold uppercase text-[9px]">${item.name}</span>
                        <div class="flex items-center gap-4">
                            <span class="${isAsset ? 'emerald-text' : 'oxblood-text'} font-mono">₦${stealth ? '••••' : item.amount.toLocaleString()}</span>
                            <button onclick="deleteItem(${index})" class="text-zinc-800 px-2 font-black">×</button>
                        </div>
                    </div>
                `;
            });

            const netWorthValue = assetsSum - debtSum;
            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + netWorthValue.toLocaleString();
            document.getElementById('total-assets').innerText = stealth ? "••••" : "₦" + assetsSum.toLocaleString();
            document.getElementById('total-debt').innerText = stealth ? "••••" : "₦" + debtSum.toLocaleString();
            document.getElementById('total-cash').innerText = stealth ? "••••" : "₦" + totalCash.toLocaleString();

            document.getElementById('alloc-bills').innerText = stealth ? "••••" : "₦" + billsSum.toLocaleString();
            document.getElementById('alloc-savings').innerText = stealth ? "••••" : "₦" + savingsSum.toLocaleString();
            document.getElementById('alloc-life').innerText = stealth ? "••••" : "₦" + lifestyleSum.toLocaleString();
        }

        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }

        function addCashEntry() {
            const name = prompt("Cash Source:");
            const amount = parseFloat(prompt("Amount (₦):"));
            if (!name || isNaN(amount)) return;

            const billsPct = 40;
            const savePct = parseFloat(prompt("Percentage for Savings?"));
            const lifePct = parseFloat(prompt("Percentage for Lifestyle?"));

            if (isNaN(savePct) || isNaN(lifePct)) return;

            ledger.push({
                name,
                amount,
                type: 'Cash',
                bills: (amount * (billsPct / 100)),
                savings: (amount * (savePct / 100)),
                lifestyle: (amount * (lifePct / 100))
            });
            saveAndRefresh();
        }

        function addEntry(type) {
            const name = prompt(`Label this ${type}:`);
            const amount = prompt("Value (₦):");
            if (name && amount && !isNaN(amount)) {
                ledger.push({ name, amount: parseFloat(amount), type });
                saveAndRefresh();
            }
        }

        function deleteItem(index) {
            if(confirm("Delete entry?")) {
                ledger.splice(index, 1);
                saveAndRefresh();
            }
        }

        function resetVault() {
            if(confirm("Wipe all data?")) {
                ledger = [];
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
                updateDisplay();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay();
            const overlay = document.getElementById('menu-overlay');
            if (overlay.classList.contains('menu-open')) toggleMenu();
        }

        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        updateDisplay();
    </script>
</body>
</html>
