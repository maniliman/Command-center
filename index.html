<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Vault v73</title>
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/shield.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Vault%22,%22short_name%22:%22Vault%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#10B981%22,%22icons%22:[{%22src%22:%22https://img.icons8.com/fluency/512/shield.png%22,%22sizes%22:%22512x512%22,%22type%22:%22image/png%22}]}">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #000; color: #E5E5E5; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .hero-card { background: linear-gradient(145deg, #111 0%, #050505 100%); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 28px; position: relative; }
        .vault-card { background: #111; border: 1px solid #222; border-radius: 18px; margin-bottom: 12px; width: 100%; overflow: hidden; }
        .sub-drawer { display: none; padding: 20px; background: #080808; border-top: 1px solid #222; }
        .drawer-open > .sub-drawer { display: block !important; }
        .input-ghost { background: transparent; border: none; color: white; font-size: 16px; width: 100%; outline: none; padding: 12px 0; border-bottom: 1px solid #333; border-radius: 0; }
        .amount-hero { font-size: 48px; font-weight: 900; text-align: center; color: #fff; width: 100%; outline: none; padding: 20px 0; letter-spacing: -2px; background: transparent; border: none; }
        .fab-btn { position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; z-index: 9999; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .fab-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: black; }
        .fab-back { background: #333; color: white; }
        .view-hidden { display: none !important; }
        .stealth-active .maskable { filter: blur(20px); opacity: 0.3; }
        .seg-control { display: flex; background: #000; padding: 4px; border-radius: 14px; border: 1px solid #222; margin-bottom: 20px; }
        .seg-btn { flex: 1; text-align: center; padding: 10px; font-size: 10px; font-weight: 800; color: #555; border-radius: 10px; }
        .seg-btn.active.emerald { background: #064E3B; color: #10B981; }
        .q-pill { padding: 8px 16px; border-radius: 20px; border: 1px solid #333; font-size: 10px; font-weight: 800; color: #666; transition: 0.2s; white-space: nowrap; }
        .q-pill.active { border-color: #10B981; color: #10B981; background: rgba(16,185,129,0.1); }
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #222; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: #666; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #10B981; }
        input:checked + .slider:before { transform: translateX(22px); background-color: white; }
    </style>
</head>
<body id="main-body" class="p-4" style="padding-top: calc(var(--safe-top) + 10px);">

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-black flex flex-col items-center justify-center p-8 view-hidden">
        <div class="w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center mb-8 text-2xl">🔒</div>
        <input id="auth-pin" type="password" class="bg-transparent border-b border-zinc-800 text-center text-4xl tracking-[0.5em] w-2/3 outline-none text-white focus:border-emerald-500" placeholder="••••" maxlength="4" inputmode="numeric">
        <button onclick="VaultUI.authenticate()" class="mt-12 w-full glass-panel py-5 text-xs font-black uppercase text-white active:bg-zinc-800">Unlock</button>
    </div>

    <div id="dashboard-view" class="space-y-6 pb-32">
        <div class="flex justify-between items-center px-2">
            <span class="text-[10px] font-black tracking-widest text-zinc-600 uppercase">Sovereign v73</span>
            <div class="flex gap-2">
                <button onclick="VaultUI.changeView('query-lab')" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">🔍</button>
                <button onclick="VaultUI.toggleStealth()" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">👁️</button>
                <button onclick="VaultUI.changeView('settings-view')" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">⚙️</button>
            </div>
        </div>

        <div class="hero-card p-10 text-center">
            <h1 id="nw-display" class="text-5xl font-black tracking-tighter text-white maskable">₦0.00</h1>
            <div class="flex justify-center gap-6 mt-6 opacity-80">
                <div class="text-center"><p id="split-cash" class="text-xs font-bold maskable text-emerald-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Cash</p></div>
                <div class="text-center"><p id="split-as" class="text-xs font-bold maskable text-blue-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Assets</p></div>
                <div class="text-center"><p id="split-db" class="text-xs font-bold maskable text-yellow-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Debt</p></div>
            </div>
        </div>

        <div id="cards-container">
            <div id="feat-tactical" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-tactical')"><span class="text-xs font-bold uppercase">Liquidity</span><b id="tc-display" class="maskable text-sm text-emerald-500">₦0</b></div><div class="sub-drawer space-y-4"><div class="flex justify-between uppercase text-[10px]"><span>Bills</span><span id="b-total" class="maskable">₦0</span></div><div class="flex justify-between uppercase text-[10px]"><span>Savings</span><span id="s-total" class="maskable">₦0</span></div><div class="flex justify-between uppercase text-[10px]"><span>Spend</span><span id="l-total" class="maskable">₦0</span></div></div></div>
            <div id="feat-expenses" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-expenses')"><span class="text-xs font-bold uppercase text-red-500">Expenses</span><b id="ex-display" class="maskable text-sm text-red-400">₦0</b></div><div id="ex-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-assets" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-assets')"><span class="text-xs font-bold uppercase text-blue-500">Assets</span><b id="as-display" class="maskable text-sm text-blue-400">₦0</b></div><div id="as-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-debtors" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-debtors')"><span class="text-xs font-bold uppercase">Debtors</span><b id="db-display" class="maskable text-sm text-emerald-500">₦0</b></div><div id="db-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-creditors" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-creditors')"><span class="text-xs font-bold uppercase text-zinc-400">Creditors</span><b id="cr-display" class="maskable text-sm text-red-500">₦0</b></div><div id="cr-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-fiduciary" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-fiduciary')"><span class="text-xs font-bold uppercase text-yellow-600">Fiduciary</span><b id="fd-display" class="maskable text-sm text-yellow-500">₦0</b></div><div class="sub-drawer"><div class="seg-control"><div class="seg-btn" id="fd-v-goal" onclick="VaultCore.setFdView('goal')">GOAL</div><div class="seg-btn" id="fd-v-user" onclick="VaultCore.setFdView('user')">USER</div></div><div id="fd-pivot-list" class="space-y-4"></div></div></div>
            <div id="feat-history" class="vault-card opacity-50"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-history')"><span class="text-xs font-bold uppercase text-zinc-500">Audit Trail</span><span>▼</span></div><div class="sub-drawer"><input type="text" id="hi-search" class="input-ghost !text-xs mb-4" placeholder="Filter..." onkeyup="VaultUI.render()"><div id="hi-list" class="space-y-2 max-h-64 overflow-y-auto"></div></div></div>
        </div>
    </div>

    <div id="query-lab" class="view-hidden fixed inset-0 bg-black z-[2000] p-6 overflow-y-auto pt-20">
        <h2 class="text-xl font-black uppercase mb-6">Query Lab</h2>
        <input type="text" id="q-search" class="input-ghost" placeholder="Search..." onkeyup="VaultUI.runQuery()">
        <div class="flex gap-2 overflow-x-auto my-6" id="q-type-filters">
            <button class="q-pill active" onclick="VaultUI.toggleQPill(this, 'all')">ALL</button>
            <button class="q-pill" onclick="VaultUI.toggleQPill(this, 'income')">INFLOW</button>
            <button class="q-pill" onclick="VaultUI.toggleQPill(this, 'expense')">EXPENSE</button>
            <button class="q-pill" onclick="VaultUI.toggleQPill(this, 'fiduciary')">FIDUCIARY</button>
        </div>
        <div id="q-results" class="space-y-4 pb-32"></div>
    </div>

    <div id="settings-view" class="view-hidden space-y-8 p-4 pt-20">
        <div class="glass-panel p-6 space-y-6">
            <div class="flex justify-between items-center"><p class="text-xs font-bold uppercase">PIN Startup</p><label class="switch"><input type="checkbox" id="tog-pin" onchange="VaultCore.toggleSetting('reqPin')"><span class="slider"></span></label></div>
            <input id="set-pin" type="password" maxlength="4" class="input-ghost text-center tracking-[0.5em]" placeholder="••••" inputmode="numeric">
            <button onclick="VaultCore.savePin()" class="w-full bg-zinc-800 py-3 rounded-xl text-[10px] font-black uppercase">Update Security PIN</button>
        </div>
        <button onclick="VaultCore.export()" class="w-full glass-panel py-4 text-[10px] font-bold uppercase">Backup Data</button>
        <button onclick="document.getElementById('file-input').click()" class="w-full glass-panel py-4 text-[10px] font-bold uppercase text-emerald-400">Restore Data</button>
        <input type="file" id="file-input" class="hidden" onchange="VaultCore.import(this)">
        <button onclick="VaultCore.wipe()" class="w-full py-4 border border-red-900/50 text-red-700 rounded-xl text-[10px] font-black uppercase">Factory Reset</button>
    </div>

    <div id="entry-grid" class="view-hidden fixed inset-0 bg-black z-[1000] p-6 flex flex-col pt-24">
        <div class="grid grid-cols-2 gap-4">
            <button onclick="VaultUI.openForm('income')" class="bg-zinc-900 border border-emerald-900/30 rounded-2xl p-6 flex flex-col items-center gap-2">📥<span class="text-[10px] font-bold uppercase">Inflow</span></button>
            <button onclick="VaultUI.openForm('expense')" class="bg-zinc-900 border border-red-900/30 rounded-2xl p-6 flex flex-col items-center gap-2">📤<span class="text-[10px] font-bold uppercase">Expense</span></button>
            <button onclick="VaultUI.openForm('asset')" class="bg-zinc-900 border border-blue-900/30 rounded-2xl p-6 flex flex-col items-center gap-2">💎<span class="text-[10px] font-bold uppercase">Asset</span></button>
            <button onclick="VaultUI.openForm('creditor')" class="bg-zinc-900 border border-red-900/30 rounded-2xl p-6 flex flex-col items-center gap-2">🔴<span class="text-[10px] font-bold uppercase">Borrow</span></button>
            <button onclick="VaultUI.openForm('debtor')" class="bg-zinc-900 border border-emerald-900/30 rounded-2xl p-6 flex flex-col items-center gap-2">🟢<span class="text-[10px] font-bold uppercase">Lend</span></button>
            <button onclick="VaultUI.openForm('fiduciary')" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 flex flex-col items-center gap-2">💼<span class="text-[10px] font-bold uppercase">Fiduciary</span></button>
        </div>
    </div>

    <div id="entry-form" class="view-hidden fixed inset-0 bg-black z-[2000] p-6 pt-20">
        <input id="e-amount" type="number" class="amount-hero" placeholder="0">
        <div id="dynamic-inputs" class="space-y-4"></div>
        <input id="e-name" class="input-ghost" placeholder="Description">
        <button onclick="VaultCore.execute()" class="fixed bottom-10 left-6 right-6 glass-panel py-6 text-sm font-black text-white uppercase bg-zinc-900">Execute</button>
    </div>

    <button id="nav-fab" onclick="VaultUI.handleFab()" class="fab-btn fab-primary">+</button>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('SOV_DB_V73')) || [];
            let config = JSON.parse(localStorage.getItem('SOV_CFG_V73')) || { reqPin: false, activeQType: 'all', fdView: 'goal' };
            let pin = localStorage.getItem('SOV_PIN_V73') || "";
            const save = () => { localStorage.setItem('SOV_DB_V73', JSON.stringify(db)); localStorage.setItem('SOV_CFG_V73', JSON.stringify(config)); localStorage.setItem('SOV_PIN_V73', pin); };
            return {
                db: () => db, config: () => config, pin: () => pin,
                setFdView: v => { config.fdView = v; VaultUI.render(); },
                toggleSetting: k => { config[k] = !config[k]; save(); },
                savePin: () => { const p = document.getElementById('set-pin').value; if(p.length===4){ pin=p; save(); alert("PIN Saved"); } else alert("PIN must be 4 digits"); },
                execute: () => {
                    const a = parseFloat(document.getElementById('e-amount').value), desc = document.getElementById('e-name').value;
                    if(!desc || isNaN(a)) return;
                    let e = { id: Date.now(), name: desc, total: a, type: activeType, date: new Date().toISOString().split('T')[0] };
                    if(activeType === 'income') { e.b=a*0.4; e.s=a*0.4; e.l=a*0.2; }
                    else if(activeType === 'expense') { e.total=-a; }
                    else if(activeType === 'asset') { e.cat='Asset'; }
                    else if(activeType === 'creditor') { e.total=-a; e.creditor=desc; }
                    else if(activeType === 'debtor') { e.debtor=desc; }
                    else if(activeType === 'fiduciary') { e.goal=document.getElementById('e-fd-goal').value; e.user=document.getElementById('e-fd-user').value; }
                    db.push(e); save(); VaultUI.changeView('dashboard-view');
                },
                export: () => { const b = new Blob([JSON.stringify(db)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Vault_v73.json'; a.click(); },
                import: (input) => { const r = new FileReader(); r.onload = (e) => { db = JSON.parse(e.target.result); save(); location.reload(); }; r.readAsText(input.files[0]); },
                delete: id => { if(confirm("Remove?")){ db=db.filter(x=>x.id!==id); save(); VaultUI.render(); }},
                wipe: () => { if(confirm("RESET SYSTEM?")){ localStorage.clear(); location.reload(); }}
            };
        })();

        let activeType = 'income';
        const VaultUI = (() => {
            return {
                init: () => { 
                    const cfg = VaultCore.config();
                    document.getElementById('tog-pin').checked = cfg.reqPin;
                    if(VaultCore.pin() && cfg.reqPin) document.getElementById('auth-screen').classList.remove('view-hidden');
                    else VaultUI.render();
                },
                authenticate: () => { if(document.getElementById('auth-pin').value === VaultCore.pin()) { document.getElementById('auth-screen').classList.add('view-hidden'); VaultUI.render(); } else alert("Wrong PIN"); },
                toggleCard: id => document.getElementById(id).classList.toggle('drawer-open'),
                toggleStealth: () => document.body.classList.toggle('stealth-active'),
                changeView: id => {
                    ['dashboard-view', 'entry-grid', 'entry-form', 'settings-view', 'query-lab'].forEach(v => document.getElementById(v).classList.add('view-hidden'));
                    document.getElementById(id).classList.remove('view-hidden');
                    const f = document.getElementById('nav-fab');
                    f.innerText = id === 'dashboard-view' ? "+" : "↩";
                    f.onclick = () => VaultUI.changeView(id === 'dashboard-view' ? 'entry-grid' : 'dashboard-view');
                    VaultUI.render();
                },
                openForm: t => { activeType = t; VaultUI.changeView('entry-form'); VaultUI.updateFormUI(); },
                updateFormUI: () => {
                    const d = document.getElementById('dynamic-inputs'); d.innerHTML = '';
                    if(activeType==='fiduciary') d.innerHTML = '<input id="e-fd-goal" class="input-ghost" placeholder="Goal"><input id="e-fd-user" class="input-ghost" placeholder="Contributor">';
                },
                toggleQPill: (el, type) => {
                    document.querySelectorAll('.q-pill').forEach(p => p.classList.remove('active'));
                    el.classList.add('active'); VaultCore.config().activeQType = type; VaultUI.runQuery();
                },
                runQuery: () => {
                    const s = document.getElementById('q-search').value.toLowerCase(), type = VaultCore.config().activeQType, res = document.getElementById('q-results');
                    res.innerHTML = '';
                    VaultCore.db().filter(i => {
                        const tM = (i.name||"").toLowerCase().includes(s) || (i.debtor||"").toLowerCase().includes(s) || (i.goal||"").toLowerCase().includes(s);
                        const cM = type === 'all' || i.type === type; return tM && cM;
                    }).reverse().forEach(i => {
                        res.innerHTML += `<div class="glass-panel p-4 flex justify-between uppercase text-[10px]"><span>${i.date} | ${i.name}</span><b>₦${Math.abs(i.total).toLocaleString()}</b></div>`;
                    });
                },
                render: () => {
                    const db = VaultCore.db(); let nw=0, b=0, s=0, l=0, as=0, fd=0, ex=0, dbT=0, crT=0;
                    const piv = {}; const fView = VaultCore.config().fdView;
                    ['as-list','db-list','cr-list','fd-pivot-list','hi-list','ex-list'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerHTML = ''; });
                    
                    document.getElementById('fd-v-goal').className = `seg-btn ${fView==='goal'?'active emerald':''}`;
                    document.getElementById('fd-v-user').className = `seg-btn ${fView==='user'?'active emerald':''}`;

                    db.slice().reverse().forEach(i => {
                        if(i.type==='fiduciary') { 
                            fd+=i.total; const m = fView === 'goal' ? i.goal : i.user, sb = fView === 'goal' ? i.user : i.goal;
                            if(!piv[m]) piv[m] = { t: 0, subs: [] }; piv[m].t += i.total; piv[m].subs.push({ n: sb, a: i.total });
                        } else {
                            nw += i.total; b+=(i.b||0); s+=(i.s||0); l+=(i.l||0);
                            if(i.type==='expense') { ex += Math.abs(i.total); document.getElementById('ex-list').innerHTML+=`<div class="flex justify-between py-2 text-[10px] uppercase"><span>${i.name}</span><span>₦${Math.abs(i.total).toLocaleString()}</span></div>`; }
                            if(i.type==='asset') { as+=i.total; document.getElementById('as-list').innerHTML+=`<div class="flex justify-between py-2 text-[10px] uppercase"><span>${i.name}</span><span>₦${i.total.toLocaleString()}</span></div>`; }
                            if(i.type==='debtor') { dbT+=i.total; document.getElementById('db-list').innerHTML+=`<div class="flex justify-between py-2 text-[10px] uppercase"><span>${i.debtor}</span><span>₦${i.total.toLocaleString()}</span></div>`; }
                            if(i.type==='creditor') { crT+=Math.abs(i.total); document.getElementById('cr-list').innerHTML+=`<div class="flex justify-between py-2 text-[10px] uppercase text-red-500"><span>${i.creditor}</span><span>₦${Math.abs(i.total).toLocaleString()}</span></div>`; }
                        }
                        const hiS = document.getElementById('hi-search').value.toLowerCase();
                        if(!hiS || (i.name||"").toLowerCase().includes(hiS)) {
                            document.getElementById('hi-list').innerHTML += `<div class="flex justify-between py-3 border-b border-zinc-800 text-[10px] uppercase"><span>${i.name}</span><button onclick="VaultCore.delete(${i.id})">✕</button></div>`;
                        }
                    });
                    Object.keys(piv).forEach(k => { 
                        let r = piv[k].subs.map(sb => `<div class="flex justify-between py-1 opacity-60"><span>${sb.n}</span><span>₦${sb.a.toLocaleString()}</span></div>`).join('');
                        document.getElementById('fd-pivot-list').innerHTML += `<div class="bg-zinc-900/50 p-3 rounded-lg border border-white/5"><div class="flex justify-between font-black text-xs text-yellow-500 uppercase"><span>${k}</span><span>₦${piv[k].t.toLocaleString()}</span></div><div class="text-[9px] mt-2">${r}</div></div>`;
                    });
                    const set = (id, v) => { if(document.getElementById(id)) document.getElementById(id).innerText = "₦" + v.toLocaleString(); };
                    set('nw-display', nw); set('split-cash', (b+s+l)); set('split-as', as); set('split-db', dbT);
                    set('tc-display', (b+s+l)); set('b-total', b); set('s-total', s); set('l-total', l);
                    set('ex-display', ex); set('as-display', as); set('db-display', dbT); set('cr-display', crT); set('fd-display', fd);
                }
            };
        })();
        window.onload = VaultUI.init;
    </script>
</body>
</html>
