<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .menu-overlay { display: none; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6 pb-32">

    <header class="mb-10 flex justify-between items-start pt-4">
        <div>
            <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase">Global Command</p>
            <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
        </div>
        <button onclick="togglePrivacy()" class="p-3 vault-card text-[10px] tracking-widest uppercase">Stealth</button>
    </header>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="vault-card p-4">
            <p class="text-[#71717A] text-[9px] uppercase mb-1">Total Assets</p>
            <p id="total-assets" class="emerald-text font-bold text-lg">₦0</p>
        </div>
        <div class="vault-card p-4">
            <p class="text-[#71717A] text-[9px] uppercase mb-1">Total Debt</p>
            <p id="total-debt" class="oxblood-text font-bold text-lg">₦0</p>
        </div>
    </div>

    <div class="vault-card p-5 mb-8">
        <p class="text-[#71717A] text-[9px] uppercase mb-4 tracking-widest">Tactical Allocation (40/40/20)</p>
        <div class="space-y-3">
            <div class="flex justify-between text-xs">
                <span class="text-zinc-500">Bills (40%)</span>
                <span id="alloc-bills">₦0</span>
            </div>
            <div class="flex justify-between text-xs">
                <span class="text-zinc-500">Savings (40%)</span>
                <span id="alloc-savings">₦0</span>
            </div>
            <div class="flex justify-between text-xs">
                <span class="text-zinc-500">Lifestyle (20%)</span>
                <span id="alloc-life">₦0</span>
            </div>
        </div>
    </div>

    <details class="vault-card group mb-4">
        <summary class="p-5 flex justify-between items-center list-none cursor-pointer">
            <span class="text-[10px] uppercase tracking-widest font-bold">Asset Composition</span>
            <span class="text-zinc-600 group-open:rotate-180 transition-transform">▼</span>
        </summary>
        <div id="asset-list" class="px-5 pb-5 space-y-2 border-t border-zinc-800 pt-4">
            </div>
    </details>

    <details class="vault-card group">
        <summary class="p-5 flex justify-between items-center list-none cursor-pointer">
            <span class="text-[10px] uppercase tracking-widest font-bold">Debt Composition</span>
            <span class="text-zinc-600 group-open:rotate-180 transition-transform">▼</span>
        </summary>
        <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-800 pt-4">
            </div>
    </details>

    <button onclick="toggleMenu()" class="fixed bottom-8 right-8 w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-3xl shadow-2xl z-50 font-bold">+</button>

    <div id="menu-overlay" class="menu-overlay fixed inset-0 z-40 flex flex-col items-center justify-center p-8">
        <div class="w-full space-y-4">
            <button onclick="addEntry('asset')" class="w-full vault-card p-6 text-left">
                <p class="emerald-text font-bold uppercase text-xs">Add New Asset</p>
                <p class="text-[10px] text-zinc-500">Property, Cash, Investments</p>
            </button>
            <button onclick="addEntry('liability')" class="w-full vault-card p-6 text-left">
                <p class="oxblood-text font-bold uppercase text-xs">Add New Debt</p>
                <p class="text-[10px] text-zinc-500">Loans, Creditors, Obligations</p>
            </button>
            <button onclick="toggleMenu()" class="w-full p-6 text-zinc-500 text-xs uppercase tracking-widest">Close Menu</button>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];

        function updateDisplay() {
            let assetsSum = 0;
            let debtSum = 0;
            const assetList = document.getElementById('asset-list');
            const debtList = document.getElementById('debt-list');
            
            assetList.innerHTML = '';
            debtList.innerHTML = '';

            ledger.forEach((item, index) => {
                const isAsset = item.type === 'asset';
                if(isAsset) assetsSum += item.amount; else debtSum += item.amount;

                const targetList = isAsset ? assetList : debtList;
                targetList.innerHTML += `
                    <div class="flex justify-between text-[11px] py-1">
                        <span class="text-zinc-400">${item.name}</span>
                        <span class="${isAsset ? 'emerald-text' : 'oxblood-text'}">₦${item.amount.toLocaleString()}</span>
                    </div>
                `;
            });

            const netWorth = assetsSum - debtSum;
            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + netWorth.toLocaleString();
            document.getElementById('total-assets').innerText = "₦" + assetsSum.toLocaleString();
            document.getElementById('total-debt').innerText = "₦" + debtSum.toLocaleString();

            // 40/40/20 Calculation based on Total Assets
            document.getElementById('alloc-bills').innerText = "₦" + (assetsSum * 0.4).toLocaleString();
            document.getElementById('alloc-savings').innerText = "₦" + (assetsSum * 0.4).toLocaleString();
            document.getElementById('alloc-life').innerText = "₦" + (assetsSum * 0.2).toLocaleString();
        }

        function toggleMenu() {
            const menu = document.getElementById('menu-overlay');
            menu.style.display = menu.style.display === 'flex' ? 'none' : 'flex';
        }

        function addEntry(type) {
            const name = prompt("Name of " + type + ":");
            const amount = prompt("Amount (₦):");
            if (name && amount && !isNaN(amount)) {
                ledger.push({ name, amount: parseFloat(amount), type });
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
                updateDisplay();
                toggleMenu();
            }
        }

        function togglePrivacy() {
            stealth = !stealth;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
