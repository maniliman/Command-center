<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; margin-bottom: 16px; width: 100%; position: relative; }
        .emerald-border { border: 1px solid #00FF41; background: rgba(0, 255, 65, 0.03); }
        .fiduciary-border { border: 2px solid #EAB308; background: rgba(234, 179, 8, 0.03); }
        
        /* CLICK FIX: Independent State Management */
        .sub-drawer { display: none; padding: 20px; background: rgba(0,0,0,0.4); border-top: 1px solid #262629; }
        .drawer-open > .sub-drawer { display: block !important; }
        
        .fab-btn { position: fixed; bottom: 30px; width: 72px; height: 72px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; border: none; z-index: 9999; }
        .view-hidden { display: none !important; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 18px; border-radius: 12px; width: 100%; outline: none; }
        
        .chevron { transition: transform 0.3s; font-size: 10px; display: inline-block; pointer-events: none; }
        .drawer-open > div > .chevron { transform: rotate(180deg); }
        
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .stealth-active .maskable { filter: blur(15px); pointer-events: none; }
        
        .amort-table { width: 100%; font-size: 8px; text-transform: uppercase; margin-top: 10px; color: #888; border-collapse: collapse; }
        .amort-table th { text-align: left; padding-bottom: 5px; color: #555; }
        .amort-table td { padding: 4px 0; border-top: 1px solid #222; }
    </style>
</head>
<body id="main-body" class="p-6" style="padding-top: calc(var(--safe-top) + 20px);">

    <div id="dashboard-view" class="space-y-6">
        <div class="flex justify-between items-center mb-8 px-2">
            <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/40">Sovereign Command</p>
            <div class="flex gap-3">
                <button onclick="VaultUI.toggleStealth()" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-700 m-0">👁️</button>
                <button onclick="VaultUI.changeView('settings-view')" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-700 m-0">⚙️</button>
            </div>
        </div>

        <div class="text-center mb-10">
            <p class="text-[11px] uppercase text-zinc-500 font-bold mb-1">Total Sovereign Wealth</p>
            <h1 id="nw-display" class="text-5xl font-black tracking-tighter emerald-text maskable">₦0.00</h1>
            <div class="text-[8px] uppercase font-bold text-zinc-600 mt-3 flex justify-center gap-3">
                <span>Cash: <b id="split-cash" class="text-zinc-400">₦0</b></span>
                <span>Assets: <b id="split-as" class="text-zinc-400">₦0</b></span>
                <span>Debtors: <b id="split-db" class="text-zinc-400">₦0</b></span>
            </div>
        </div>

        <div id="feat-tactical" class="vault-card emerald-border">
            <div class="p-6" onclick="VaultUI.toggleCard(this.parentElement)">
                <div class="flex justify-between items-center">
                    <span class="text-[11px] font-black uppercase text-emerald-500">Tactical Liquidity</span>
                    <span id="tc-display" class="text-xl font-black maskable">₦0 <span class="chevron ml-2">▼</span></span>
                </div>
            </div>
            <div class="sub-drawer space-y-4 text-xs font-bold uppercase">
                <div id="bills-node" class="border-b border-zinc-800 pb-2">
                    <div class="flex justify-between items-center opacity-80 py-2" onclick="event.stopPropagation(); VaultUI.toggleCard(this.parentElement)">
                        <span>Bills Account <span class="chevron ml-1">▼</span></span>
                        <span id="b-total" class="maskable">₦0</span>
                    </div>
                    <div class="sub-drawer space-y-3 text-[10px] text-zinc-400 normal-case">
                        <div class="flex justify-between"><span>Core (40%)</span><span id="b-core" class="text-white maskable">₦0</span></div>
                        <div class="flex justify-between"><span>Reserve (40%)</span><span id="b-reserve" class="text-white maskable">₦0</span></div>
                        <div class="flex justify-between"><span>Ops (20%)</span><span id="b-ops" class="text-white maskable">₦0</span></div>
                    </div>
                </div>
                <div class="flex justify-between py-2"><span>Savings Account</span><span id="s-total" class="maskable">₦0</span></div>
                <div class="flex justify-between border-t border-zinc-800 pt-3 pb-2"><span>Spend Account</span><span id="l-total" class="maskable">₦0</span></div>
            </div>
        </div>

        <div id="cards-container">
            <div class="vault-card" onclick="VaultUI.toggleCard(this)"><div class="p-6"><div class="flex justify-between items-center text-[11px] font-black uppercase text-zinc-500"><span>Assets</span><span id="as-display" class="maskable">₦0</span></div><div id="as-list" class="sub-drawer space-y-2 pt-4"></div></div></div>
            <div class="vault-card" onclick="VaultUI.toggleCard(this)"><div class="p-6"><div class="flex justify-between items-center text-[11px] font-black uppercase text-emerald-400"><span>Debtors</span><span id="db-display" class="maskable">₦0</span></div><div id="db-list" class="sub-drawer space-y-4 pt-4"></div></div></div>
            <div class="vault-card border-orange-900/40" onclick="VaultUI.toggleCard(this)"><div class="p-6"><div class="flex justify-between items-center text-[11px] font-black uppercase text-orange-500"><span>Liabilities</span><span id="li-display" class="maskable">₦0</span></div><div id="li-list" class="sub-drawer space-y-3 pt-4"></div></div></div>
            <div class="vault-card fiduciary-border" onclick="VaultUI.toggleCard(this)"><div class="p-6"><div class="flex justify-between items-center text-[11px] font-black uppercase text-yellow-500"><span>Fiduciary Custody</span><span id="fd-display" class="maskable">₦0</span></div><div id="fd-list" class="sub-drawer space-y-3 pt-4"></div></div></div>
        </div>
    </div>

    <div id="entry-view" class="view-hidden space-y-6 pb-40">
        <h2 class="text-4xl font-black uppercase tracking-tighter">Authorize</h2>
        <select id="e-type" class="input-dark" onchange="VaultUI.updateForm()">
            <option value="income">Inflow [+]</option>
            <option value="asset">Asset [+]</option>
            <option value="debtor">Debtor [+]</option>
            <option value="liability">Liability [-]</option>
            <option value="fiduciary">Fiduciary [💼]</option>
        </select>
        <div id="loan-fields" class="hidden space-y-4">
            <input id="e-rate" type="number" class="input-dark" placeholder="Annual Rate %">
            <input id="e-terms" type="number" class="input-dark" placeholder="Terms (Months)">
        </div>
        <input id="e-datetime" type="datetime-local" class="input-dark">
        <input id="e-name" class="input-dark" placeholder="Description">
        <input id="e-amount" type="number" class="input-dark" placeholder="Amount (₦)">
        <button onclick="VaultCore.execute()" class="w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase">Execute</button>
    </div>

    <div id="settings-view" class="view-hidden space-y-10">
        <h2 class="text-4xl font-black uppercase tracking-tighter">Registry</h2>
        <button onclick="VaultCore.exportData()" class="w-full bg-emerald-500 p-4 rounded text-black font-black uppercase text-xs">Backup JSON</button>
        <button onclick="VaultCore.wipe()" class="w-full p-6 text-red-900 border border-red-900 rounded font-black uppercase text-xs">Purge Records</button>
    </div>

    <button id="f-add" onclick="VaultUI.changeView('entry-view')" class="fab-btn bg-emerald-500 text-black right-8">+</button>
    <button id="f-back" onclick="VaultUI.changeView('dashboard-view')" class="fab-btn bg-zinc-800 text-white left-8 view-hidden">✕</button>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('SOVEREIGN_VAULT_FINAL')) || [];
            const save = () => localStorage.setItem('SOVEREIGN_VAULT_FINAL', JSON.stringify(db));
            return {
                db: () => db,
                execute: () => {
                    const t = document.getElementById('e-type').value, n = document.getElementById('e-name').value, 
                          a = parseFloat(document.getElementById('e-amount').value), dt = document.getElementById('e-datetime').value,
                          r = parseFloat(document.getElementById('e-rate').value) || 0, m = parseInt(document.getElementById('e-terms').value) || 1;
                    if (!n || isNaN(a)) return;
                    let entry = { id: Date.now(), name: n, total: a, type: t, rawDate: dt, rate: r, terms: m };
                    if (t === 'income') { entry.b = a * 0.4; entry.s = a * 0.4; entry.l = a * 0.2; }
                    else if (t === 'liability') entry.total = -a;
                    db.push(entry); save(); VaultUI.changeView('dashboard-view');
                },
                exportData: () => {
                    const blob = new Blob([JSON.stringify(db)], {type: 'application/json'});
                    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Sovereign_Backup.json`; a.click();
                },
                wipe: () => { if(confirm("Purge?")) { localStorage.clear(); location.reload(); } }
            };
        })();

        const VaultUI = (() => {
            let stealth = false;
            return {
                toggleCard: el => { event.stopPropagation(); el.classList.toggle('drawer-open'); },
                toggleStealth: () => { stealth = !stealth; document.body.classList.toggle('stealth-active', stealth); },
                changeView: id => {
                    ['dashboard-view', 'entry-view', 'settings-view'].forEach(v => document.getElementById(v).classList.add('view-hidden'));
                    document.getElementById(id).classList.remove('view-hidden');
                    document.getElementById('f-add').classList.toggle('view-hidden', id !== 'dashboard-view');
                    document.getElementById('f-back').classList.toggle('view-hidden', id === 'dashboard-view');
                },
                updateForm: () => {
                    const t = document.getElementById('e-type').value;
                    document.getElementById('loan-fields').style.display = (t === 'debtor' || t === 'liability') ? 'block' : 'none';
                },
                render: () => {
                    const db = VaultCore.db();
                    let nw=0, b=0, s=0, l=0, as=0, fd=0, dbT=0, li=0;
                    ['as-list', 'fd-list', 'db-list', 'li-list', 'au-list'].forEach(id => document.getElementById(id).innerHTML = '');
                    
                    db.slice().reverse().forEach(i => {
                        if(i.type === 'fiduciary') fd += i.total;
                        else {
                            nw += i.total; b += (i.b||0); s += (i.s||0); l += (i.l||0);
                            if(i.type === 'asset') as += i.total;
                            if(i.type === 'debtor') {
                                dbT += i.total;
                                document.getElementById('db-list').innerHTML += VaultUI.genLoanItem(i);
                            }
                            if(i.type === 'liability') {
                                li += Math.abs(i.total);
                                document.getElementById('li-list').innerHTML += VaultUI.genLoanItem(i);
                            }
                        }
                    });
                    document.getElementById('nw-display').innerText = "₦" + nw.toLocaleString();
                    document.getElementById('tc-display').innerHTML = `₦${(b+s+l).toLocaleString()} <span class="chevron ml-2">▼</span>`;
                    document.getElementById('split-cash').innerText = "₦" + (b+s+l).toLocaleString();
                    document.getElementById('split-as').innerText = "₦" + as.toLocaleString();
                    document.getElementById('split-db').innerText = "₦" + dbT.toLocaleString();
                    document.getElementById('b-total').innerText = "₦" + b.toLocaleString();
                    document.getElementById('b-core').innerText = "₦" + (b * 0.4).toLocaleString();
                    document.getElementById('b-reserve').innerText = "₦" + (b * 0.4).toLocaleString();
                    document.getElementById('b-ops').innerText = "₦" + (b * 0.2).toLocaleString();
                },
                genLoanItem: (i) => {
                    const rate = (i.rate / 100) / 12;
                    const p = Math.abs(i.total) * rate / (1 - Math.pow(1 + rate, -i.terms));
                    let rows = '', bal = Math.abs(i.total);
                    for(let j=1; j<=Math.min(i.terms, 6); j++) {
                        let int = bal * rate; let prin = p - int; bal -= prin;
                        rows += `<tr><td>M${j}</td><td>₦${p.toFixed(0)}</td><td>₦${bal.toFixed(0)}</td></tr>`;
                    }
                    return `<div class="border-b border-zinc-800 pb-4 mb-4">
                        <div class="flex justify-between font-bold"><span>${i.name}</span><span>₦${Math.abs(i.total).toLocaleString()}</span></div>
                        <table class="amort-table"><thead><tr><th>Month</th><th>Payment</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>
                    </div>`;
                }
            };
        })();
        VaultUI.render();
    </script>
</body>
</html>
