<script>
    const VaultUI = (() => {
        return {
            // ... (keep open, stealth, unlock, view functions as they are)
            
            form: () => {
                const t = document.getElementById('e-type').value;
                const c = document.getElementById('dynamic-inputs');
                c.innerHTML = '';
                
                if(t === 'income') {
                    c.innerHTML = `
                        <div class="flex items-center gap-3 p-4 border border-zinc-800 rounded">
                            <input type="checkbox" id="e-settle" onchange="VaultUI.form()">
                            <span class="text-[10px] font-bold uppercase">Debt Repayment?</span>
                        </div>
                        ${document.getElementById('e-settle')?.checked ? 
                        '<input id="e-target" class="input-dark mt-2" placeholder="Debtor Name (e.g. Alhaji Musa)">' : ''}`;
                }
                
                if(t === 'expense') {
                    c.innerHTML = `
                        <select id="e-src" class="input-dark mb-4">
                            <option value="bills">Bills</option>
                            <option value="save">Savings</option>
                            <option value="spend">Spend</option>
                        </select>
                        <div class="flex items-center gap-3 p-4 border border-zinc-800 rounded">
                            <input type="checkbox" id="e-settle" onchange="VaultUI.form()">
                            <span class="text-[10px] font-bold uppercase">Credit Settlement?</span>
                        </div>
                        ${document.getElementById('e-settle')?.checked ? 
                        '<input id="e-target" class="input-dark mt-2" placeholder="Creditor Name">' : ''}`;
                }
                
                if(t === 'fiduciary') {
                    c.innerHTML = '<input id="e-goal" class="input-dark" placeholder="Project"><input id="e-user" class="input-dark mt-4" placeholder="Contributor">';
                }

                // Auto-hide the Description box if it's a settlement to keep the screen short
                const descBox = document.getElementById('e-name');
                if(document.getElementById('e-settle')?.checked) {
                    descBox.classList.add('view-hidden');
                    descBox.value = "Settlement"; // Placeholder to prevent empty error
                } else {
                    descBox.classList.remove('view-hidden');
                    descBox.value = "";
                }
            },

            exec: async () => {
                const t = document.getElementById('e-type').value;
                const a = parseFloat(document.getElementById('e-amount').value);
                const isSettle = document.getElementById('e-settle')?.checked;
                const target = document.getElementById('e-target')?.value;
                
                // Use the Target Name as the Description if it's a settlement
                const n = isSettle ? `Payment from ${target}` : document.getElementById('e-name').value;
                
                if (!n || isNaN(a)) return;
                
                let e = { name: n, total: a, type: t, date: document.getElementById('e-datetime').value };
                
                if (isSettle) {
                    if (t === 'income') {
                        e.type = 'debt_repayment';
                        e.debtor = target;
                    } else {
                        e.type = 'credit_settlement';
                        e.creditor = target;
                    }
                }
                // ... (rest of the insertion logic remains the same)
            }
        };
    })();
</script>
