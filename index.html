<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .progress-bg { background: #262629; height: 6px; border-radius: 3px; overflow: hidden; }
        .progress-fill { background: #00FF41; height: 100%; transition: width 0.4s ease; }
    </style>
</head>
<body class="p-6">
    <header class="mb-6 flex justify-between items-start pt-4">
        <div>
            <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase">Global Net Worth</p>
            <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0</h1>
        </div>
        <button onclick="togglePrivacy()" class="p-3 vault-card text-[10px] tracking-widest uppercase text-[#71717A]">Stealth</button>
    </header>

    <div id="goal-container" class="space-y-4 mb-10">
        <p class="text-[10px] uppercase text-[#71717A] mb-2 tracking-widest">Active Envelopes</p>
    </div>
    <button onclick="createNewGoal()" class="w-full border border-dashed border-[#262629] p-3 rounded-xl text-[10px] uppercase text-[#71717A] mb-10">+ Create New Envelope</button>

    <div class="grid grid-cols-2 gap-4 mb-10">
        <button onclick="addEntry()" class="vault-card p-5 text-center border-emerald-900/20">
            <p class="text-[10px] font-bold uppercase emerald-text mb-1">Deposit</p>
            <span class="text-xl">💰</span>
        </button>
        <button onclick="spendMoney()" class="vault-card p-5 text-center border-red-900/20">
            <p class="text-[10px] font-bold uppercase oxblood-text mb-1">Spend</p>
            <span class="text-xl">💸</span>
        </button>
    </div>

    <div class="vault-card p-5">
        <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase mb-4">Tactical Ledger</p>
        <div id="ledger-list" class="space-y-3"></div>
    </div>

    <script>
        let stealth = false;
        let history = JSON.parse(localStorage.getItem('vh_history')) || [];
        let goals = JSON.parse(localStorage.getItem('vh_goals')) || [
            { id: 'gen', name: 'General Savings', target: 0, balance: 0 }
        ];

        function updateDisplay() {
            let totalCash = 0;
            goals.forEach(g => g.balance = 0);

            history.forEach(item => {
                const amount = parseFloat(item.amount);
                const g = goals.find(goal => goal.id === item.goalId) || goals[0];
                
                if (item.type === 'IN') {
                    totalCash += amount;
                    g.balance += amount;
                } else if (item.type === 'OUT') {
                    totalCash -= amount;
                    g.balance -= amount;
                }
            });

            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + totalCash.toLocaleString();
            
            const container = document.getElementById('goal-container');
            container.innerHTML = goals.map(g => {
                const percent = g.target > 0 ? Math.min((g.balance / g.target) * 100, 100) : 0;
                return `
                    <div class="vault-card p-4">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-[10px] font-bold uppercase">${g.name}</span>
                            <span class="text-[10px] emerald-text font-bold">${Math.floor(percent)}%</span>
                        </div>
                        <div class="progress-bg mb-2">
                            <div class="progress-fill" style="width: ${percent}%"></div>
                        </div>
                        <div class="flex justify-between text-[8px] text-[#71717A]">
                            <span>₦${g.balance.toLocaleString()} saved</span>
                            <span>Target: ₦${g.target.toLocaleString()}</span>
                        </div>
                    </div>
                `;
            }).join('');

            const list = document.getElementById('ledger-list');
            list.innerHTML = history.slice().reverse().map((item, idx) => {
                const realIdx = history.length - 1 - idx;
                const g = goals.find(goal => goal.id === item.goalId) || {name: 'General'};
                return `
                    <div class="flex justify-between items-center border-b border-[#262629] pb-2">
                        <div class="flex flex-col">
                            <span class="text-[8px] uppercase text-[#71717A] font-mono">${item.date} | ${item.time}</span>
                            <span class="text-[7px] uppercase text-[#4B5563] mb-1">${g.name}</span>
                            <span class="text-[10px] ${item.type === 'IN' ? 'emerald-text' : 'oxblood-text'} font-bold">
                                ${item.type === 'IN' ? '+' : '-'} ₦${parseFloat(item.amount).toLocaleString()}
                            </span>
                        </div>
                        <button onclick="deleteEntry(${realIdx})" class="text-[#71717A] text-[12px] px-2">×</button>
                    </div>
                `;
            }).join('');
        }

        function createNewGoal() {
            const name = prompt("Envelope Name:");
            const target = prompt("Target Amount (₦):");
            if (name && target) {
                const id = 'g' + Date.now();
                goals.push({ id, name, target: parseFloat(target), balance: 0 });
                localStorage.setItem('vh_goals', JSON.stringify(goals));
                updateDisplay();
            }
        }

        function addEntry() {
            const amount = prompt("Amount to Deposit (₦):");
            if (!amount || isNaN(amount)) return;
            
            let options = goals.map((g, i) => `${i}: ${g.name}`).join('\n');
            const choice = prompt("Choose Envelope Index:\n" + options, "0");
            const goal = goals[choice] || goals[0];
            saveTx('IN', amount, goal.id);
        }

        function spendMoney() {
            const amount = prompt("Amount Spent (₦):");
            if (!amount || isNaN(amount)) return;

            let options = goals.map((g, i) => `${i}: ${g.name}`).join('\n');
            const choice = prompt("Spend from which Envelope?:\n" + options, "0");
            const goal = goals[choice] || goals[0];
            saveTx('OUT', amount, goal.id);
        }

        function saveTx(type, amount, goalId) {
            const now = new Date();
            const date = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' });
            const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
            history.push({ type, amount: parseFloat(amount), goalId, date, time });
            localStorage.setItem('vh_history', JSON.stringify(history));
            updateDisplay();
        }

        function deleteEntry(idx) {
            if (confirm("Permanently delete this transaction?")) {
                history.splice(idx, 1);
                localStorage.setItem('vh_history', JSON.stringify(history));
                updateDisplay();
            }
        }

        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        updateDisplay();
    </script>
</body>
</html>
