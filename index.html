<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <link rel="icon" href="https://img.icons8.com/nolan/64/safe.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 30px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; overflow-x: hidden; }
        
        /* FIXED: Lowered Header and Layout */
        .action-layer { 
            padding-top: calc(var(--safe-top) + 40px); 
            padding-bottom: 30px;
            background: #0A0A0B;
            position: sticky; top: 0; z-index: 1000;
        }

        .fab-button { 
            position: fixed !important; bottom: 40px !important; right: 30px !important; 
            z-index: 9999 !important; display: flex !important; 
            width: 64px; height: 64px; background: #00FF41; color: black;
            border-radius: 50%; justify-content: center; align-items: center;
            font-size: 32px; font-weight: bold; border: none; cursor: pointer;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.4);
        }

        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 10px; width: 100%; outline: none; appearance: none; }
        
        .overlay { 
            display: none; position: fixed; inset: 0; z-index: 10000 !important; 
            background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); 
            padding: 24px; padding-top: calc(var(--safe-top) + 60px); overflow-y: auto;
        }
        .overlay-open { display: flex !important; flex-direction: column; }

        summary { cursor: pointer; list-style: none; outline: none; }
        summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="pb-40">

    <div class="action-layer px-6 flex justify-between items-center">
        <div>
            <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/50">Sovereign Command</p>
            <h1 id="networth" class="text-3xl font-bold mt-1 tracking-tighter">₦0.00</h1>
        </div>
        <div class="flex gap-2">
            <button onclick="toggleOverlay('intel-overlay')" class="p-3 vault-card text-[14px] border border-zinc-800">📊</button>
            <button id="stealth-trigger" onclick="togglePrivacy()" class="p-3 vault-card text-[10px] uppercase border border-zinc-800 font-bold">Stealth</button>
        </div>
    </div>

    <div id="dashboard-content" class="px-6 space-y-6 mt-6">
        <div class="vault-card p-6 border border-emerald-900/20 shadow-xl shadow-emerald-500/5">
            <div class="flex justify-between items-center mb-6">
                <p class="text-[10px] uppercase tracking-widest font-black text-zinc-500">Liquid Engine</p>
                <span id="total-cash" class="text-sm emerald-text font-mono font-bold">₦0</span>
            </div>
            <div class="space-y-4">
                <div class="flex justify-between text-xs font-bold uppercase"><span class="text-zinc-500">Bills Account</span><span id="alloc-bills">₦0</span></div>
                <div class="flex justify-between text-xs font-bold uppercase"><span class="text-zinc-500">Savings Account</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between text-xs font-bold uppercase"><span class="text-zinc-500">Spend Account</span><span id="alloc-life">₦0</span></div>
            </div>
        </div>

        <details class="vault-card group border border-emerald-900/10" open>
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black tracking-widest">Fixed Wealth</span><span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span></summary>
            <div id="multi-tier-assets" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>

        <details class="vault-card group border border-red-900/20" open>
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black tracking-widest oxblood-text">Outflow Ledger</span><span id="inv-expenses-total" class="text-sm font-bold oxblood-text">₦0</span></summary>
            <div id="multi-tier-expenses" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4 text-zinc-400"></div>
        </details>

        <details class="vault-card group border border-yellow-900/10">
            <summary class="p-5 flex justify-between items-center"><span class="text-[10px] uppercase font-black tracking-widest text-yellow-500">Fiduciary</span><span id="f-total-header" class="text-sm font-bold text-yellow-500">₦0</span></summary>
            <div id="fiduciary-main-list" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>
    </div>

    <button onclick="toggleOverlay('entry-overlay')" class="fab-button">+</button>

    <div id="entry-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-8 pb-32">
            <div class="flex justify-between items-center">
                <h2 class="text-2xl font-bold uppercase tracking-tighter">Authorize</h2>
                <button onclick="toggleOverlay('entry-overlay')" class="text-zinc-600 font-bold uppercase text-[10px]">Cancel</button>
            </div>
            
            <div class="space-y-6">
                <div class="space-y-2">
                    <label class="text-[9px] uppercase font-black text-zinc-500">Transaction Category</label>
                    <select id="form-category" class="input-dark" onchange="handleCatChange()">
                        <option value="Income">Liquid Cash [+]</option>
                        <option value="FixedAsset">Fixed Asset [+]</option>
                        <option value="Expense">Expense [-]</option>
                        <option value="Transfer">Internal Transfer [⇄]</option>
                        <option value="Fiduciary">Fiduciary [💼]</option>
                    </select>
                </div>

                <div class="space-y-2">
                    <label class="text-[9px] uppercase font-black text-zinc-500">Date & Reference</label>
                    <input id="form-date" type="date" class="input-dark mb-3">
                    <input id="form-name" class="input-dark" placeholder="Description/Contributor Name">
                </div>

                <div class="space-y-2">
                    <label class="text-[9px] uppercase font-black text-zinc-500">Amount (₦)</label>
                    <input id="form-amount" type="number" class="input-dark" placeholder="0.00">
                </div>
                
                <div id="asset-type-fields" class="hidden space-y-2">
                    <label class="text-[9px] uppercase font-black text-zinc-500">Asset Classification</label>
                    <select id="asset-type" class="input-dark">
                        <option value="Stocks">Stocks / Equities</option>
                        <option value="Property">Real Estate / Property</option>
                        <option value="Vehicles">Automobiles</option>
                        <option value="Crypto">Digital Assets</option>
                    </select>
                </div>

                <div id="expense-fields" class="hidden space-y-4">
                    <select id="expense-tier" class="input-dark">
                        <option value="Logistics">Logistics / Travel</option>
                        <option value="Staffing">Staffing / HR</option>
                        <option value="Utilities">Utilities / Living</option>
                        <option value="Business">Business Ops</option>
                    </select>
                    <select id="form-source" class="input-dark">
                        <option value="lifestyle">Deduct From: Spend</option>
                        <option value="bills">Deduct From: Bills</option>
                        <option value="savings">Deduct From: Savings</option>
                    </select>
                </div>

                <div id="transfer-fields" class="hidden space-y-4">
                    <select id="trans-source" class="input-dark"><option value="bills">Source: Bills</option><option value="savings">Source: Savings</option><option value="lifestyle">Source: Spend</option></select>
                    <select id="trans-dest" class="input-dark"><option value="savings">Target: Savings</option><option value="lifestyle">Target: Spend</option><option value="bills">Target: Bills</option></select>
                </div>
            </div>

            <button onclick="submitEntry()" class="w-full bg-emerald-500 p-5 rounded-2xl text-black font-black uppercase tracking-widest text-xs">Execute Transaction</button>
        </div>
    </div>

    <div id="intel-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-6">
            <h2 class="text-xl font-bold uppercase tracking-tighter">Intelligence</h2>
            <input id="intel-search" oninput="runQuery()" class="input-dark" placeholder="Search Query...">
            <div id="intel-results" class="space-y-2"></div>
            <button onclick="toggleOverlay('intel-overlay')" class="w-full text-zinc-600 uppercase text-[10px] font-bold py-10">Back</button>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger
