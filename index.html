<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Command Center</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; text-shadow: 0 0 8px rgba(0, 255, 65, 0.2); }
        .oxblood-text { color: #FF3131; text-shadow: 0 0 8px rgba(255, 49, 49, 0.2); }
        .fade-in { animation: fadeIn 0.4s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-6 pb-24">
    <header class="mb-8 flex justify-between items-start pt-4">
        <div>
            <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase">True Net Worth</p>
            <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter italic">₦0.00</h1>
        </div>
        <button onclick="togglePrivacy()" class="p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800">Stealth</button>
    </header>

    <div class="flex gap-4 mb-8">
        <button onclick="addEntry('asset')" class="flex-1 vault-card p-4 text-center border-b-2 border-emerald-900/50">
            <p class="text-[9px] uppercase text-[#71717A] mb-1">Add Asset</p>
            <p class="emerald-text font-bold text-xl">+</p>
        </button>
        <button onclick="addEntry('liability')" class="flex-1 vault-card p-4 text-center border-b-2 border-red-900/50">
            <p class="text-[9px] uppercase text-[#71717A] mb-1">Add Loan</p>
            <p class="oxblood-text font-bold text-xl">-</p>
        </button>
    </div>

    <div id="ledger-feed" class="space-y-4">
        </div>

    <div class="fixed bottom-6 left-6 right-6">
        <button onclick="resetVault()" class="w-full p-3 text-[9px] uppercase tracking-[0.2em] text-zinc-600">Reset All Data</button>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];

        function updateDisplay() {
            const feed = document.getElementById('ledger-feed');
            feed.innerHTML = '';
            let total = 0;

            if (ledger.length === 0) {
                feed.innerHTML = '<p class="text-center text-zinc-600 text-xs mt-10">No records found. Initialize vault.</p>';
            }

            ledger.forEach((item, index) => {
                const isAsset = item.type === 'asset';
                total += isAsset ? item.amount : -item.amount;

                feed.innerHTML += `
                    <div class="vault-card p-5 flex justify-between items-center fade-in border-l-4 ${isAsset ? 'border-emerald-500' : 'border-red-500'}">
                        <div class="flex flex-col">
                            <p class="text-[10px] text-[#71717A] uppercase mb-1">${item.type}</p>
                            <p class="text-sm font-bold">${item.name}</p>
                        </div>
                        <div class="text-right">
                            <p class="${isAsset ? 'emerald-text' : 'oxblood-text'} font-bold">
                                ${isAsset ? '+' : '-'} ₦${stealth ? '••••' : item.amount.toLocaleString()}
                            </p>
                            <button onclick="deleteItem(${index})" class="text-[9px] text-zinc-700 mt-2 uppercase">Delete</button>
                        </div>
                    </div>
                `;
            });

            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + total.toLocaleString();
        }

        function addEntry(type) {
            const name = prompt(`Entry Name (e.g., ${type === 'asset' ? 'Real Estate' : 'Bank Loan'}):`);
            const amount = prompt("Amount (₦):");
            if (name && amount && !isNaN(amount)) {
                ledger.push({ name, amount: parseFloat(amount), type });
                saveAndRefresh();
            }
        }

        function deleteItem(index) {
            if(confirm("Delete this record?")) {
                ledger.splice(index, 1);
                saveAndRefresh();
            }
        }

        function resetVault() {
            if(confirm("DANGER: This will wipe all saved assets and loans. Proceed?")) {
                ledger = [];
                saveAndRefresh();
            }
        }

        function saveAndRefresh() {
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay();
        }

        function togglePrivacy() {
            stealth = !stealth;
            updateDisplay();
        }

        // Initialize PWA Service Worker
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => console.log(err));
        }

        updateDisplay();
    </script>
</body>
</html>
