<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; margin-bottom: 16px; width: 100%; position: relative; }
        .emerald-border { border: 1px solid #00FF41; background: rgba(0, 255, 65, 0.03); }
        .fiduciary-border { border: 2px solid #EAB308; background: rgba(234, 179, 8, 0.03); }
        .sub-drawer { display: none; padding: 20px; background: rgba(0,0,0,0.6); border-top: 1px solid #262629; }
        .drawer-open > .sub-drawer { display: block !important; }
        .trigger-btn { color: #00FF41; font-size: 18px; padding: 10px; cursor: pointer; display: inline-block; transition: 0.2s; }
        .drawer-open > div > .trigger-btn { transform: rotate(180deg); color: white; }
        .stealth-active .maskable { filter: blur(28px); opacity: 0.3; pointer-events: none; }
        .fab-btn { position: fixed; bottom: 25px; width: 56px; height: 56px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 999; border: none; }
        .view-hidden { display: none !important; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 18px; border-radius: 12px; width: 100%; outline: none; }
        #auth-gate { position: fixed; inset: 0; background: #0A0A0B; z-index: 10000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px; }
        .t-btn { flex: 1; padding: 8px; font-size: 10px; font-weight: 900; background: #262629; border-radius: 8px; color: #666; text-align: center; cursor: pointer; }
        .t-btn.active { background: #EAB308; color: black; }
        .pivot-card { background: rgba(234, 179, 8, 0.05); border: 1px solid rgba(234, 179, 8, 0.2); padding: 12px; border-radius: 8px; margin-bottom: 8px; }
    </style>
</head>
<body id="main-body" class="p-6" style="padding-top: calc(var(--safe-top) + 20px);">

    <div id="auth-gate" class="view-hidden">
        <p class="text-[10px] tracking-[0.5em] uppercase font-black text-emerald-500 mb-8">Authorization</p>
        <input id="gate-pin" type="password" class="input-dark text-center text-3xl" placeholder="****">
        <button onclick="VaultUI.unlock()" class="mt-8 w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase">Unlock Vault</button>
    </div>

    <div id="dashboard-view" class="space-y-6">
        <div class="flex justify-between items-center mb-8">
            <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/40">Sovereign Command</p>
            <div class="flex gap-3">
                <button onclick="VaultUI.stealth()" class="w-12 h-12 vault-card flex items-center justify-center m-0">👁️</button>
                <button onclick="VaultUI.view('settings-view')" class="w-12 h-12 vault-card flex items-center justify-center m-0">⚙️</button>
            </div>
        </div>

        <div class="text-center mb-10">
            <h1 id="nw-display" class="text-5xl font-black tracking-tighter text-[#00FF41] maskable">₦0.00</h1>
            <div class="text-[8px] uppercase font-bold text-zinc-600 mt-4 flex justify-center gap-4">
                <span>Cash: <b id="split-cash" class="maskable text-zinc-400">₦0</b></span>
                <span>Assets: <b id="split-as" class="maskable text-zinc-400">₦0</b></span>
                <span>Debt: <b id="split-db" class="maskable text-zinc-400">₦0</b></span>
            </div>
        </div>

        <div id="cards-container">
            <div id="card-tactical" class="vault-card emerald-border"><div class="p-6 flex justify-between"><span>Liquidity</span><div class="flex items-center gap-4"><b id="tc-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.open('card-tactical')">▼</span></div></div><div class="sub-drawer space-y-4 text-xs font-bold uppercase"><div class="flex justify-between py-2 border-b border-zinc-900"><span>Bills</span><span id="b-total" class="maskable">₦0</span></div><div class="flex justify-between py-2 border-b border-zinc-900"><span>Savings</span><span id="s-total" class="maskable">₦0</span></div><div class="flex justify-between py-2"><span>Spend</span><span id="l-total" class="maskable">₦0</span></div></div></div>
            <div id="card-assets" class="vault-card"><div class="p-6 flex justify-between"><span>Assets</span><div class="flex items-center gap-4"><b id="as-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.open('card-assets')">▼</span></div></div><div id="as-list" class="sub-drawer"></div></div>
            <div id="card-debtors" class="vault-card"><div class="p-6 flex justify-between"><span>Debtors</span><div class="flex items-center gap-4"><b id="db-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.open('card-debtors')">▼</span></div></div><div id="db-list" class="sub-drawer space-y-2"></div></div>
            <div id="card-creditors" class="vault-card border-red-900/40"><div class="p-6 flex justify-between"><span>Creditors</span><div class="flex items-center gap-4"><b id="cr-display" class="maskable text-red-500">₦0</b><span class="trigger-btn" onclick="VaultUI.open('card-creditors')">▼</span></div></div><div id="cr-list" class="sub-drawer space-y-2"></div></div>
            <div id="card-fiduciary" class="vault-card fiduciary-border"><div class="p-6 flex justify-between text-yellow-500 font-black"><span>Fiduciary</span><div class="flex items-center gap-4"><b id="fd-display" class="maskable">₦0</b><span class="trigger-btn" onclick="VaultUI.open('card-fiduciary')">▼</span></div></div><div class="sub-drawer"><div class="flex gap-2 mb-4"><div id="v-goal" class="t-btn active" onclick="VaultCore.setFd('goal')">GOAL</div><div id="v-user" class="t-btn" onclick="VaultCore.setFd('user')">USER</div></div><input type="text" id="fd-search" class="input-dark !p-3 !text-xs mb-4" placeholder="Search..." onkeyup="VaultUI.render()"><div id="fd-pivot" class="space-y-4"></div></div></div>
            <div id="card-history" class="vault-card opacity-50"><div class="p-6 flex justify-between"><span>Audit Trail</span><span class="trigger-btn" onclick="VaultUI.open('card-history')">▼</span></div><div id="hi-list" class="sub-drawer space-y-2 max-h-64 overflow-y-auto"></div></div>
        </div>
    </div>

    <div id="entry-view" class="view-hidden space-y-6 pb-40">
        <h2 class="text-3xl font-black">AUTHORIZE</h2>
        <select id="e-type" class="input-dark" onchange="VaultUI.form()"><option value="income">Inflow [+]</option><option value="fiduciary">Fiduciary [💼]</option><option value="asset">Asset [+]</option><option value="debtor">Debtor [+]</option><option value="creditor">Creditor [-]</option><option value="expense">Expense [-]</option></select>
        <div id="dynamic-inputs" class="space-y-4"></div>
        <input id="e-datetime" type="datetime-local" class="input-dark">
        <input id="e-name" class="input-dark" placeholder="Description">
        <input id="e-amount" type="number" class="input-dark" placeholder="Amount ₦">
        <button onclick="VaultCore.exec()" class="w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase">Execute</button>
    </div>

    <div id="settings-view" class="view-hidden space-y-10">
        <h2 class="text-3xl font-black uppercase">Registry</h2>
        <div class="vault-card p-6 space-y-4">
            <input id="new-pin" type="password" maxlength="4" class="input-dark" placeholder="New PIN">
            <button onclick="VaultCore.setPin()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-black text-[10px] uppercase">Lock PIN</button>
        </div>
        <button onclick="VaultCore.export()" class="w-full p-4 bg-zinc-800 rounded-xl font-bold uppercase text-xs mb-4">Backup Data (JSON)</button>
        <button onclick="VaultCore.wipe()" class="w-full p-4 border border-red-900 text-red-900 rounded-xl font-bold uppercase text-xs">Purge All Data</button>
    </div>

    <button id="f-add" onclick="VaultUI.view('entry-view')" class="fab-btn bg-emerald-500 text-black right-8">+</button>
    <button id="f-back" onclick="VaultUI.view('dashboard-view')" class="fab-btn bg-zinc-800 text-white left-8 view-hidden">✕</button>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('SOV_LOCAL_V1')) || [];
            let pin = localStorage.getItem('SOV_PIN') || "";
            let mode = 'goal';

            const save = () => localStorage.setItem('SOV_LOCAL_V1', JSON.stringify(db));

            return {
                db: () => db, pin: () => pin, mode: () => mode,
                setFd: (m) => { mode = m; VaultUI.render(); },
                setPin: () => { const p = document.getElementById('new-pin').value; if(p.length===4){ pin = p; localStorage.setItem('SOV_PIN', p); alert("Security Locked"); }},
                exec: () => {
                    const t = document.getElementById('e-type').value, a = parseFloat(document.getElementById('e-amount').value), dt = document.getElementById('e-datetime').value;
                    const isSettle = document.getElementById('e-settle')?.checked;
                    const target = document.getElementById('e-target')?.value;
