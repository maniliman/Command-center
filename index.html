<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <link rel="icon" href="https://img.icons8.com/nolan/64/safe.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; font-size: 14px; }
        
        #dashboard-content { position: relative; z-index: 10; padding: 24px; }
        .stealth-btn { position: relative; z-index: 1000 !important; cursor: pointer; }
        .stealth-active { background: #00FF41 !important; color: #000 !important; box-shadow: 0 0 15px rgba(0, 255, 65, 0.5); }
        .fab-button { 
            position: fixed; bottom: 32px; right: 32px; 
            z-index: 5000 !important; pointer-events: auto !important;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); 
        }

        .overlay { 
            display: none; position: fixed; inset: 0; z-index: 9000 !important; 
            background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); 
            padding: 24px; padding-top: 60px; overflow-y: auto;
        }
        .overlay-open { display: flex !important; flex-direction: column; }
        
        summary { cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        .balance-chip { background: #0A0A0B; border: 1px solid #262629; border-radius: 8px; padding: 8px; font-size: 10px; text-align: center; }
    </style>
</head>

            </div>
