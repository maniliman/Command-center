<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 60px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; }
        
        .page-layer { position: relative; padding-top: var(--safe-top); padding-bottom: 150px; }
        
        .overlay { 
            position: fixed; inset: 0; z-index: -1; opacity: 0;
            background: rgba(10, 10, 11, 0.98); backdrop-filter: blur(30px); 
            padding: 24px; padding-top: calc(var(--safe-top) + 20px);
            transition: opacity 0.3s ease; overflow-y: auto;
        }
        .overlay-open { z-index: 5000; opacity: 1; }

        .fab-container { position: fixed; bottom: 40px; left: 0; right: 0; padding: 0 30px; display: flex; justify-content: space-between; z-index: 6000; pointer-events: none; }
        .fab-btn { width: 70px; height: 70px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; border: none; pointer-events: auto; cursor: pointer; }
        .fab-add { background: #00FF41; color: black; box-shadow: 0 0 30px rgba(0, 255, 65, 0.3); }
        .fab-back { background: #161618; color: #EDEDED; border: 1px solid #262629; display: none; }

        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; margin-bottom: 16px; transition: all 0.2s; }
        .card-header { padding: 24px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .card-content { display: none; padding: 0 24px 24px 24px; border-top: 1px solid #262629; padding-top: 16px; }
        .content-open { display: block; }
        
        .rect-border-emerald { border: 1px solid #00FF41; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 18px; border-radius: 12px; width: 100%; outline: none; }
    </style>
</head>
<body>

    <div class="page-layer">
        <div class="px-8 text-center mb-10">
            <div class="flex justify-between items-center mb-10">
                <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/40">Sovereign Command</p>
                <div class="flex gap-4">
                    <button onclick="toggleOverlay('intel-overlay')" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-800 m-0">📊</button>
                    <button onclick="toggleOverlay('settings-overlay')" class="w-12 h-12 vault-card flex items-center justify-center border-zinc-800 m-0">⚙️</button>
                </div>
            </div>
            <p class="text-[11px] uppercase text-zinc-500 font-bold mb-1">Total Net Worth</p>
            <h1 id="networth" class="text-6xl font-black tracking-tighter emerald-text">₦0.00</h1>
        </div>

        <div class="px-6">
            <div class="vault-card rect-border-emerald">
                <div class="card-header" onclick="toggleCard('split-content')">
                    <span class="text-[11px] font-black uppercase text-emerald-500">Tactical Split</span>
                    <span id="total-cash" class="text-xl font-black emerald-text">₦0</span>
                </div>
                <div id="split-content" class="card-content">
                    <div class="space-y-4 font-bold uppercase text-xs">
                        <div class="flex justify-between border-b border-zinc-900 pb-2"><span>Bills (40%)</span><span id="alloc-bills">₦0</span></div>
                        <div class="flex justify-between border-b border-zinc-900 pb-2"><span>Savings (40%)</span><span id="alloc-savings">₦0</span></div>
                        <div class="flex justify-between"><span>Spend (20%)</span><span id="alloc-life">₦0</span></div>
                    </div>
                </div>
            </div>

            <div class="vault-card">
                <div class="card-header" onclick="toggleCard('asset-content')">
                    <span class="text-[11px] font-black uppercase text-zinc-500">Wealth Inventory</span>
                    <span id="inv-assets-total" class="text-xl font-black emerald-text">₦0</span>
                </div>
                <div id="asset-content" class="card-content space-y-3"></div>
            </div>

            <div class="vault-card border-red-900/20">
                <div class="card-header" onclick="toggleCard('expense-content')">
                    <span class="text-[11px] font-black uppercase oxblood-text">Expenses</span>
                    <span id="inv-expenses-total" class="text-xl font-black oxblood-text">₦0</span>
                </div>
                <div id="expense-content" class="card-content space-y-3"></div>
            </div>

            <div class="vault-card">
                <div class="card-header" onclick="toggleCard('fiduciary-content')">
                    <span class="text-[11px] font-black uppercase text-yellow-500">Fiduciary Ledger</span>
                    <span id="f-total-header" class="text-xl font-black text-yellow-500">₦0</span>
                </div>
                <div id="fiduciary-content" class="card-content space-y-3"></div>
            </div>

            <div class="vault-card opacity-30">
                <div class="card-header" onclick="toggleCard('audit-content')">
                    <span class="text-[10px] font-black uppercase">Master Audit Trail</span>
                    <span>▼</span>
                </div>
                <div id="audit-content" class="card-content text-[10px] space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
        </div>
    </div>

    <div class="fab-container">
        <button id="fab-back" onclick="closeAll()" class="fab-btn fab-back">✕</button>
        <button id="fab-add" onclick="toggleOverlay('entry-overlay')" class="fab-btn fab-add">+</button>
    </div>

    <div id="entry-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-8 pb-32">
            <h2 class="text-4xl font-black uppercase tracking-tighter">Authorize</h2>
            
            <select id="form-category" class="input-dark" onchange="handleCatChange()">
                <option value="Income">Liquid Cash [+]</option>
                <option value="FixedAsset">Fixed Asset [+]</option>
                <option value="Expense">Expense [-]</option>
                <option value="BulkFid">Bulk Fiduciary [📊]</option>
            </select>

            <div id="split-strategy-fields" class="space-y-4">
                <label class="text-[10px] font-bold text-zinc-500 uppercase">Split Strategy</label>
                <select id="split-strategy" class="input-dark">
                    <option value="standard">Standard (40/40/20 Split)</option>
                    <option value="bills">100% to Bills</option>
                    <option value="savings">100% to Savings</option>
                    <option value="lifestyle">100% to Spend</option>
                </select>
            </div>

            <div id="bulk-fid-fields" class="hidden space-y-4">
                <textarea id="bulk-input" class="input-dark h-40" placeholder="Name, Amount"></textarea>
            </div>

            <div id="standard-fields" class="space-y-4">
                <input id="form-date" type="date" class="input-dark">
                <input id="form-name" class="input-dark" placeholder="Description">
                <input id="form-amount" type="number" class="input-dark" placeholder="0.00">
            </div>

            <button onclick="submitEntry()" class="w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase tracking-tighter">Execute</button>
        </div>
    </div>

    <div id="intel-overlay" class="overlay"></div>
    <div id="settings-overlay" class="overlay">
        <div class="w-full max-w-sm mx-auto space-y-10">
            <h2 class="text-3xl font-black uppercase tracking-tighter">Registry</h2>
            <button onclick="securePurge()" class="w-full p-5 text-red-900 border border-red-900 rounded font-black uppercase text-xs">Wipe All Data (Clear Phantom Data)</button>
        </div>
    </div>

    <script>
        // FORCED CLEANUP: Ensures no phantom data on load
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];
        let liq = { bills: 0, savings: 0, lifestyle: 0 };

        document.getElementById('form-date').valueAsDate = new Date();

        function updateDisplay() {
            let aSum = 0, eSum = 0, fSum = 0;
            liq = { bills: 0, savings: 0, lifestyle: 0 };
            const exL = document.getElementById('expense-content'), asL = document.getElementById('asset-content'), fL = document.getElementById('fiduciary-content'), auditL = document.getElementById('audit-content');
            exL.innerHTML = ''; asL.innerHTML = ''; fL.innerHTML = ''; auditL.innerHTML = '';
            
            const expGroups = {}, assetGroups = {};

            ledger.forEach(item => {
                const val = parseFloat(item.amount) || 0;
                liq.bills += (item.bills || 0); liq.savings += (item.savings || 0); liq.lifestyle += (item.lifestyle || 0);
                if (val < 0) {
                    const t = item.tier || 'Other'; expGroups[t] = (expGroups[t] || 0) + Math.abs(val); eSum += Math.abs(val);
                } else {
                    const t = item.type || 'Liquid Cash'; assetGroups[t] = (assetGroups[t] || 0) + val; aSum += val;
                }
                auditL.innerHTML += `<div class="flex justify-between border-b border-zinc-900 py-1"><span>${item.date} ${item.name}</span><span>₦${Math.abs(val).toLocaleString()}</span></div>`;
            });

            for (const t in expGroups) exL.innerHTML += `<div class="flex justify-between text-xs font-bold uppercase"><span>${t}</span><span class="oxblood-text">₦${expGroups[t].toLocaleString()}</span></div>`;
            for (const t in assetGroups) asL.innerHTML += `<div class="flex justify-between text-xs font-bold uppercase"><span>${t}</span><span class="emerald-text">₦${assetGroups[t].toLocaleString()}</span></div>`;

            fLedger.forEach(item => {
                fSum += parseFloat(item.amount) || 0;
                fL.innerHTML += `<div class="flex justify-between text-xs font-bold uppercase"><span>${item.name}</span><span class="text-yellow-500">₦${parseFloat(item.amount).toLocaleString()}</span></div>`;
            });

            document.getElementById('alloc-bills').innerText = "₦" + liq.bills.toLocaleString();
            document.getElementById('alloc-savings').innerText = "₦" + liq.savings.toLocaleString();
            document.getElementById('alloc-life').innerText = "₦" + liq.lifestyle.toLocaleString();
            document.getElementById('total-cash').innerText = "₦" + (liq.bills + liq.savings + liq.lifestyle).toLocaleString();
            document.getElementById('inv-expenses-total').innerText = "₦" + eSum.toLocaleString();
            document.getElementById('inv-assets-total').innerText = "₦" + aSum.toLocaleString();
            document.getElementById('f-total-header').innerText = "₦" + fSum.toLocaleString();
            document.getElementById('networth').innerText = "₦" + (aSum - eSum).toLocaleString();
        }

        function toggleCard(id) { document.getElementById(id).classList.toggle('content-open'); }
        function toggleOverlay(id) { 
            document.getElementById(id).classList.add('overlay-open'); 
            document.getElementById('fab-back').style.display = 'flex';
            document.getElementById('fab-add').style.display = 'none';
        }
        function closeAll() { document.querySelectorAll('.overlay').forEach(o => o.classList.remove('overlay-open')); document.getElementById('fab-back').style.display = 'none'; document.getElementById('fab-add').style.display = 'flex'; }

        function handleCatChange() {
            const cat = document.getElementById('form-category').value;
            document.getElementById('split-strategy-fields').classList.toggle('hidden', cat !== 'Income');
            document.getElementById('bulk-fid-fields').classList.toggle('hidden', cat !== 'BulkFid');
        }

        function submitEntry() {
            const cat = document.getElementById('form-category').value, name = document.getElementById('form-name').value, amount = parseFloat(document.getElementById('form-amount').value);
            const d = new Date().toLocaleDateString();

            if (cat === 'Income') {
                const strategy = document.getElementById('split-strategy').value;
                let entry = { name, amount, date: d, type: 'Liquid Cash' };
                if (strategy === 'standard') { entry.bills = amount * 0.4; entry.savings = amount * 0.4; entry.lifestyle = amount * 0.2; }
                else { entry[strategy] = amount; }
                ledger.push(entry);
            } else if (cat === 'Expense') {
                ledger.push({ name, amount: -amount, bills: -amount, date: d, tier: 'General' });
            } else if (cat === 'BulkFid') {
                document.getElementById('bulk-input').value.split('\n').forEach(line => {
                    const [n, a] = line.split(',');
                    if (n && a) fLedger.push({ name: n.trim(), amount: parseFloat(a), date: d });
                });
            }

            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            localStorage.setItem('fiduciary_ledger', JSON.stringify(fLedger));
            updateDisplay(); closeAll();
        }

        function securePurge() { localStorage.clear(); location.reload(); }
        updateDisplay();
    </script>
</body>
</html>
