<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 8px; width: 100%; outline: none; font-size: 13px; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 999 !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }
        #menu-overlay { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); padding: 24px; padding-top: 60px; overflow-y: auto; }
        .menu-open { display: flex !important; flex-direction: column; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content" class="p-6">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800">Stealth</button>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <details class="vault-card group col-span-2">
                <summary class="p-5 flex justify-between items-center list-none cursor-pointer">
                    <span class="text-[10px] uppercase tracking-widest font-black">Assets/Debtors</span>
                    <span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span>
                </summary>
                <div id="asset-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
            </details>
            <details class="vault-card group col-span-2">
                <summary class="p-5 flex justify-between items-center list-none cursor-pointer">
                    <span class="text-[10px] uppercase tracking-widest font-black">Debt/Creditors</span>
                    <span id="inv-debt-total" class="text-sm font-bold oxblood-text">₦0</span>
                </summary>
                <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
            </details>
        </div>

        <p class="text-[#71717A] text-[9px] uppercase tracking-[0.3em] font-bold mb-4">Master Ledger (Reducing Balances)</p>
        <div id="master-history" class="space-y-4"></div>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-3xl font-bold">+</button>

    <div id="menu-overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto pb-20">
            <h2 class="text-xl font-bold uppercase tracking-tighter">New Entry</h2>
            <div class="space-y-4">
                <input id="form-name" class="input-dark" placeholder="Entity Name (e.g. Bank, Person X)">
                <input id="form-amount" type="number" class="input-dark" placeholder="Principal Amount (₦)">
                <select id="form-type" class="input-dark" onchange="toggleDebtFields()">
                    <option value="Asset">Fixed Asset</option>
                    <option value="Cash">Liquid Cash</option>
                    <option value="Liability">Creditor (I Owe)</option>
                    <option value="Debtor">Debtor (Owed to Me)</option>
                </select>

                <div id="debt-fields" class="hidden space-y-4 pt-4 border-t border-zinc-800">
                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-[9px] text-zinc-500 uppercase font-bold">Interest %</label><input id="form-interest" type="number" class="input-dark" value="0"></div>
                        <div><label class="text-[9px] text-zinc-500 uppercase font-bold">Tenure (Months)</label><input id="form-period" type="number" class="input-dark" value="1"></div>
                    </div>
                    <div>
                        <label class="text-[9px] text-zinc-500 uppercase font-bold">Due Date (Calendar Pick)</label>
                        <input id="form-due" type="date" class="input-dark">
                    </div>
                </div>
            </div>
            
            <div class="pt-6 space-y-3">
                <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Commit Entry</button>
                <button onclick="toggleMenu()" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Back</button>
            </div>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];

        function updateDisplay() {
            let assetsSum = 0, debtSum = 0;
            const assetList = document.getElementById('asset-list'), debtList = document.getElementById('debt-list'), masterHistory = document.getElementById('master-history');
            assetList.innerHTML = ''; debtList.innerHTML = ''; masterHistory.innerHTML = '';

            ledger.slice().reverse().forEach((item, originalIndex) => {
                const idx = ledger.length - 1 - originalIndex;
                const interestAmt = (item.amount * (item.interest || 0) / 100);
                const totalDue = item.amount + interestAmt;
                const paid = item.paid || 0;
                const forgiven = item.forgiven || 0;
                const balance = totalDue - paid - forgiven;

                const isAsset = (item.type === 'Asset' || item.type === 'Cash' || item.type === 'Debtor');
                if(isAsset) assetsSum += balance; else debtSum += balance;

                const color = item.type === 'Debtor' ? 'text-blue-400' : (isAsset ? 'emerald-text' : 'oxblood-text');
                
                // Inventory Item
                const listHTML = `<div class="flex justify-between py-1 border-b border-zinc-900 last:border-0"><span>${item.name}</span><span class="${color}">₦${stealth ? '••••' : balance.toLocaleString()}</span></div>`;
                if(isAsset) assetList.innerHTML += listHTML; else debtList.innerHTML += listHTML;

                // Master Ledger Item
                masterHistory.innerHTML += `
                    <div class="vault-card p-4 border-l-4 ${isAsset ? 'border-emerald-500' : 'border-red-500'}">
                        <div class="flex justify-between items-start text-[8px] text-zinc-600 font-bold uppercase mb-2">
                            <span>${item.timestamp}</span>
                            <div class="flex gap-2">
                                <button onclick="processPayment(${idx})" class="border border-zinc-800 px-2 py-1 rounded text-zinc-400 hover:text-white">Service</button>
                                <button onclick="deleteItem(${idx})" class="text-zinc-800 hover:text-red-500 px-1 text-xs">×</button>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-xs font-black uppercase tracking-tight">${item.name}</p>
                                ${item.dueDate ? `<p class="text-[8px] text-zinc-500 mt-1 uppercase">Period: ${item.period || 1}M | Due: ${item.dueDate} | Int: ${item.interest}%</p>` : ''}
                            </div>
                            <div class="text-right">
                                <p class="text-[10px] text-zinc-600 font-bold uppercase">${item.type}</p>
                                <p class="${color} font-mono text-sm font-bold">₦${stealth ? '••••' : balance.toLocaleString()}</p>
                            </div>
                        </div>
                        ${paid > 0 || forgiven > 0 ? `<p class="text-[7px] text-zinc-700 mt-2 uppercase">Paid: ₦${paid.toLocaleString()} | Forgiven: ₦${forgiven.toLocaleString()}</p>` : ''}
                    </div>`;
            });

            document.getElementById('networth').innerText = stealth ? "••••••••" : "₦" + (assetsSum - debtSum).toLocaleString();
            document.getElementById('inv-assets-total').innerText = stealth ? "••••" : "₦" + assetsSum.toLocaleString();
            document.getElementById('inv-debt-total').innerText = stealth ? "••••" : "₦" + debtSum.toLocaleString();
        }

        function toggleDebtFields() {
            const type = document.getElementById('form-type').value;
            document.getElementById('debt-fields').classList.toggle('hidden', type !== 'Debtor' && type !== 'Liability');
        }

        function processPayment(index) {
            const pay = parseFloat(prompt("Enter Payment Amount (₦):", "0")) || 0;
            const forgive = parseFloat(prompt("Enter Forgiveness Amount (₦):", "0")) || 0;
            ledger[index].paid = (ledger[index].paid || 0) + pay;
            ledger[index].forgiven = (ledger[index].forgiven || 0) + forgive;
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay();
        }

        function submitEntry() {
            const name = document.getElementById('form-name').value, amount = parseFloat(document.getElementById('form-amount').value), type = document.getElementById('form-type').value;
            if (!name || isNaN(amount)) return;
            const timestamp = new Date().toLocaleDateString();
            ledger.push({
                name, amount, type, timestamp,
                interest: parseFloat(document.getElementById('form-interest').value) || 0,
                period: document.getElementById('form-period').value,
                dueDate: document.getElementById('form-due').value,
                paid: 0, forgiven: 0
            });
            localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            updateDisplay(); toggleMenu();
        }

        function deleteItem(index) { if(confirm("Purge record?")) { ledger.splice(index, 1); localStorage.setItem('vault_ledger', JSON.stringify(ledger)); updateDisplay(); } }
        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }
        updateDisplay();
    </script>
</body>
</html>
