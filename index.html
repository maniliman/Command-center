<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; font-size: 14px; }
        
        #dashboard-content { position: relative; z-index: 1; padding: 24px; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 500 !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }
        #menu-overlay { display: none; position: fixed; inset: 0; z-index: 1000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); padding: 24px; padding-top: 60px; overflow-y: auto; }
        .menu-open { display: flex !important; flex-direction: column; align-items: center; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800">Stealth</button>
        </header>

        <div class="mb-12">
            <div class="flex justify-between items-center mb-6">
                <p class="text-gold-text text-[10px] tracking-[0.3em] uppercase font-bold">Fiduciary Ledger (External Funds)</p>
                <span id="external-total" class="text-xs font-bold gold-text">Total: ₦0</span>
            </div>
            
            <div id="contributor-view" class="space-y-4">
                </div>
        </div>

        <details class="vault-card group mb-4">
            <summary class="p-5 flex justify-between items-center list-none cursor-pointer text-[10px] uppercase tracking-widest font-black">Personal Inventory <span id="inv-assets-total" class="emerald-text ml-auto mr-2">₦0</span></summary>
            <div id="asset-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
        </details>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-3xl font-bold active:scale-90">+</button>

    <div id="menu-overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto pb-20">
            <h2 class="text-xl font-bold uppercase tracking-tighter">New Entry</h2>
            <div class="space-y-4">
                <select id="entry-mode" class="input-dark" onchange="toggleFormFields()">
                    <option value="Personal">Personal Entry (My Wealth)</option>
                    <option value="External">Fiduciary Contribution (Other People)</option>
                </select>

                <input id="form-name" class="input-dark" placeholder="Name / Description">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                
                <div id="personal-fields" class="space-y-4">
                    <select id="form-type" class="input-dark">
                        <option value="Asset">Asset</option>
                        <option value="Liability">Liability</option>
                    </select>
                </div>
            </div>

            <div class="pt-6 space-y-3">
                <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Authorize Entry</button>
                <button onclick="toggleMenu()" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Back</button>
            </div>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let externalLedger = JSON.parse(localStorage.getItem('external_ledger')) || [];

        function updateDisplay() {
            // Update Personal Side
            let assets = 0, debt = 0;
            const assetList = document.getElementById('asset-list');
            assetList.innerHTML = '';
            
            ledger.forEach((item, idx) => {
                if(item.type === 'Asset') assets += item.amount; else debt += item.amount;
                assetList.innerHTML += `<div class="flex justify-between py-1"><span>${item.name}</span><span>₦${stealth ? '••' : item.amount.toLocaleString()}</span></div>`;
            });
            document.getElementById('networth').innerText = "₦" + (assets - debt).toLocaleString();
            document.getElementById('inv-assets-total').innerText = "₦" + assets.toLocaleString();

            // Update Fiduciary Side
            const contributorDiv = document.getElementById('contributor-view');
            contributorDiv.innerHTML = '';
            let globalExternalTotal = 0;

            const groups = externalLedger.reduce((acc, item) => {
                if (!acc[item.name]) acc[item.name] = { total: 0, entries: [] };
                acc[item.name].total += item.amount;
                acc[item.name].entries.push(item);
                globalExternalTotal += item.amount;
                return acc;
            }, {});

            document.getElementById('external-total').innerText = "Total: ₦" + globalExternalTotal.toLocaleString();

            for (const name in groups) {
                const card = document.createElement('details');
                card.className = "vault-card group";
                card.innerHTML = `
                    <summary class="p-5 flex justify-between items-center list-none cursor-pointer">
                        <span class="text-xs font-bold uppercase">${name}</span>
                        <span class="gold-text font-mono font-bold text-xs">₦${stealth ? '••' : groups[name].total.toLocaleString()}</span>
                    </summary>
                    <div class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4">
                        ${groups[name].entries.map((e, i) => `
                            <div class="flex justify-between items-end border-b border-zinc-900 pb-2 last:border-0">
                                <div>
                                    <p class="text-[8px] text-zinc-600 font-bold">${e.timestamp}</p>
                                    <p class="text-[10px] uppercase text-zinc-400">Contribution</p>
                                </div>
                                <span class="text-[11px] font-mono">₦${stealth ? '••' : e.amount.toLocaleString()}</span>
                            </div>
                        `).join('')}
                    </div>
                `;
                contributorDiv.appendChild(card);
            }
        }

        function toggleFormFields() {
            const mode = document.getElementById('entry-mode').value;
            document.getElementById('personal-fields').classList.toggle('hidden', mode === 'External');
        }

        function submitEntry() {
            const mode = document.getElementById('entry-mode').value;
            const name = document.getElementById('form-name').value;
            const amount = parseFloat(document.getElementById('form-amount').value);
            const timestamp = new Date().toLocaleDateString() + ' @ ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            if (!name || isNaN(amount)) return;

            if (mode === 'Personal') {
                const type = document.getElementById('form-type').value;
                ledger.push({ name, amount, type, timestamp });
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            } else {
                externalLedger.push({ name, amount, timestamp });
                localStorage.setItem('external_ledger', JSON.stringify(externalLedger));
            }
            updateDisplay(); toggleMenu();
        }

        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }
        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        function resetVault() { if(confirm("Wipe all data?")) { ledger = []; externalLedger = []; localStorage.clear(); updateDisplay(); } }
        updateDisplay();
    </script>
</body>
</html>
