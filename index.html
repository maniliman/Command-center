<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Vault v75</title>
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/shield.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22Vault%22,%22short_name%22:%22Vault%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22#000000%22,%22theme_color%22:%22#10B981%22}">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #000; color: #E5E5E5; font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; overflow-x: hidden; -webkit-tap-highlight-color: transparent; }
        .glass-panel { background: rgba(20, 20, 20, 0.9); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .hero-card { background: linear-gradient(145deg, #111 0%, #050505 100%); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 28px; position: relative; }
        .vault-card { background: #111; border: 1px solid #222; border-radius: 18px; margin-bottom: 12px; width: 100%; overflow: hidden; }
        .sub-drawer { display: none; padding: 20px; background: #080808; border-top: 1px solid #222; }
        .drawer-open > .sub-drawer { display: block !important; }
        .input-ghost { background: transparent; border: none; color: white; font-size: 16px; width: 100%; outline: none; padding: 12px 0; border-bottom: 1px solid #333; border-radius: 0; }
        .amount-hero { font-size: 48px; font-weight: 900; text-align: center; color: #fff; width: 100%; outline: none; padding: 20px 0; letter-spacing: -2px; background: transparent; border: none; }
        .fluid-bar { display: flex; border-radius: 12px; overflow: hidden; margin: 20px 0; border: 1px solid #333; }
        .fluid-seg { padding: 12px 0; text-align: center; font-size: 10px; font-weight: 800; background: #111; border-right: 1px solid #222; }
        .fluid-input { background: transparent; width: 100%; text-align: center; color: #10B981; outline: none; font-size: 14px; font-weight: 900; }
        .fab-btn { position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; z-index: 9999; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .fab-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: black; }
        .fab-back { background: #333; color: white; }
        .seg-control { display: flex; background: #000; padding: 4px; border-radius: 14px; border: 1px solid #222; margin-bottom: 20px; }
        .seg-btn { flex: 1; text-align: center; padding: 10px; font-size: 10px; font-weight: 800; color: #555; border-radius: 10px; }
        .seg-btn.active.emerald { background: #064E3B; color: #10B981; }
        .seg-btn.active.yellow { background: #78350f; color: #fcd34d; }
        .view-hidden { display: none !important; }
        .stealth-active .maskable { filter: blur(20px); opacity: 0.3; }
        .q-pill { padding: 8px 16px; border-radius: 20px; border: 1px solid #333; font-size: 10px; font-weight: 800; color: #666; transition: 0.2s; white-space: nowrap; }
        .q-pill.active { border-color: #10B981; color: #10B981; background: rgba(16,185,129,0.1); }
    </style>
</head>
<body id="main-body" class="p-4" style="padding-top: calc(var(--safe-top) + 10px);">

    <div id="auth-screen" class="fixed inset-0 z-[10000] bg-black flex flex-col items-center justify-center p-8 view-hidden">
        <div class="w-16 h-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center mb-8 text-2xl">🔒</div>
        <input id="auth-pin" type="password" class="bg-transparent border-b border-zinc-800 text-center text-4xl tracking-[0.5em] w-2/3 outline-none text-white focus:border-emerald-500" placeholder="••••" maxlength="4" inputmode="numeric">
        <button onclick="VaultUI.authenticate()" class="mt-12 w-full glass-panel py-5 text-xs font-black uppercase text-white active:bg-zinc-800">Unlock</button>
    </div>

    <div id="dashboard-view" class="space-y-6 pb-32">
        <div class="flex justify-between items-center px-2">
            <span class="text-[10px] font-black tracking-widest text-zinc-600 uppercase">Sovereign v75</span>
            <div class="flex gap-2">
                <button onclick="VaultUI.changeView('query-lab')" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">🔍</button>
                <button onclick="VaultUI.toggleStealth()" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">👁️</button>
                <button onclick="VaultUI.changeView('settings-view')" class="w-10 h-10 rounded-full bg-zinc-900 border border-zinc-800 flex items-center justify-center text-zinc-400">⚙️</button>
            </div>
        </div>

        <div class="hero-card p-10 text-center">
            <h1 id="nw-display" class="text-5xl font-black tracking-tighter text-white maskable">₦0.00</h1>
            <div class="flex justify-center gap-6 mt-6 opacity-80">
                <div class="text-center"><p id="split-cash" class="text-xs font-bold maskable text-emerald-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Cash</p></div>
                <div class="text-center"><p id="split-as" class="text-xs font-bold maskable text-blue-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Assets</p></div>
                <div class="text-center"><p id="split-db" class="text-xs font-bold maskable text-yellow-400">₦0</p><p class="text-[9px] font-bold text-zinc-600 uppercase">Debt</p></div>
            </div>
        </div>

        <div id="cards-container">
            <div id="feat-tactical" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-tactical')"><span class="text-xs font-bold uppercase">Liquidity</span><b id="tc-display" class="maskable text-sm text-emerald-500">₦0</b></div><div class="sub-drawer space-y-4"><div class="flex justify-between uppercase text-[10px]"><span>Bills</span><span id="b-total" class="maskable">₦0</span></div><div class="flex justify-between uppercase text-[10px]"><span>Savings</span><span id="s-total" class="maskable">₦0</span></div><div class="flex justify-between uppercase text-[10px]"><span>Spend</span><span id="l-total" class="maskable">₦0</span></div></div></div>
            <div id="feat-expenses" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-expenses')"><span class="text-xs font-bold uppercase text-red-500">Expenses</span><b id="ex-display" class="maskable text-sm text-red-400">₦0</b></div><div id="ex-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-debtors" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-debtors')"><span class="text-xs font-bold uppercase">Debtors</span><b id="db-display" class="maskable text-sm text-emerald-500">₦0</b></div><div id="db-list" class="sub-drawer space-y-2"></div></div>
            <div id="feat-fiduciary" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-fiduciary')"><span class="text-xs font-bold uppercase text-yellow-600">Fiduciary</span><b id="fd-display" class="maskable text-sm text-yellow-500">₦0</b></div><div class="sub-drawer"><div class="seg-control"><div class="seg-btn" id="fd-v-goal" onclick="VaultCore.setFdView('goal')">GOAL</div><div class="seg-btn" id="fd-v-user" onclick="VaultCore.setFdView('user')">USER</div></div><div id="fd-pivot-list" class="space-y-4"></div></div></div>
            <div id="feat-history" class="vault-card opacity-50"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-history')"><span class="text-xs font-bold uppercase text-zinc-500">Audit Trail</span><span>▼</span></div><div class="sub-drawer"><input type="text" id="hi-search" class="input-ghost !text-xs mb-4" placeholder="Filter..." onkeyup="VaultUI.render()"><div id="hi-list" class="space-y-2 max-h-64 overflow-y-auto"></div></div></div>
        </div>
    </div>

    <div id="entry-form" class="view-hidden fixed inset-0 bg-black z-[2000] p-6 pt-20 overflow-y-auto">
        <div id="settle-toggle-container" class="mb-4"></div>
        <input id="e-amount" type="number" class="amount-hero" placeholder="0">
        
        <div id="fluid-container" class="view-hidden">
            <div class="fluid-bar">
                <div class="fluid-seg w-[40%]">BILLS<input id="fluid-bills" type="number" class="fluid-input" value="40" oninput="VaultUI.balanceFluid('bills')"></div>
                <div class="fluid-seg w-[40%]">SAVE<input id="fluid-save" type="number" class="fluid-input" value="40" oninput="VaultUI.balanceFluid('save')"></div>
                <div class="fluid-seg w-[20%]">SPEND<input id="fluid-spend" type="number" class="fluid-input" value="20" oninput="VaultUI.balanceFluid('spend')"></div>
            </div>
        </div>

        <div id="dynamic-inputs" class="space-y-4 mb-4"></div>
        <input id="e-name" class="input-ghost" placeholder="Description">
        <button onclick="VaultCore.execute()" class="fixed bottom-10 left-6 right-6 glass-panel py-6 text-sm font-black text-white uppercase bg-zinc-900">Execute</button>
    </div>

    <div id="query-lab" class="view-hidden fixed inset-0 bg-black z-[2000] p-6 pt-20">... (Query Logic) ...</div>
    <div id="entry-grid" class="view-hidden fixed inset-0 bg-black z-[1000] p-6 flex flex-col pt-24">
        <div class="grid grid-cols-2 gap-4">
            <button onclick="VaultUI.openForm('income')" class="bg-zinc-900 border border-emerald-900/30 rounded-2xl p-6 flex flex-col items-center gap-2">📥<span class="text-[10px] font-bold uppercase">Inflow</span></button>
            <button onclick="VaultUI.openForm('expense')" class="bg-zinc-900 border border-red-900/30 rounded-2xl p-6 flex flex-col items-center gap-2">📤<span class="text-[10px] font-bold uppercase">Expense</span></button>
            <button onclick="VaultUI.openForm('creditor')" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 flex flex-col items-center gap-2">🔴<span class="text-[10px] font-bold uppercase">Borrow</span></button>
            <button onclick="VaultUI.openForm('debtor')" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 flex flex-col items-center gap-2">🟢<span class="text-[10px] font-bold uppercase">Lend</span></button>
            <button onclick="VaultUI.openForm('fiduciary')" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-6 flex flex-col items-center gap-2">💼<span class="text-[10px] font-bold uppercase">Fiduciary</span></button>
        </div>
    </div>
    
    <div id="settings-view" class="view-hidden space-y-8 p-4 pt-20">
        <button onclick="VaultCore.export()" class="w-full glass-panel py-4">BACKUP</button>
        <button onclick="document.getElementById('file-input').click()" class="w-full glass-panel py-4 text-emerald-400">RESTORE</button>
        <input type="file" id="file-input" class="hidden" onchange="VaultCore.import(this)">
    </div>

    <button id="nav-fab" onclick="VaultUI.handleFab()" class="fab-btn fab-primary">+</button>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('SOV_DB_V75')) || [];
            let config = JSON.parse(localStorage.getItem('SOV_CFG_V75')) || { reqPin: false, fdView: 'goal' };
            const save = () => { localStorage.setItem('SOV_DB_V75', JSON.stringify(db)); localStorage.setItem('SOV_CFG_V75', JSON.stringify(config)); };
            return {
                db: () => db, config: () => config,
                setFdView: v => { config.fdView = v; VaultUI.render(); },
                setSettlement: b => { settlement = b; VaultUI.updateFormUI(); },
                execute: () => {
                    const a = parseFloat(document.getElementById('e-amount').value), desc = document.getElementById('e-name').value;
                    if(!desc || isNaN(a)) return;
                    let e = { id: Date.now(), name: desc, total: a, type: activeType, date: new Date().toISOString().split('T')[0] };
                    if(activeType === 'income') {
                        const bP = parseFloat(document.getElementById('fluid-bills').value)/100, sP = parseFloat(document.getElementById('fluid-save').value)/100, lP = parseFloat(document.getElementById('fluid-spend').value)/100;
                        e.b = a * bP; e.s = a * sP; e.l = a * lP;
                        if(settlement){ e.type='debt_repayment'; e.debtor=desc; }
                    }
                    else if(activeType === 'expense') { e.total=-a; }
                    else if(activeType === 'debtor' || activeType === 'creditor') {
                        e.rate = document.getElementById('e-rate').value;
                        e.term = document.getElementById('e-term').value;
                        e.total = activeType === 'creditor' ? -a : a;
                        e.debtor = desc; e.creditor = desc;
                    }
                    else if(activeType === 'fiduciary') { e.goal=document.getElementById('e-fd-goal').value; e.user=document.getElementById('e-fd-user').value; }
                    db.push(e); save(); VaultUI.changeView('dashboard-view');
                },
                export: () => { const b = new Blob([JSON.stringify(db)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Vault_v75.json'; a.click(); },
                import: (input) => { const r = new FileReader(); r.onload = (e) => { db = JSON.parse(e.target.result); save(); location.reload(); }; r.readAsText(input.files[0]); }
            };
        })();

        let activeType = 'income', settlement = false;
        const VaultUI = (() => {
            return {
                toggleCard: id => document.getElementById(id).classList.toggle('drawer-open'),
                balanceFluid: (src) => {
                    let b = parseInt(document.getElementById('fluid-bills').value) || 0, s = parseInt(document.getElementById('fluid-save').value) || 0, l = parseInt(document.getElementById('fluid-spend').value) || 0;
                    if(src==='bills'){ let r=100-b; s=Math.floor(r*0.66); l=r-s; } else if(src==='save'){ let r=100-s; b=Math.floor(r*0.66); l=r-b; } else { let r=100-l; b=Math.floor(r/2); s=r-b; }
                    document.getElementById('fluid-bills').value=b; document.getElementById('fluid-save').value=s; document.getElementById('fluid-spend').value=l;
                },
                changeView: id => {
                    ['dashboard-view', 'entry-grid', 'entry-form', 'settings-view', 'query-lab'].forEach(v => { if(document.getElementById(v)) document.getElementById(v).classList.add('view-hidden'); });
                    if(document.getElementById(id)) document.getElementById(id).classList.remove('view-hidden');
                    const f = document.getElementById('nav-fab');
                    f.innerText = id === 'dashboard-view' ? "+" : "↩";
                    f.onclick = () => VaultUI.changeView(id === 'dashboard-view' ? 'entry-grid' : 'dashboard-view');
                    VaultUI.render();
                },
                openForm: t => { activeType = t; settlement = false; VaultUI.changeView('entry-form'); VaultUI.updateFormUI(); },
                updateFormUI: () => {
                    const dyn = document.getElementById('dynamic-inputs'), fluid = document.getElementById('fluid-container'), tog = document.getElementById('settle-toggle-container'), name = document.getElementById('e-name');
                    dyn.innerHTML = ''; fluid.classList.add('view-hidden'); tog.innerHTML = '';
                    if(activeType==='income') {
                        fluid.classList.remove('view-hidden');
                        tog.innerHTML = `<div class="seg-control"><div class="seg-btn ${!settlement?'active emerald':''}" onclick="VaultCore.setSettlement(false)">INFLOW</div><div class="seg-btn ${settlement?'active yellow':''}" onclick="VaultCore.setSettlement(true)">RECOVER DEBT</div></div>`;
                    } else if(activeType==='debtor' || activeType==='creditor') {
                        dyn.innerHTML = '<div class="grid grid-cols-2 gap-4"><input id="e-rate" type="number" class="input-ghost" placeholder="Rate %"><input id="e-term" type="date" class="input-ghost" placeholder="Timeline"></div>';
                    } else if(activeType==='fiduciary') {
                        dyn.innerHTML = '<input id="e-fd-goal" class="input-ghost" placeholder="Project"><input id="e-fd-user" class="input-ghost" placeholder="Person">';
                    }
                },
                render: () => {
                    const db = VaultCore.db(); let nw=0, b=0, s=0, l=0, fd=0, ex=0, dbT=0;
                    ['db-list','fd-pivot-list','hi-list','ex-list'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerHTML = ''; });
                    db.slice().reverse().forEach(i => {
                        if(i.type==='fiduciary') { fd+=i.total; }
                        else {
                            nw += i.total; b+=(i.b||0); s+=(i.s||0); l+=(i.l||0);
                            if(i.total < 0) ex += Math.abs(i.total);
                        }
                        if(document.getElementById('hi-list')) document.getElementById('hi-list').innerHTML += `<div class="py-3 border-b border-zinc-800 text-[10px] uppercase"><span>${i.name}</span></div>`;
                    });
                    const set = (id, v) => { if(document.getElementById(id)) document.getElementById(id).innerText = "₦" + v.toLocaleString(); };
                    set('nw-display', nw); set('split-cash', (b+s+l)); set('tc-display', (b+s+l)); set('b-total', b); set('s-total', s); set('l-total', l);
                }
            };
        })();
        window.onload = () => VaultUI.changeView('dashboard-view');
    </script>
</body>
</html>
