<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 14px; border-radius: 8px; width: 100%; outline: none; }
        
        #dashboard-content { position: relative; z-index: 10; padding: 24px; }
        .stealth-btn { position: relative; z-index: 100 !important; pointer-events: auto !important; }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 999 !important; pointer-events: auto !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }

        #menu-overlay { 
            display: none; 
            position: fixed; 
            inset: 0; 
            z-index: 2000 !important; 
            background: rgba(0,0,0,0.98); 
            backdrop-filter: blur(25px); 
            padding: 24px;
            padding-top: 80px;
        }
        .menu-open { display: flex !important; flex-direction: column; align-items: center; }
        
        /* Dropdown Fix: Ensure summary is always clickable */
        summary { cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button onclick="togglePrivacy()" class="stealth-btn p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800">Stealth</button>
        </header>

        <details class="vault-card group mb-4 border-red-900/30">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black oxblood-text">Creditor Ledger (Monies Owed)</span>
                <span id="inv-debt-total" class="text-sm font-bold oxblood-text">₦0</span>
            </summary>
            <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
        </details>

        <details class="vault-card group mb-8">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black">Asset Inventory</span>
                <span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span>
            </summary>
            <div id="asset-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
        </details>

        <div class="mb-12 border-t border-zinc-900 pt-8">
            <p class="text-gold-text text-[10px] tracking-[0.3em] uppercase font-black mb-6">Fiduciary Bookkeeping</p>
            <div id="fiduciary-view" class="space-y-4">
                </div>
        </div>

        <button onclick="resetVault()" class="w-full mt-10 p-4 text-[9px] uppercase tracking-widest text-zinc-800 border border-zinc-900 rounded-lg">Purge Data</button>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-3xl font-bold active:scale-90">+</button>

    <div id="menu-overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto">
            <h2 class="text-xl font-bold uppercase tracking-tighter">Log Entry</h2>
            <div class="space-y-4">
                <select id="entry-mode" class="input-dark" onchange="toggleFormFields()">
                    <option value="Personal">Personal Entry</option>
                    <option value="Fiduciary">Fiduciary Contribution</option>
                </select>
                <input id="form-name" class="input-dark" placeholder="Name (e.g. Kaku, Ogbonna)">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                
                <div id="personal-options">
                    <select id="form-type" class="input-dark">
                        <option value="Liability">Creditor (Money I Owe)</option>
                        <option value="Asset">Fixed Asset</option>
                        <option value="Cash">Liquid Cash</option>
                    </select>
                </div>
            </div>
            <div class="pt-6 space-y-3">
                <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Authorize</button>
                <button onclick="toggleMenu()" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Back</button>
            </div>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];

        function updateDisplay() {
            let assetsSum = 0, debtSum = 0;
            const assetList = document.getElementById('asset-list'), debtList = document.getElementById('debt-list'), fView = document.getElementById('fiduciary-view');
            assetList.innerHTML = ''; debtList.innerHTML = ''; fView.innerHTML = '';

            ledger.slice().reverse().forEach((item, originalIndex) => {
                const index = ledger.length - 1 - originalIndex;
                const isAsset = (item.type === 'Asset' || item.type === 'Cash');
                if(isAsset) assetsSum += item.amount; else debtSum += item.amount;
                
                const listHTML = `<div class="flex justify-between items-center py-2 border-b border-zinc-900 last:border-0"><div class="flex flex-col"><span class="text-zinc-500 uppercase text-[9px] font-bold">${item.name}</span><span class="text-[7px] text-zinc-700">${item.timestamp}</span></div><div class="flex items-center gap-3"><span class="${isAsset ? 'emerald-text' : 'oxblood-text'}">₦${stealth ? '••••' : item.amount.toLocaleString()}</span><button onclick="deleteItem(${index}, 'Personal')" class="text-zinc-800 font-bold">×</button></div></div>`;
                
                if (isAsset) assetList.innerHTML += listHTML; else debtList.innerHTML += listHTML;
            });

            const fGroups = fLedger.reduce((acc, item) => {
                if (!acc[item.name]) acc[item.name] = { total: 0, items: [] };
                acc[item.name].total += item.amount;
                acc[item.name].items.push(item);
                return acc;
            }, {});

            for (const name in fGroups) {
                fView.innerHTML += `
                    <details class="vault-card group border-zinc-800">
                        <summary class="p-5 flex justify-between items-center list-none cursor-pointer">
                            <span class="text-xs font-bold uppercase">${name}</span>
                            <span class="gold-text font-bold text-xs">₦${stealth ? '••••' : fGroups[name].total.toLocaleString()}</span>
                        </summary>
                        <div class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4">
                            ${fGroups[name].items.map(i => `<div class="flex justify-between text-[10px]"><span class="text-zinc-500">${i.timestamp}</span><span class="gold-text">₦${i.amount.toLocaleString()}</span></div>`).join('')}
                        </div>
                    </details>`;
            }

            document.getElementById('networth').innerText = "₦" + (assetsSum - debtSum).toLocaleString();
            document.getElementById('inv-assets-total').innerText = "₦" + assetsSum.toLocaleString();
            document.getElementById('inv-debt-total').innerText = "₦" + debtSum.toLocaleString();
        }

        function toggleFormFields() {
            document.getElementById('personal-options').classList.toggle('hidden', document.getElementById('entry-mode').value === 'Fiduciary');
        }

        function submitEntry() {
            const mode = document.getElementById('entry-mode').value, name = document.getElementById('form-name').value, amount = parseFloat(document.getElementById('form-amount').value);
            if (!name || isNaN(amount)) return;
            const timestamp = new Date().toLocaleDateString() + ' @ ' + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
            
            if (mode === 'Personal') {
                ledger.push({ name, amount, type: document.getElementById('form-type').value, timestamp });
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            } else {
                fLedger.push({ name, amount, timestamp });
                localStorage.setItem('fiduciary_ledger', JSON.stringify(fLedger));
            }
            updateDisplay(); toggleMenu();
        }

        function deleteItem(index, type) {
            if(confirm("Delete record?")) {
                if(type === 'Personal') ledger.splice(index, 1);
                localStorage.setItem('vault_ledger', JSON.stringify(ledger));
                updateDisplay();
            }
        }

        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }
        function togglePrivacy() { stealth = !stealth; updateDisplay(); }
        function resetVault() { if(confirm("Wipe all data?")) { localStorage.clear(); location.reload(); } }
        updateDisplay();
    </script>
</body>
</html>
