<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
    <title>Sovereign Vault v81</title>
    
    <link rel="apple-touch-icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg==">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #000000;
            --text-color: #E5E5E5;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-blue: #3B82F6;
            --accent-yellow: #EAB308;
            --zinc-800: #27272a;
            --zinc-900: #18181b;
            --border-color: #333;
            --safe-top: env(safe-area-inset-top, 20px);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; padding-top: calc(var(--safe-top) + 10px); padding-bottom: 100px; overflow-x: hidden; }
        
        .flex { display: flex; }
        .flex-col { flex-direction: column; }
        .items-center { align-items: center; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .gap-2 { gap: 8px; } .gap-4 { gap: 16px; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .p-4 { padding: 16px; } .p-5 { padding: 20px; } .p-6 { padding: 24px; }
        .text-xs { font-size: 12px; } .text-sm { font-size: 14px; } .font-bold { font-weight: 700; } .font-black { font-weight: 900; }
        .uppercase { text-transform: uppercase; }
        .hidden { display: none; }

        .glass-panel { background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(24px); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; }
        .hero-card { background: linear-gradient(145deg, #111 0%, #050505 100%); border: 1px solid rgba(16, 185, 129, 0.2); border-radius: 28px; padding: 30px; margin-top: 20px; }
        .vault-card { background: #111; border: 1px solid #222; border-radius: 18px; margin-bottom: 12px; width: 100%; overflow: hidden; pointer-events: auto; }
        
        .sub-drawer { display: none; padding: 20px; background: #080808; border-top: 1px solid #222; }
        .drawer-open > .sub-drawer { display: block; }
        
        .input-ghost { background: transparent; border: none; color: white; font-size: 16px; width: 100%; outline: none; padding: 12px 0; border-bottom: 1px solid #333; border-radius: 0; }
        .input-ghost:focus { border-bottom-color: var(--accent-green); }
        .amount-hero { font-size: 48px; font-weight: 900; text-align: center; color: #fff; width: 100%; background: transparent; border: none; outline: none; padding: 20px 0; }
        
        .fab-btn { position: fixed; bottom: 30px; right: 30px; width: 64px; height: 64px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 28px; z-index: 9999; border: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5); cursor: pointer; }
        .fab-primary { background: linear-gradient(135deg, #10B981 0%, #059669 100%); color: black; }
        .fab-back { background: #333; color: white; }

        .btn-dark { background: var(--zinc-900); color: white; border: 1px solid #333; padding: 16px; border-radius: 16px; font-weight: 800; width: 100%; cursor: pointer; }
        .btn-grid { background: var(--zinc-900); border: 1px solid #333; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer; }
        
        .fluid-bar { display: flex; border-radius: 12px; overflow: hidden; margin: 20px 0; border: 1px solid #333; }
        .fluid-seg { padding: 12px 0; text-align: center; font-size: 10px; font-weight: 800; background: #111; border-right: 1px solid #222; color: #777; width: 33.33%; }
        .fluid-input { background: transparent; width: 100%; text-align: center; color: var(--accent-green); outline: none; font-size: 14px; font-weight: 900; border: none; }

        .seg-control { display: flex; background: #000; padding: 4px; border-radius: 14px; border: 1px solid #222; margin-bottom: 20px; }
        .seg-btn { flex: 1; text-align: center; padding: 10px; font-size: 10px; font-weight: 800; color: #555; border-radius: 10px; cursor: pointer; }
        .seg-btn.active.emerald { background: #064E3B; color: #10B981; }
        .seg-btn.active.yellow { background: #78350f; color: #fcd34d; }

        .view-hidden { display: none !important; }
        .full-overlay { position: fixed; inset: 0; background: black; z-index: 2000; padding: 20px; padding-top: 80px; overflow-y: auto; }
        .stealth-active .maskable { filter: blur(15px); opacity: 0.3; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .switch { position: relative; display: inline-block; width: 50px; height: 28px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; inset: 0; background-color: #222; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 24px; width: 24px; left: 2px; bottom: 2px; background-color: #666; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent-green); }
        input:checked + .slider:before { transform: translateX(22px); background-color: white; }
    </style>
</head>
<body>

    <div id="auth-screen" class="full-overlay view-hidden" style="z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <div style="font-size: 40px; margin-bottom: 20px;">🔒</div>
        <input id="auth-pin" type="password" class="input-ghost" style="text-align: center; font-size: 40px; letter-spacing: 10px; width: 200px;" placeholder="••••" maxlength="4" inputmode="numeric">
        <button onclick="VaultUI.authenticate()" class="btn-dark" style="margin-top: 40px;">UNLOCK VAULT</button>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 10px; margin-bottom: 20px;">
        <span class="text-xs font-black uppercase text-zinc" style="color: #555;">Sovereign v81</span>
        <div class="flex gap-2">
            <button onclick="VaultUI.changeView('query-lab')" style="background:none; border:none; color:#555; font-size:18px;">🔍</button>
            <button onclick="VaultUI.toggleStealth()" style="background:none; border:none; color:#555; font-size:18px;">👁️</button>
            <button onclick="VaultUI.changeView('settings-view')" style="background:none; border:none; color:#555; font-size:18px;">⚙️</button>
        </div>
    </div>

    <div id="dashboard-view">
        <div class="hero-card text-center">
            <h1 id="nw-display" class="amount-hero maskable">₦0.00</h1>
            <div class="flex justify-center gap-4" style="opacity: 0.8;">
                <div class="text-center"><p id="split-cash" class="text-xs font-bold maskable" style="color:var(--accent-green)">₦0</p><p class="text-xs font-bold uppercase" style="font-size: 8px; color: #555;">Cash</p></div>
                <div class="text-center"><p id="split-as" class="text-xs font-bold maskable" style="color:var(--accent-blue)">₦0</p><p class="text-xs font-bold uppercase" style="font-size: 8px; color: #555;">Assets</p></div>
                <div class="text-center"><p id="split-db" class="text-xs font-bold maskable" style="color:var(--accent-yellow)">₦0</p><p class="text-xs font-bold uppercase" style="font-size: 8px; color: #555;">Debt</p></div>
            </div>
        </div>

        <div id="cards-container">
            <div id="feat-liq" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-liq')"><span class="text-xs font-bold uppercase">Liquidity</span><b id="tc-display" class="maskable text-sm" style="color:var(--accent-green)">₦0</b></div><div class="sub-drawer space-y-4"><div class="flex justify-between uppercase text-xs"><span>Bills</span><span id="b-total" class="maskable font-bold">₦0</span></div><div class="flex justify-between uppercase text-xs" style="margin-top:10px"><span>Savings</span><span id="s-total" class="maskable font-bold">₦0</span></div><div class="flex justify-between uppercase text-xs" style="margin-top:10px"><span>Spend</span><span id="l-total" class="maskable font-bold">₦0</span></div></div></div>
            <div id="feat-ex" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-ex')"><span class="text-xs font-bold uppercase" style="color:var(--accent-red)">Expenses</span><b id="ex-display" class="maskable text-sm" style="color:var(--accent-red)">₦0</b></div><div id="ex-list" class="sub-drawer"></div></div>
            <div id="feat-as" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-as')"><span class="text-xs font-bold uppercase" style="color:var(--accent-blue)">Assets</span><b id="as-display" class="maskable text-sm" style="color:var(--accent-blue)">₦0</b></div><div id="as-list" class="sub-drawer"></div></div>
            <div id="feat-db" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-db')"><span class="text-xs font-bold uppercase">Debtors</span><b id="db-display" class="maskable text-sm" style="color:var(--accent-green)">₦0</b></div><div id="db-list" class="sub-drawer"></div></div>
            <div id="feat-cr" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-cr')"><span class="text-xs font-bold uppercase" style="color:#666">Creditors</span><b id="cr-display" class="maskable text-sm" style="color:var(--accent-red)">₦0</b></div><div id="cr-list" class="sub-drawer"></div></div>
            <div id="feat-fd" class="vault-card"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-fd')"><span class="text-xs font-bold uppercase" style="color:var(--accent-yellow)">Fiduciary</span><b id="fd-display" class="maskable text-sm" style="color:var(--accent-yellow)">₦0</b></div><div class="sub-drawer"><div class="seg-control"><div class="seg-btn" id="fd-v-goal" onclick="VaultCore.setFdView('goal')">GOAL</div><div class="seg-btn" id="fd-v-user" onclick="VaultCore.setFdView('user')">USER</div></div><div id="fd-pivot-list"></div></div></div>
            <div id="feat-hi" class="vault-card" style="opacity: 0.7;"><div class="p-5 flex justify-between items-center" onclick="VaultUI.toggleCard('feat-hi')"><span class="text-xs font-bold uppercase">Audit Trail</span><span>▼</span></div><div class="sub-drawer"><input type="text" id="hi-search" class="input-ghost text-xs mb-4" placeholder="Filter..." onkeyup="VaultUI.render()"><div id="hi-list" style="max-height: 400px; overflow-y: auto;"></div></div></div>
        </div>
    </div>

    <div id="entry-grid" class="full-overlay view-hidden">
        <div class="flex justify-between mb-6"><h2 class="text-sm font-black uppercase">New Entry</h2><button onclick="VaultUI.changeView('dashboard-view')" style="background:none; border:none; color: white; font-size: 20px;">✕</button></div>
        <div class="grid-2">
            <button onclick="VaultUI.openForm('income')" class="btn-grid" style="border-color: #064E3B;">📥<span class="text-xs font-bold uppercase text-emerald">Inflow</span></button>
            <button onclick="VaultUI.openForm('expense')" class="btn-grid" style="border-color: #7F1D1D;">📤<span class="text-xs font-bold uppercase text-red">Expense</span></button>
            <button onclick="VaultUI.openForm('asset')" class="btn-grid">💎<span class="text-xs font-bold uppercase text-blue">Asset</span></button>
            <button onclick="VaultUI.openForm('creditor')" class="btn-grid">🔴<span class="text-xs font-bold uppercase text-red">Borrow</span></button>
            <button onclick="VaultUI.openForm('debtor')" class="btn-grid">🟢<span class="text-xs font-bold uppercase text-emerald">Lend</span></button>
            <button onclick="VaultUI.openForm('fiduciary')" class="btn-grid">💼<span class="text-xs font-bold uppercase text-yellow">Fiduciary</span></button>
        </div>
    </div>

    <div id="entry-form" class="full-overlay view-hidden">
        <div class="flex justify-between mb-6"><div id="settle-toggle-container" class="w-full" style="margin-right: 20px;"></div><button onclick="VaultUI.changeView('entry-grid')" style="background:none; border:none; color: white; font-size: 20px;">✕</button></div>
        <input id="e-amount" type="number" class="amount-hero" placeholder="0">
        
        <div id="fluid-container" class="hidden">
            <div class="fluid-bar">
                <div class="fluid-seg">BILLS<input id="fluid-bills" type="number" class="fluid-input" value="40" oninput="VaultUI.balanceFluid('bills')"></div>
                <div class="fluid-seg">SAVE<input id="fluid-save" type="number" class="fluid-input" value="40" oninput="VaultUI.balanceFluid('save')"></div>
                <div class="fluid-seg" style="border-right: none;">SPEND<input id="fluid-spend" type="number" class="fluid-input" value="20" oninput="VaultUI.balanceFluid('spend')"></div>
            </div>
        </div>

        <div id="dynamic-inputs" class="mb-4" style="margin-top: 20px;"></div>
        <input id="e-name" class="input-ghost" placeholder="Description" list="active-list">
        <datalist id="active-list"></datalist>
        <button onclick="VaultCore.execute()" class="btn-dark" style="margin-top: 40px; padding: 20px; font-size: 14px;">EXECUTE TRANSACTION</button>
    </div>

    <div id="query-lab" class="full-overlay view-hidden">
        <input type="text" id="q-search" class="input-ghost" placeholder="Search entries..." onkeyup="VaultUI.runQuery()" style="font-size: 20px;">
        <div id="q-results" class="flex-col gap-2" style="margin-top: 20px;"></div>
    </div>

    <div id="settings-view" class="full-overlay view-hidden">
        <div class="vault-card p-6 mb-4">
            <div class="flex justify-between items-center mb-4"><p class="text-xs font-bold uppercase">PIN Startup</p><label class="switch"><input type="checkbox" id="tog-pin" onchange="VaultCore.toggleSetting('reqPin')"><span class="slider"></span></label></div>
            <input id="set-pin" type="password" maxlength="4" class="input-ghost text-center" placeholder="••••" inputmode="numeric">
            <button onclick="VaultCore.savePin()" class="btn-dark" style="padding:10px; margin-top:10px;">Update PIN</button>
        </div>
        <button onclick="VaultCore.export()" class="btn-dark mb-4">BACKUP DATA</button>
        <button onclick="document.getElementById('file-input').click()" class="btn-dark mb-4" style="color: var(--accent-green);">RESTORE DATA</button>
        <input type="file" id="file-input" class="hidden" onchange="VaultCore.import(this)">
        <button onclick="VaultCore.wipe()" class="btn-dark" style="color: var(--accent-red); border-color: var(--accent-red);">FACTORY RESET</button>
    </div>

    <button id="nav-fab" onclick="VaultUI.handleFab()" class="fab-btn fab-primary">+</button>

    <script>
        const VaultCore = (() => {
            let db = JSON.parse(localStorage.getItem('SOV_DB_V81')) || [];
            let config = JSON.parse(localStorage.getItem('SOV_CFG_V81')) || { reqPin: false, fdView: 'goal' };
            let pin = localStorage.getItem('SOV_PIN_V81') || "";
            const save = () => { localStorage.setItem('SOV_DB_V81', JSON.stringify(db)); localStorage.setItem('SOV_CFG_V81', JSON.stringify(config)); localStorage.setItem('SOV_PIN_V81', pin); };
            return {
                db: () => db, config: () => config, pin: () => pin,
                setFdView: v => { config.fdView = v; save(); VaultUI.render(); },
                toggleSetting: k => { config[k] = !config[k]; save(); },
                savePin: () => { const p = document.getElementById('set-pin').value; if(p.length===4){ pin=p; save(); alert("PIN Saved"); } },
                setSettlement: b => { settlement = b; VaultUI.updateFormUI(); },
                execute: () => {
                    const a = parseFloat(document.getElementById('e-amount').value), desc = document.getElementById('e-name').value;
                    if(!desc || isNaN(a)) return;
                    
                    const now = new Date();
                    const timestamp = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ', ' + now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                    
                    let e = { id: Date.now(), name: desc, total: a, type: activeType, date: timestamp };
                    if(activeType === 'income') {
                        const bP = parseFloat(document.getElementById('fluid-bills').value)/100, sP = parseFloat(document.getElementById('fluid-save').value)/100, lP = parseFloat(document.getElementById('fluid-spend').value)/100;
                        e.b = a * bP; e.s = a * sP; e.l = a * lP;
                        if(settlement){ e.type='debt_repayment'; e.debtor=desc; }
                    }
                    else if(activeType === 'expense') { e.total=-a; if(settlement){ e.type='credit_settlement'; e.creditor=desc; } }
                    else if(activeType === 'asset') { e.cat=document.getElementById('e-as-cat').value; }
                    else if(activeType === 'creditor') { e.total=-a; e.creditor=desc; e.rate=document.getElementById('e-rate').value; e.term=document.getElementById('e-term').value; }
                    else if(activeType === 'debtor') { e.debtor=desc; e.rate=document.getElementById('e-rate').value; e.term=document.getElementById('e-term').value; }
                    else if(activeType === 'fiduciary') { e.goal=document.getElementById('e-fd-goal').value; e.user=document.getElementById('e-fd-user').value; }
                    
                    db.push(e); save(); VaultUI.changeView('dashboard-view');
                },
                export: () => { const b = new Blob([JSON.stringify(db)], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Vault_v81.json'; a.click(); },
                import: (input) => { const r = new FileReader(); r.onload = (e) => { db = JSON.parse(e.target.result); save(); location.reload(); }; r.readAsText(input.files[0]); },
                delete: id => { if(confirm("Delete entry?")){ db=db.filter(x=>x.id!==id); save(); VaultUI.render(); }},
                wipe: () => { if(confirm("RESET SYSTEM?")){ localStorage.clear(); location.reload(); }}
            };
        })();

        let activeType = 'income', settlement = false;
        const VaultUI = (() => {
            return {
                init: () => { 
                    const cfg = VaultCore.config(); document.getElementById('tog-pin').checked = cfg.reqPin;
                    if(VaultCore.pin() && cfg.reqPin) document.getElementById('auth-screen').classList.remove('view-hidden');
                    else VaultUI.render();
                },
                authenticate: () => { if(document.getElementById('auth-pin').value === VaultCore.pin()) { document.getElementById('auth-screen').classList.add('view-hidden'); VaultUI.render(); } else alert("Wrong PIN"); },
                toggleCard: id => { document.getElementById(id).classList.toggle('drawer-open'); },
                toggleStealth: () => document.body.classList.toggle('stealth-active'),
                
                balanceFluid: (src) => {
                    let b = parseInt(document.getElementById('fluid-bills').value)||0;
                    let s = parseInt(document.getElementById('fluid-save').value)||0;
                    let l = parseInt(document.getElementById('fluid-spend').value)||0;
                    
                    if(src==='bills') { l = 100 - (b + s); if(l < 0) { s = 100 - b; l = 0; } }
                    else if(src==='save') { l = 100 - (b + s); if(l < 0) { b = 100 - s; l = 0; } }
                    else if(src==='spend') { s = 100 - (b + l); if(s < 0) { b = 100 - l; s = 0; } }

                    document.getElementById('fluid-bills').value = b;
                    document.getElementById('fluid-save').value = s;
                    document.getElementById('fluid-spend').value = l;
                },

                changeView: id => {
                    ['dashboard-view', 'entry-grid', 'entry-form', 'settings-view', 'query-lab'].forEach(v => document.getElementById(v).classList.add('view-hidden'));
                    document.getElementById(id).classList.remove('view-hidden');
                    const f = document.getElementById('nav-fab');
                    if(id==='dashboard-view') { f.innerText = "+"; f.onclick = () => VaultUI.changeView('entry-grid'); f.className="fab-btn fab-primary"; }
                    else { f.innerText = "↩"; f.onclick = () => VaultUI.changeView('dashboard-view'); f.className="fab-btn fab-back"; }
                    VaultUI.render();
                },
                openForm: t => { activeType = t; settlement = false; VaultUI.changeView('entry-form'); VaultUI.updateFormUI(); },
                updateFormUI: () => {
                    const dyn = document.getElementById('dynamic-inputs'), fluid = document.getElementById('fluid-container'), tog = document.getElementById('settle-toggle-container'), name = document.getElementById('e-name'), dl = document.getElementById('active-list');
                    dyn.innerHTML = ''; fluid.classList.add('hidden'); tog.innerHTML = ''; dl.innerHTML = ''; name.placeholder = "Description";
                    if(activeType==='income') {
                        fluid.classList.remove('hidden');
                        tog.innerHTML = `<div class="seg-control"><div class="seg-btn ${!settlement?'active emerald':''}" onclick="VaultCore.setSettlement(false)">INFLOW</div><div class="seg-btn ${settlement?'active yellow':''}" onclick="VaultCore.setSettlement(true)">RECOVER</div></div>`;
                        if(settlement) { name.placeholder = "Payer Name"; [...new Set(VaultCore.db().filter(i=>i.type==='debtor').map(i=>i.debtor))].forEach(n=>dl.innerHTML+=`<option value="${n}">`); }
                    } else if(activeType==='expense') {
                        tog.innerHTML = `<div class="seg-control"><div class="seg-btn ${!settlement?'active emerald':''}" onclick="VaultCore.setSettlement(false)">EXPENSE</div><div class="seg-btn ${settlement?'active yellow':''}" onclick="VaultCore.setSettlement(true)">PAY DEBT</div></div>`;
                        if(settlement) { name.placeholder = "Creditor Name"; [...new Set(VaultCore.db().filter(i=>i.type==='creditor').map(i=>i.creditor))].forEach(n=>dl.innerHTML+=`<option value="${n}">`); }
                    } else if(activeType==='debtor' || activeType==='creditor') {
                        dyn.innerHTML = '<div class="grid-2"><input id="e-rate" type="number" class="input-ghost" placeholder="Rate %"><input id="e-term" type="date" class="input-ghost"></div>';
                        name.placeholder = activeType==='creditor' ? "Lender Name" : "Borrower Name";
                    } else if(activeType==='fiduciary') {
                        dyn.innerHTML = '<input id="e-fd-goal" class="input-ghost mb-4" placeholder="Project"><input id="e-fd-user" class="input-ghost" placeholder="Contributor">';
                    } else if(activeType==='asset') {
                        dyn.innerHTML = '<select id="e-as-cat" class="input-ghost"><option value="Property">Property</option><option value="Vehicle">Vehicle</option><option value="Stock">Stock</option></select>';
                        name.placeholder = "Asset Name";
                    }
                },
                runQuery: () => {
                    const s = document.getElementById('q-search').value.toLowerCase();
                    const res = document.getElementById('q-results'); res.innerHTML = '';
                    VaultCore.db().filter(i => (i.name||"").toLowerCase().includes(s) || (i.debtor||"").toLowerCase().includes(s)).reverse().forEach(i => {
                        res.innerHTML += `<div class="glass-panel p-4 mb-2 flex justify-between uppercase text-xs"><span>${i.date} | ${i.name}</span><b>₦${Math.abs(i.total).toLocaleString()}</b></div>`;
                    });
                },
                render: () => {
                    const db = VaultCore.db(); let nw=0, b=0, s=0, l=0, as=0, fd=0, ex=0, dbT=0, crT=0;
                    const piv = {}; const fView = VaultCore.config().fdView;
                    ['as-list','db-list','cr-list','fd-pivot-list','hi-list','ex-list'].forEach(id => { if(document.getElementById(id)) document.getElementById(id).innerHTML = ''; });
                    document.getElementById('fd-v-goal').className = `seg-btn ${fView==='goal'?'active emerald':''}`;
                    document.getElementById('fd-v-user').className = `seg-btn ${fView==='user'?'active emerald':''}`;

                    // Reverse ensures Newest First
                    db.slice().reverse().forEach(i => {
                        if(i.type==='fiduciary') { 
                            fd+=i.total; const m = fView === 'goal' ? i.goal : i.user, sb = fView === 'goal' ? i.user : i.goal;
                            if(!piv[m]) piv[m] = { t: 0, subs: [] }; piv[m].t += i.total; piv[m].subs.push({ n: sb, a: i.total });
                        } else {
                            nw += i.total; b+=(i.b||0); s+=(i.s||0); l+=(i.l||0);
                            if(i.type==='expense'||(i.type==='credit_settlement')) { ex += Math.abs(i.total); document.getElementById('ex-list').innerHTML+=`<div class="flex justify-between py-2 text-xs uppercase" style="border-bottom:1px solid #222;"><span>${i.name}</span><span>₦${Math.abs(i.total).toLocaleString()}</span></div>`; }
                            if(i.type==='asset') { as+=i.total; document.getElementById('as-list').innerHTML+=`<div class="flex justify-between py-2 text-xs uppercase" style="border-bottom:1px solid #222;"><span>${i.name}</span><span>₦${i.total.toLocaleString()}</span></div>`; }
                            if(i.type==='debtor'||i.type==='debt_repayment') { const val = i.type==='debt_repayment' ? -i.total : i.total; dbT+=val; document.getElementById('db-list').innerHTML+=`<div class="flex justify-between py-2 text-xs uppercase" style="border-bottom:1px solid #222;"><span>${i.debtor||i.name}</span><span>₦${val.toLocaleString()}</span></div>`; }
                            if(i.type==='creditor'||i.type==='credit_settlement') { const val = i.type==='credit_settlement' ? -Math.abs(i.total) : Math.abs(i.total); crT+=val; document.getElementById('cr-list').innerHTML+=`<div class="flex justify-between py-2 text-xs uppercase text-red" style="border-bottom:1px solid #222;"><span>${i.creditor||i.name}</span><span>₦${val.toLocaleString()}</span></div>`; }
                        }
                        const hiS = document.getElementById('hi-search').value.toLowerCase();
                        if(!hiS || (i.name||"").toLowerCase().includes(hiS)) {
                            document.getElementById('hi-list').innerHTML += `
                                <div class="flex justify-between py-4 items-center" style="border-bottom:1px solid #222;">
                                    <div class="flex-col">
                                        <span class="text-xs uppercase font-bold">${i.name}</span>
                                        <span style="font-size: 9px; color: #555;">${i.date}</span>
                                    </div>
                                    <div class="flex gap-4 items-center">
                                        <b class="text-sm">₦${Math.abs(i.total).toLocaleString()}</b>
                                        <button onclick="VaultCore.delete(${i.id})" style="background:none; border:none; color:var(--accent-red); font-size:16px;">✕</button>
                                    </div>
                                </div>`;
                        }
                    });
                    Object.keys(piv).forEach(k => { 
                        let r = piv[k].subs.map(sb => `<div class="flex justify-between py-1 opacity-60 text-xs"><span>${sb.n}</span><span>₦${sb.a.toLocaleString()}</span></div>`).join('');
                        document.getElementById('fd-pivot-list').innerHTML += `<div class="p-3 mb-2" style="background:var(--zinc-900); border-radius:8px;"><div class="flex justify-between font-black text-xs text-yellow uppercase"><span>${k}</span><span>₦${piv[k].t.toLocaleString()}</span></div><div class="text-xs mt-2">${r}</div></div>`;
                    });
                    const set = (id, v) => { if(document.getElementById(id)) document.getElementById(id).innerText = "₦" + v.toLocaleString(); };
                    set('nw-display', nw); set('split-cash', (b+s+l)); set('split-as', as); set('split-db', dbT);
                    set('tc-display', (b+s+l)); set('b-total', b); set('s-total', s); set('l-total', l);
                    set('ex-display', ex); set('as-display', as); set('db-display', dbT); set('cr-display', crT); set('fd-display', fd);
                }
            };
        })();
        window.onload = VaultUI.init;
    </script>
</body>
</html>
