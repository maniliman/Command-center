<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --safe-top: env(safe-area-inset-top, 50px); }
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; margin: 0; padding: 0; overflow-x: hidden; }
        
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 16px; margin-bottom: 16px; width: 100%; }
        .emerald-border { border: 1px solid #00FF41; background: rgba(0, 255, 65, 0.02); }
        
        .fab-btn { position: fixed; bottom: 30px; width: 72px; height: 72px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; border: none; cursor: pointer; z-index: 1000; }
        
        .view-hidden { display: none !important; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 20px; border-radius: 14px; width: 100%; outline: none; }
        
        /* Nested Hierarchy Logic */
        .chevron { transition: transform 0.3s; font-size: 10px; opacity: 0.5; }
        .open .chevron { transform: rotate(180deg); opacity: 1; }
        .sub-drawer { display: none; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 12px; margin-top: 8px; border: 1px solid #262629; }
        .open > .sub-drawer { display: block; }
        
        .emerald-text { color: #00FF41; }
    </style>
</head>
<body class="p-6" style="padding-top: calc(var(--safe-top) + 20px);">

    <div id="dashboard-view" class="space-y-6">
        <div class="flex justify-between items-center mb-10 px-2">
            <p class="text-[10px] tracking-[0.4em] uppercase font-black text-emerald-500/40">Sovereign Command</p>
            <div class="flex gap-3">
                <button onclick="changeView('intel-view')" class="w-12 h-12 vault-card flex items-center justify-center m-0 border-zinc-700">📊</button>
                <button onclick="changeView('settings-view')" class="w-12 h-12 vault-card flex items-center justify-center m-0 border-zinc-700">⚙️</button>
            </div>
        </div>

        <div class="text-center mb-12">
            <p class="text-[11px] uppercase text-zinc-500 font-bold mb-2">Total Sovereign Wealth</p>
            <h1 id="nw-display" class="text-6xl font-black tracking-tighter emerald-text">₦0.00</h1>
        </div>

        <div class="vault-card emerald-border p-6">
            <div class="flex justify-between items-center mb-8">
                <span class="text-[11px] font-black uppercase text-emerald-500 tracking-widest">Tactical Liquidity</span>
                <span id="tc-display" class="text-xl font-black">₦0</span>
            </div>
            
            <div class="space-y-4 text-xs font-bold uppercase">
                <div id="bills-node" class="group">
                    <div class="flex justify-between items-center cursor-pointer p-1" onclick="toggleNode('bills-node')">
                        <span class="flex items-center gap-2">Bills Account <span class="chevron">▼</span></span>
                        <span id="b-total">₦0</span>
                    </div>
                    <div class="sub-drawer space-y-4 text-[10px] text-zinc-400">
                        <div class="flex justify-between"><span>Core Bills (40%)</span><span id="b-core" class="text-white">₦0</span></div>
                        <div class="flex justify-between"><span>Reserve Fund (40%)</span><span id="b-reserve" class="text-white">₦0</span></div>
                        <div class="flex justify-between"><span>Operational (20%)</span><span id="b-ops" class="text-white">₦0</span></div>
                    </div>
                </div>

                <div class="flex justify-between border-t border-zinc-900 pt-4 px-1"><span>Savings Account</span><span id="s-total">₦0</span></div>
                <div class="flex justify-between border-t border-zinc-900 pt-4 px-1"><span>Spend Account</span><span id="l-total">₦0</span></div>
            </div>
        </div>

        <div class="vault-card p-6">
            <p class="text-[11px] font-black uppercase text-zinc-500 mb-4">Master Audit Trail</p>
            <div id="audit-trail" class="space-y-3 max-h-64 overflow-y-auto text-[10px]"></div>
        </div>
    </div>

    <div id="entry-view" class="view-hidden space-y-8">
        <h2 class="text-4xl font-black uppercase tracking-tighter">Authorize</h2>
        <div class="space-y-6">
            <select id="e-type" class="input-dark" onchange="updateEntryFields()">
                <option value="income">Liquid Cash [+]</option>
                <option value="expense">Expense Ledger [-]</option>
                <option value="fiduciary">Fiduciary Ledger [💼]</option>
            </select>
            <input id="e-name" class="input-dark" placeholder="Description">
            <input id="e-amount" type="number" class="input-dark" placeholder="Total (₦)">
            
            <div id="m-split-box" class="vault-card p-6 border-emerald-500/20">
                <p class="text-[10px] font-bold text-zinc-500 uppercase mb-4">Manual Distribution Override</p>
                <div class="grid grid-cols-3 gap-3">
                    <input id="ms-bills" type="number" class="input-dark !p-3 text-xs" placeholder="Bills">
                    <input id="ms-save" type="number" class="input-dark !p-3 text-xs" placeholder="Save">
                    <input id="ms-spend" type="number" class="input-dark !p-3 text-xs" placeholder="Spend">
                </div>
            </div>
            <button onclick="execute()" class="w-full bg-emerald-500 p-6 rounded-2xl text-black font-black uppercase tracking-widest">Execute</button>
        </div>
    </div>

    <div id="intel-view" class="view-hidden space-y-8">
        <h2 class="text-4xl font-black uppercase tracking-tighter">Auditor</h2>
        <div class="vault-card p-10 bg-emerald-500/5 border-emerald-500/30 text-center">
            <p class="text-[10px] font-black uppercase text-zinc-500 mb-2">Grand Query Total</p>
            <p id="q-total" class="text-5xl font-black emerald-text">₦0.00</p>
        </div>
        <input id="q-search" oninput="runQuery()" class="input-dark text-center" placeholder="Contributor or Label...">
        <div id="q-results" class="space-y-3"></div>
    </div>

    <div id="settings-view" class="view-hidden space-y-8">
        <h2 class="text-4xl font-black uppercase tracking-tighter">System</h2>
        <div class="vault-card p-8 space-y-6">
            <button onclick="localStorage.clear(); location.reload();" class="w-full p-6 text-red-500 border border-red-900/50 rounded-2xl font-black uppercase text-xs">Purge All Records</button>
        </div>
    </div>

    <button id="f-add" onclick="changeView('entry-view')" class="fab-btn bg-emerald-500 text-black right-8">+</button>
    <button id="f-back" onclick="changeView('dashboard-view')" class="fab-btn bg-zinc-800 text-white left-8 view-hidden">✕</button>

    <script>
        let db = JSON.parse(localStorage.getItem('sov_vault_v5')) || [];

        function toggleNode(id) { document.getElementById(id).classList.toggle('open'); }

        function changeView(id) {
            ['dashboard-view', 'entry-view', 'intel-view', 'settings-view'].forEach(v => document.getElementById(v).classList.add('view-hidden'));
            document.getElementById(id).classList.remove('view-hidden');
            document.getElementById('f-add').classList.toggle('view-hidden', id !== 'dashboard-view');
            document.getElementById('f-back').classList.toggle('view-hidden', id === 'dashboard-view');
            if(id === 'dashboard-view') render();
        }

        function execute() {
            const type = document.getElementById('e-type').value, name = document.getElementById('e-name').value, amt = parseFloat(document.getElementById('e-amount').value);
            if (!name || isNaN(amt)) return;

            let entry = { name, total: amt, type, date: new Date().toLocaleDateString('en-GB', {day:'2-digit', month:'short'}) };

            if (type === 'income') {
                const mb = parseFloat(document.getElementById('ms-bills').value) || 0, ms = parseFloat(document.getElementById('ms-save').value) || 0, ml = parseFloat(document.getElementById('ms-spend').value) || 0;
                if (mb+ms+ml > 0) { entry.b = mb; entry.s = ms; entry.l = ml; }
                else { entry.b = amt*0.4; entry.s = amt*0.4; entry.l = amt*0.2; }
            } else if (type === 'expense') { entry.total = -amt; entry.b = -amt; }

            db.push(entry);
            localStorage.setItem('sov_vault_v5', JSON.stringify(db));
            
            document.getElementById('e-name').value = ''; document.getElementById('e-amount').value = '';
            ['ms-bills','ms-save','ms-spend'].forEach(i => document.getElementById(i).value = '');
            changeView('dashboard-view');
        }

        function render() {
            let nw=0, tc=0, b=0, s=0, l=0;
            const trail = document.getElementById('audit-trail'); trail.innerHTML = '';
            
            db.slice().reverse().forEach(i => {
                nw += i.total;
                if(i.type !== 'fiduciary') {
                    tc += i.total; b += (i.b||0); s += (i.s||0); l += (i.l||0);
                }
                trail.innerHTML += `<div class="flex justify-between py-3 border-b border-zinc-900"><span>${i.date} <b>${i.name}</b></span><span class="${i.total < 0 ? 'text-red-500' : 'text-emerald-500'}">₦${Math.abs(i.total).toLocaleString()}</span></div>`;
            });

            document.getElementById('nw-display').innerText = "₦" + nw.toLocaleString();
            document.getElementById('tc-display').innerText = "₦" + tc.toLocaleString();
            document.getElementById('b-total').innerText = "₦" + b.toLocaleString();
            document.getElementById('s-total').innerText = "₦" + s.toLocaleString();
            document.getElementById('l-total').innerText = "₦" + l.toLocaleString();
            
            // Nested Split Calculation
            document.getElementById('b-core').innerText = "₦" + (b * 0.4).toLocaleString();
            document.getElementById('b-reserve').innerText = "₦" + (b * 0.4).toLocaleString();
            document.getElementById('b-ops').innerText = "₦" + (b * 0.2).toLocaleString();
        }

        function runQuery() {
            const q = document.getElementById('q-search').value.toLowerCase();
            const res = document.getElementById('q-results'); res.innerHTML = ''; let t=0;
            if(!q) return;
            db.forEach(i => {
                if(i.name.toLowerCase().includes(q)) {
                    t += Math.abs(i.total);
                    res.innerHTML += `<div class="vault-card p-5 flex justify-between font-black uppercase text-[10px]"><span>${i.name}</span><span>₦${Math.abs(i.total).toLocaleString()}</span></div>`;
                }
            });
            document.getElementById('q-total').innerText = "₦" + t.toLocaleString();
        }

        function updateEntryFields() { document.getElementById('m-split-box').style.display = (document.getElementById('e-type').value === 'income') ? 'block' : 'none'; }

        render(); updateEntryFields();
    </script>
</body>
</html>
