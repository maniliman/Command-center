<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    
    <link rel="icon" href="https://img.icons8.com/nolan/64/safe.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://img.icons8.com/nolan/128/safe.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; font-size: 14px; }
        
        /* Layering Architecture */
        #dashboard-content { position: relative; z-index: 10; padding: 24px; }
        .stealth-btn { position: relative; z-index: 1000 !important; pointer-events: auto !important; cursor: pointer; }
        .stealth-active { background: #00FF41 !important; color: #000 !important; box-shadow: 0 0 15px rgba(0, 255, 65, 0.5); }
        .fab-button { 
            position: fixed; bottom: 32px; right: 32px; 
            z-index: 5000 !important; pointer-events: auto !important;
            box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); 
        }

        #menu-overlay { 
            display: none; position: fixed; inset: 0; z-index: 9000 !important; 
            background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); 
            padding: 24px; padding-top: 60px; overflow-y: auto;
        }
        .menu-open { display: flex !important; flex-direction: column; align-items: center; }
        
        summary { cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button id="stealth-trigger" onclick="togglePrivacy()" class="stealth-btn p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800">
                Stealth
            </button>
        </header>

        <div class="vault-card p-5 mb-8 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6 underline decoration-emerald-500 underline-offset-4">Tactical Cash Split</p>
            <div class="space-y-4 font-bold">
                <details class="group">
                    <summary class="flex justify-between items-center list-none cursor-pointer">
                        <span class="text-xs text-zinc-500 uppercase">Bills Account</span>
                        <div class="flex items-center gap-2">
                            <span id="alloc-bills" class="text-xs emerald-text">₦0</span>
                            <span class="text-[8px] text-zinc-700 group-open:rotate-180 transition-transform">▼</span>
                        </div>
                    </summary>
                    <div class="mt-3 pl-4 space-y-2 border-l border-emerald-900/30 pt-2 text-[10px] text-zinc-500 uppercase font-bold">
                        <div class="flex justify-between"><span>Emergency (40%)</span><span id="bills-emerge">₦0</span></div>
                        <div class="flex justify-between"><span>Operational (40%)</span><span id="bills-ops">₦0</span></div>
                        <div class="flex justify-between"><span>Buffer (20%)</span><span id="bills-buffer">₦0</span></div>
                    </div>
                </details>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Savings Account</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Spend Account</span><span id="alloc-life">₦0</span></div>
                <div class="border-t border-zinc-800 pt-4 flex justify-between items-center font-bold text-sm"><span class="text-[10px] text-zinc-400 uppercase">Cash Total</span><span id="total-cash" class="emerald-text font-mono">₦0</span></div>
            </div>
        </div>

        <details class="vault-card group mb-4 border-emerald-900/20">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black">Asset Inventory</span>
                <span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span>
            </summary>
            <div id="multi-tier-assets" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>

        <details class="vault-card group mb-4 border-red-900/20">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black oxblood-text">Liability Ledger</span>
                <span id="inv-debt-total" class="text-sm font-bold oxblood-text">₦0</span>
            </summary>
            <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
        </details>

        <details class="vault-card group mb-12 border-gold-text/20">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black gold-text">Fiduciary Ledger</span>
                <span id="f-total-header" class="text-sm font-bold gold-text">₦0</span>
            </summary>
            <div id="fiduciary-main-list" class="px-5 pb-5 space-y-4 border-t border-zinc-900 pt-4"></div>
        </details>

        <details class="vault-card group mb-12 border-zinc-800">
            <summary class="p-5 flex justify-between items-center bg-zinc-900/20">
                <span class="text-[10px] uppercase tracking-widest font-black text-zinc-500">Master Audit Trail</span>
                <span class="text-zinc-700 text-[10px]">▼</span>
            </summary>
            <div id="master-history" class="p-5 space-y-4 bg-zinc-900/10 border-t border-zinc-800"></div>
        </details>

        <button onclick="securePurge()" class="w-full p-4 text-[9px] uppercase tracking-widest text-zinc-800 border border-zinc-900 rounded-lg">Purge Data (PIN 0000)</button>
    </div>

    <button onclick="toggleMenu()" class="fab-button w-16 h-16 bg-emerald-500 rounded-full flex items-center justify-center text-black text-4xl font-bold">+</button>

    <div id="menu-overlay">
        <div class="w-full space-y-6 max-w-sm mx-auto pb-10">
            <h2 class="text-xl font-bold uppercase tracking-tighter">New Entry</h2>
            <div class="space-y-4">
                <select id="form-category" class="input-dark" onchange="toggleFormFields()">
                    <option value="Personal">Personal wealth</option>
                    <option value="Fiduciary">Fiduciary Contribution</option>
                </select>
                <input id="form-date" type="date" class="input-dark">
                <input id="form-name" class="input-dark" placeholder="Label / Contributor">
                <input id="form-amount" type="number" class="input-dark" placeholder="Amount (₦)">
                <div id="personal-fields">
                    <select id="form-type" class="input-dark" onchange="toggleCashFields()">
                        <option value="Cash">Cash (Fluid Split)</option>
                        <option value="Stocks">Stocks</option>
                        <option value="Property">Property</option>
                        <option value="Liability">Liability (I Owe)</option>
                    </select>
                </div>
            </div>
            <div class="pt-6 space-y-3">
                <button onclick="submitEntry()" class="w-full bg-emerald-500 p-4 rounded-xl text-black font-bold uppercase text-xs">Authorize</button>
                <button onclick="toggleMenu()" class="w-full p-4 text-zinc-500 uppercase text-[10px] font-bold text-center">Back</button>
            </div>
        </div>
    </div>

    <script>
        let stealth = false;
        let ledger = JSON.parse(localStorage.getItem('vault_ledger')) || [];
        let fLedger = JSON.parse(localStorage.getItem('fiduciary_ledger')) || [];
        document.getElementById('form-date').valueAsDate = new Date();

        function mask(val) { return stealth ? "••••" : (parseFloat(val) || 0).toLocaleString(); }

        function updateDisplay() {
            let aSum = 0, dSum = 0, fGlobal = 0, bBal = 0, sBal = 0, lBal = 0, tCash = 0;
            const dList = document.getElementById('debt-list'), fMainList = document.getElementById('fiduciary-main-list'), mAssets = document.getElementById('multi-tier-assets'), mHistory = document.getElementById('master-history');
            dList.innerHTML = ''; fMainList.innerHTML = ''; mAssets.innerHTML = ''; mHistory.innerHTML = '';

            const assetGroups = { Stocks: {t:0, e:[]}, Property: {t:0, e:[]} };

            ledger.slice().sort((a,b) => new Date(b.rawDate) - new Date(a.rawDate)).forEach((item, idx) => {
                const val = parseFloat(item.amount) || 0;
                if (item.type === 'Liability') {
                    dSum += val;
                    dList.innerHTML += `<div class="flex justify-between py-1 border-b border-zinc-900"><span>${item.name}</span><span class="oxblood-text">₦${mask(val)}</span></div>`;
                } else if (item.type === 'Cash') {
                    tCash += val; bBal += (item.bills || 0); sBal += (item.savings || 0); lBal += (item.lifestyle || 0); aSum += val;
                } else {
                    const type = item.type || 'Property';
                    if(!assetGroups[type]) assetGroups[type] = {t:0, e:[]};
                    assetGroups[type].t += val; assetGroups[type].e.push(item); aSum += val;
                }
                mHistory.innerHTML += `<div class="p-3 border border-zinc-800 rounded-lg mb-2"><div class="flex justify-between text-[8px] text-zinc-600 mb-1"><span>${item.date}</span><button onclick="deleteItem(${ledger.indexOf(item)}, 'P')">×</button></div><div class="flex justify-between text-xs"><span>${item.name}</span><span>₦${mask(val)}</span></div></div>`;
            });

            for (const cat in assetGroups) {
                if(assetGroups[cat].e.length > 0) {
                    mAssets.innerHTML += `<details class="bg-black/20 rounded-lg border border-zinc-800 mb-2"><summary class="p-3 flex justify-between items-center"><span class="text-[9px] font-bold uppercase text-zinc-500">${cat}</span><span class="text-xs font-bold emerald-text">₦${mask(assetGroups[cat].t)}</span></summary><div class="px-3 pb-3 space-y-1 border-t border-zinc-900/50 pt-2">${assetGroups[cat].e.map(e => `<div class="flex justify-between text-[9px]"><span>${e.name}</span><span>₦${mask(e.amount)}</span></div>`).join('')}</div></details>`;
                }
            }

            const fGroups = fLedger.reduce((acc, item) => {
                const val = parseFloat(item.amount) || 0;
                if (!acc[item.name]) acc[item.name] = { total: 0, entries: [] };
                acc[item.name].total += val; acc[item.name].entries.push(item); fGlobal += val; return acc;
            }, {});

            document.getElementById('f-total-header').innerText = "₦" + mask(fGlobal);
            for (const name in fGroups) {
                fMainList.innerHTML += `<details class="bg-black/20 rounded-lg border border-zinc-800 mb-2"><summary class="p-4 flex justify-between items-center"><span class="text-[10px] font-bold uppercase text-zinc-400">${name}</span><span class="text-xs font-bold gold-text">₦${mask(fGroups[name].total)}</span></summary><div class="px-4 pb-4 space-y-2 border-t border-zinc-900/50 pt-3">${fGroups[name].entries.map(e => `<div class="flex justify-between text-[9px]"><span>${e.date}</span><span>₦${mask(e.amount)}</span></div>`).join('')}</div></details>`;
            }

            document.getElementById('networth').innerText = "₦" + mask(aSum - dSum);
            document.getElementById('inv-assets-total').innerText = "₦" + mask(aSum);
            document.getElementById('inv-debt-total').innerText = "₦" + mask(dSum);
            document.getElementById('total-cash').innerText = "₦" + mask(tCash);
            document.getElementById('alloc-bills').innerText = "₦" + mask(bBal);
            document.getElementById('alloc-savings').innerText = "₦" + mask(sBal);
            document.getElementById('alloc-life').innerText = "₦" + mask(lBal);
            document.getElementById('bills-emerge').innerText = "₦" + mask(bBal * 0.4);
            document.getElementById('bills-ops').innerText = "₦" + mask(bBal * 0.4);
            document.getElementById('bills-buffer').innerText = "₦" + mask(bBal * 0.2);
        }

        function togglePrivacy() { 
            stealth = !stealth; 
            document.getElementById('stealth-trigger').classList.toggle('stealth-active', stealth);
            updateDisplay(); 
        }
        function toggleFormFields() { document.getElementById('personal-fields').classList.toggle('hidden', document.getElementById('form-category').value === 'Fiduciary'); }
        function toggleCashFields() {}
        function toggleMenu() { document.getElementById('menu-overlay').classList.toggle('menu-open'); }

        function submitEntry() {
            const cat = document.getElementById('form-category').value, name = document.getElementById('form-name').value, amount = parseFloat(document.getElementById('form-amount').value), dateVal = document.getElementById('form-date').value;
            if (!name || isNaN(amount) || !dateVal) return;
            const entryDate = new Date(dateVal).toLocaleDateString();
            if (cat === 'Personal') {
                const type = document.getElementById('form-type').value;
                let entry = { name, amount, type, date: entryDate, rawDate: dateVal };
                if (type === 'Cash') { entry.bills = amount * 0.40; entry.savings = amount * 0.40; entry.lifestyle = amount * 0.20; }
                ledger.push(entry); localStorage.setItem('vault_ledger', JSON.stringify(ledger));
            } else {
                fLedger.push({ name, amount, date: entryDate, rawDate: dateVal }); localStorage.setItem('fiduciary_ledger', JSON.stringify(fLedger));
            }
            updateDisplay(); toggleMenu();
        }
        function deleteItem(index, type) { if(confirm("Delete?")) { ledger.splice(index, 1); localStorage.setItem('vault_ledger', JSON.stringify(ledger)); updateDisplay(); } }
        function securePurge() { const pin = prompt("PIN:"); if(pin === "0000") { localStorage.clear(); location.reload(); } }
        updateDisplay();
    </script>
</body>
</html>
