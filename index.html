<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #000; color: #fff; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 0; }
        .view { display: none; padding: 20px; padding-bottom: 120px; }
        .view.active { display: block; }
        
        /* Fixed Header */
        .header-hud { position: sticky; top: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); z-index: 100; padding: 20px; border-bottom: 1px solid #222; }
        
        /* Card Styling - High Contrast for Utility */
        .stat-card { background: #111; border: 1px solid #333; border-radius: 16px; padding: 20px; margin-bottom: 15px; }
        .money { font-family: 'Courier New', Courier, monospace; font-weight: bold; }
        .stealth .money { filter: blur(10px); }

        /* Navigation Bar - Bulletproof Logic */
        .nav-dock { position: fixed; bottom: 0; left: 0; right: 0; height: 85px; background: #0A0A0A; border-top: 1px solid #333; display: flex; justify-content: space-around; align-items: center; z-index: 1000; padding-bottom: env(safe-area-inset-bottom); }
        .nav-item { flex: 1; text-align: center; background: none; border: none; color: #666; font-size: 10px; text-transform: uppercase; font-weight: bold; }
        .nav-item.active { color: #00FF41; }
        
        /* The Action Button - Anchored and Accessible */
        .action-circle { width: 60px; height: 60px; background: #fff; color: #000; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; border: none; margin-top: -40px; box-shadow: 0 0 20px rgba(255,255,255,0.2); }

        /* Full Screen Menu */
        #menu-overlay { display: none; position: fixed; inset: 0; background: #000; z-index: 2000; flex-direction: column; padding: 30px; }
        #menu-overlay.open { display: flex; }
        .menu-btn { background: #111; border: 1px solid #333; padding: 20px; border-radius: 12px; margin-bottom: 10px; text-align: left; font-weight: bold; }
    </style>
</head>
<body id="main-body">

    <div class="header-hud flex justify-between items-center">
        <div>
            <p style="font-size: 8px; letter-spacing: 3px; color: #666;">SOVEREIGN ELITE</p>
            <h2 id="view-title" style="font-size: 18px; font-weight: 800; margin: 0;">DASHBOARD</h2>
        </div>
        <button onclick="toggleStealth()" style="background: #222; padding: 8px 15px; border-radius: 8px; font-size: 10px; font-weight: bold;">STEALTH</button>
    </div>

    <div id="view-home" class="view active">
        <div class="stat-card text-center" style="border-color: #444;">
            <p style="font-size: 10px; color: #666; margin-bottom: 5px;">NET PORTFOLIO</p>
            <h1 id="total-nw" class="money text-4xl">₦0</h1>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
            <div class="stat-card" style="margin-bottom: 0;">
                <p style="font-size: 8px; color: #666;">CASH</p>
                <p id="cash-assets" class="money text-[#00FF41]">₦0</p>
            </div>
            <div class="stat-card" style="margin-bottom: 0;">
                <p style="font-size: 8px; color: #666;">DEBT</p>
                <p id="net-debt" class="money text-red-500">₦0</p>
            </div>
        </div>

        <p style="font-size: 10px; font-weight: bold; color: #444; margin-bottom: 15px;">ACTIVE TARGETS</p>
        <div id="goals-container"></div>
    </div>

    <div id="view-people" class="view">
        <h3 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">People Ledger</h3>
        <div id="people-container" class="space-y-4"></div>
    </div>

    <div id="view-audit" class="view">
        <h3 style="font-size: 24px; font-weight: bold; margin-bottom: 20px;">Audit History</h3>
        <div id="history-container" class="space-y-2"></div>
    </div>

    <nav class="nav-dock">
        <button class="nav-item active" onclick="navigate('home')">DASH</button>
        <button class="nav-item" onclick="navigate('people')">PEOPLE</button>
        <button class="action-circle" onclick="toggleOverlay()">+</button>
        <button class="nav-item" onclick="navigate('audit')">AUDIT</button>
        <button class="nav-item" onclick="clearAllData()" style="color: #333;">RESET</button>
    </nav>

    <div id="menu-overlay">
        <h2 style="font-size: 24px; font-weight: 800; margin-bottom: 30px;">TACTICAL MENU</h2>
        <button class="menu-btn" onclick="logDeposit()">💰 DEPOSIT ASSETS</button>
        <button class="menu-btn" onclick="logSpend()">💸 SPEND ASSETS</button>
        <button class="menu-btn" onclick="logDebt('DEBTOR')">🤝 I LENT MONEY</button>
        <button class="menu-btn" onclick="logDebt('CREDITOR')">⚖️ I BORROWED MONEY</button>
        <button class="menu-btn" onclick="createNewGoal()">🎯 NEW ENVELOPE</button>
        <button onclick="toggleOverlay()" style="margin-top: 30px; color: #666; font-weight: bold;">CLOSE</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('sov_v7_data')) || { history: [], goals: [] };

        function navigate(view) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById('view-' + view).classList.add('active');
            document.getElementById('view-title').innerText = view.toUpperCase();
            refreshUI();
        }

        function toggleOverlay() { 
            const overlay = document.getElementById('menu-overlay');
            overlay.classList.toggle('open');
        }

        function toggleStealth() { document.getElementById('main-body').classList.toggle('stealth'); }

            let nw = 0, cash = 0, debtors = 0, creditors = 0;
