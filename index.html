<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0A0A0B; color: #EDEDED; font-family: ui-monospace, monospace; overflow-x: hidden; margin: 0; padding: 0; }
        .vault-card { background: #161618; border: 1px solid #262629; border-radius: 12px; position: relative; }
        .emerald-text { color: #00FF41; }
        .oxblood-text { color: #FF3131; }
        .gold-text { color: #FFD700; }
        .input-dark { background: #0A0A0B; border: 1px solid #262629; color: white; padding: 12px; border-radius: 8px; width: 100%; outline: none; font-size: 14px; }
        #dashboard-content { position: relative; z-index: 10; padding: 24px; }
        .stealth-btn { position: relative; z-index: 100 !important; pointer-events: auto !important; transition: all 0.2s; }
        .stealth-active { background: #00FF41 !important; color: #000 !important; box-shadow: 0 0 15px rgba(0, 255, 65, 0.5); }
        .fab-button { position: fixed; bottom: 32px; right: 32px; z-index: 999 !important; box-shadow: 0 0 25px rgba(0, 255, 65, 0.4); }
        #menu-overlay { display: none; position: fixed; inset: 0; z-index: 2000 !important; background: rgba(0,0,0,0.98); backdrop-filter: blur(25px); padding: 24px; padding-top: 60px; overflow-y: auto; }
        .menu-open { display: flex !important; flex-direction: column; align-items: center; }
        summary { cursor: pointer; outline: none; list-style: none; }
        summary::-webkit-details-marker { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
    </style>
</head>
<body class="pb-60">

    <div id="dashboard-content">
        <header class="mb-10 flex justify-between items-start pt-4">
            <div>
                <p class="text-[#71717A] text-[10px] tracking-[0.3em] uppercase font-bold text-emerald-500/80">Sovereign Financials</p>
                <h1 id="networth" class="text-4xl font-bold mt-2 tracking-tighter">₦0.00</h1>
            </div>
            <button id="stealth-trigger" onclick="togglePrivacy()" class="stealth-btn p-3 vault-card text-[10px] tracking-widest uppercase border border-zinc-800">
                Stealth
            </button>
        </header>

        <div class="vault-card p-5 mb-8 border border-emerald-900/20">
            <p class="text-[#71717A] text-[9px] uppercase tracking-widest font-black mb-6 underline decoration-emerald-500 underline-offset-4">Tactical Cash Split</p>
            <div class="space-y-4 font-bold">
                <details class="group">
                    <summary class="flex justify-between items-center list-none cursor-pointer">
                        <span class="text-xs text-zinc-500 uppercase">Bills Account</span>
                        <div class="flex items-center gap-2">
                            <span id="alloc-bills" class="text-xs emerald-text">₦0</span>
                            <span class="text-[8px] text-zinc-700 group-open:rotate-180 transition-transform">▼</span>
                        </div>
                    </summary>
                    <div class="mt-3 pl-4 space-y-2 border-l border-emerald-900/30 pt-2 text-[10px] text-zinc-500 uppercase">
                        <div class="flex justify-between"><span>Emergency (40%)</span><span id="bills-emerge">₦0</span></div>
                        <div class="flex justify-between"><span>Operational (40%)</span><span id="bills-ops">₦0</span></div>
                        <div class="flex justify-between"><span>Buffer (20%)</span><span id="bills-buffer">₦0</span></div>
                    </div>
                </details>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Savings Account</span><span id="alloc-savings">₦0</span></div>
                <div class="flex justify-between text-xs font-bold"><span class="text-zinc-500 uppercase">Spend Account</span><span id="alloc-life">₦0</span></div>
                <div class="border-t border-zinc-800 pt-4 flex justify-between items-center font-bold text-sm"><span class="text-[10px] text-zinc-400 uppercase">Total Cash Balance</span><span id="total-cash" class="emerald-text font-mono">₦0</span></div>
            </div>
        </div>

        <details class="vault-card group mb-4 border-emerald-900/20">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black">Asset Inventory</span>
                <span id="inv-assets-total" class="text-sm font-bold emerald-text">₦0</span>
            </summary>
            <div id="multi-tier-assets" class="px-5 pb-5 space-y-3 border-t border-zinc-900 pt-4"></div>
        </details>

        <details class="vault-card group mb-4 border-red-900/20">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black oxblood-text">Liability Ledger</span>
                <span id="inv-debt-total" class="text-sm font-bold oxblood-text">₦0</span>
            </summary>
            <div id="debt-list" class="px-5 pb-5 space-y-2 border-t border-zinc-900 pt-4 text-[11px]"></div>
        </details>

        <details class="vault-card group mb-12 border-gold-text/20">
            <summary class="p-5 flex justify-between items-center">
                <span class="text-[10px] uppercase tracking-widest font-black gold-text">Fiduciary Ledger</span>
                <span id="f-total-header" class="text-sm font-bold gold-text">₦0</span>
            </summary>
            <div id="fiduciary-main-list" class="px-5 pb-5 space-y-4 border-t border-zinc-900 pt-4"></div>
        </details>

        <details class="vault-card group mb-12 border-zinc-800">
            <summary class="p-5 flex justify-between items-center bg-zinc-900/20">
                <span class="text-[10px] uppercase tracking-widest font-black text-zinc-500">Master Audit Trail</span>
                <span class="text-zinc-700 text-[10px]">▼</span>
            </summary>
            <div id="master-history
