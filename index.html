<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Sovereign Command</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #FAFAFA; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glass { background: rgba(22, 22, 24, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; }
        .fab { position: fixed; bottom: 30px; right: 24px; width: 60px; height: 60px; border-radius: 30px; background: #FAFAFA; color: #000; display: flex; align-items: center; justify-content: center; font-size: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; transition: transform 0.2s; }
        .fab:active { transform: scale(0.9); }
        .view-container { display: none; animation: fadeIn 0.3s ease; }
        .view-container.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .progress-bar { height: 6px; background: #1A1A1A; border-radius: 3px; overflow: hidden; }
        .progress-fill { background: #00FF41; height: 100%; transition: width 0.5s ease; }
    </style>
</head>
<body class="p-6 pb-32">

    <div id="view-dashboard" class="view-container active">
        <header class="mb-8 pt-4">
            <p class="text-zinc-500 text-[10px] tracking-[0.3em] uppercase mb-1">Total Net Worth</p>
            <h1 id="dash-nw" class="text-5xl font-bold tracking-tighter">₦0</h1>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="glass p-5" onclick="showView('view-assets')">
                <p class="text-zinc-500 text-[9px] uppercase tracking-widest mb-1">Cash Assets</p>
                <p id="dash-assets" class="text-lg font-bold text-[#00FF41]">₦0</p>
            </div>
            <div class="glass p-5" onclick="showView('view-debt')">
                <p class="text-zinc-500 text-[9px] uppercase tracking-widest mb-1">Net Liabilities</p>
                <p id="dash-debt" class="text-lg font-bold text-red-500">₦0</p>
            </div>
        </div>

        <div class="glass p-6 mb-8" onclick="showView('view-goals')">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xs font-bold uppercase tracking-widest">Active Targets</h3>
                <span class="text-zinc-500 text-xs">→</span>
            </div>
            <div id="dash-goals-preview" class="space-y-4">
                <p class="text-xs text-zinc-600">No active goals set.</p>
            </div>
        </div>

        <div class="grid grid-cols-1 gap-3">
            <button onclick="showView('view-history')" class="glass p-4 text-left text-xs uppercase tracking-widest flex justify-between">
                <span>Transaction History</span>
                <span>📋</span>
            </button>
        </div>
    </div>

    <div id="view-assets" class="view-container">
        <button onclick="showView('view-dashboard')" class="mb-8 flex items-center text-zinc-500 text-xs tracking-widest">
            <span class="mr-2">←</span> DASHBOARD
        </button>
        <h2 class="text-3xl font-bold mb-8 tracking-tight">Liquid Assets</h2>
        <div class="glass p-8 mb-6 text-center">
            <p class="text-zinc-500 text-[10px] uppercase tracking-widest mb-2">Available Balance</p>
            <p id="asset-total" class="text-4xl font-bold">₦0</p>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <button onclick="quickAction('IN', 'gen')" class="glass p-6 text-center border-zinc-800">
                <p class="text-[10px] font-bold uppercase mb-1">Add Cash</p>
                <span class="text-2xl">💰</span>
            </button>
            <button onclick="quickAction('OUT', 'gen')" class="glass p-6 text-center border-zinc-800">
                <p class="text-[10px] font-bold uppercase mb-1">Spend Cash</p>
                <span class="text-2xl">💸</span>
            </button>
        </div>
    </div>

    <div id="view-goals" class="view-container">
        <button onclick="showView('view-dashboard')" class="mb-8 flex items-center text-zinc-500 text-xs tracking-widest">
            <span class="mr-2">←</span> DASHBOARD
        </button>
        <div class="flex justify-between items-end mb-8">
            <h2 class="text-3xl font-bold tracking-tight">Envelopes</h2>
            <button onclick="createGoal()" class="text-[#00FF41] text-xs font-bold tracking-widest uppercase">Create +</button>
        </div>
        <div id="full-goals-list" class="space-y-4"></div>
    </div>

    <div id="view-debt" class="view-container">
        <button onclick="showView('view-dashboard')" class="mb-8 flex items-center text-zinc-500 text-xs tracking-widest">
            <span class="mr-2">←</span> DASHBOARD
        </button>
        <h2 class="text-3xl font-bold mb-8 tracking-tight">Debt Tracking</h2>
        <div class="glass p-6 mb-6">
            <div class="flex justify-between mb-2">
                <span class="text-xs text-zinc-500 uppercase tracking-widest">Debtors (Owe Me)</span>
                <span id="debtor-total" class="text-sm font-bold text-[#00FF41]">₦0</span>
            </div>
            <div class="flex justify-between">
                <span class="text-xs text-zinc-500 uppercase tracking-widest">Creditors (I Owe)</span>
                <span id="creditor-total" class="text-sm font-bold text-red-500">₦0</span>
            </div>
        </div>
        <div class="space-y-3">
            <button onclick="quickAction('DEBTOR', 'debt')" class="w-full glass p-5 text-left text-xs uppercase tracking-widest">➕ Add Someone who owes me</button>
            <button onclick="quickAction('CREDITOR', 'debt')" class="w-full glass p-5 text-left text-xs uppercase tracking-widest">➖ Add Someone I owe</button>
        </div>
    </div>

    <div id="view-history" class="view-container">
        <button onclick="showView('view-dashboard')" class="mb-8 flex items-center text-zinc-500 text-xs tracking-widest">
            <span class="mr-2">←</span> DASHBOARD
        </button>
        <h2 class="text-3xl font-bold mb-8 tracking-tight">History</h2>
        <div id="full-history-list" class="space-y-4"></div>
    </div>

    <div class="fab" onclick="showQuickAdd()">+</div>

    <script>
        let history = JSON.parse(localStorage.getItem('sov_v2_history')) || [];
        let goals = JSON.parse(localStorage.getItem('sov_v2_goals')) || [];

        function showView(id) {
            document.querySelectorAll('.view-container').forEach(v => v.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            window.scrollTo(0,0);
            updateUI();
        }

        function updateUI() {
            let nw = 0; let assets = 0; let debtors = 0; let creditors = 0;
            const goalBals = {}; goals.forEach(g => goalBals[g.id] = 0);

            history.forEach(item => {
                const amt = parseFloat(item.amount);
                if (item.type === 'IN') { assets += amt; nw += amt; if(goalBals.hasOwnProperty(item.goalId)) goalBals[item.goalId] += amt; }
                if (item.type === 'OUT') { assets -= amt; nw -= amt; if(goalBals.hasOwnProperty(item.goalId)) goalBals[item.goalId] -= amt; }
                if (item.type === 'DEBTOR') { debtors += amt; nw += amt; }
                if (item.type === 'CREDITOR') { creditors += amt; nw -= amt; }
            });

            // Main Dashboard Updates
            document.getElementById('dash-nw').innerText = "₦" + nw.toLocaleString();
            document.getElementById('dash-assets').innerText = "₦" + assets.toLocaleString();
            document.getElementById('dash-debt').innerText = "₦" + (creditors - debtors).toLocaleString();

            // Preview Goals on Dash
            const goalPreview = document.getElementById('dash-goals-preview');
            goalPreview.innerHTML = goals.length > 0 ? goals.slice(0,2).map(g => {
                const bal = goalBals[g.id] || 0;
                const pct = g.target > 0 ? Math.min((bal/g.target)*100, 100) : 0;
                return `<div class="mb-2"><div class="flex justify-between text-[10px] mb-1"><span>${g.name}</span><span>${Math.floor(pct)}%</span></div>
                <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
            }).join('') : '<p class="text-[10px] text-zinc-600">No active goals.</p>';

            // Sub-view Updates
            if(document.getElementById('asset-total')) document.getElementById('asset-total').innerText = "₦" + assets.toLocaleString();
            if(document.getElementById('debtor-total')) document.getElementById('debtor-total').innerText = "₦" + debtors.toLocaleString();
            if(document.getElementById('creditor-total')) document.getElementById('creditor-total').innerText = "₦" + creditors.toLocaleString();

            // Full Goals List
            document.getElementById('full-goals-list').innerHTML = goals.map(g => {
                const bal = goalBals[g.id] || 0;
                const pct = g.target > 0 ? Math.min((bal/g.target)*100, 100) : 0;
                return `<div class="glass p-5">
                    <div class="flex justify-between mb-3"><span class="text-xs font-bold uppercase">${g.name}</span><span class="text-xs font-mono font-bold text-[#00FF41]">${Math.floor(pct)}%</span></div>
                    <div class="progress-bar mb-3"><div class="progress-fill" style="width:${pct}%"></div></div>
                    <div class="flex justify-between text-[10px] text-zinc-500 mb-4"><span>Saved: ₦${bal.toLocaleString()}</span><span>Target: ₦${g.target.toLocaleString()}</span></div>
                    <button onclick="quickAction('IN', '${g.id}')" class="text-[10px] font-bold text-[#00FF41] uppercase mr-4">Add Funds</button>
                    <button onclick="deleteGoal('${g.id}')" class="text-[10px] font-bold text-red-900 uppercase">Remove Goal</button>
                </div>`;
            }).join('');

            // History List
            document.getElementById('full-history-list').innerHTML = history.slice().reverse().map((item, idx) => {
                const realIdx = history.length - 1 - idx;
                return `<div class="glass p-4 flex justify-between items-center">
                    <div><p class="text-zinc-500 text-[9px] uppercase">${item.date} | ${item.type}</p><p class="text-sm font-bold">₦${item.amount.toLocaleString()}</p></div>
                    <button onclick="deleteTx(${realIdx})" class="text-zinc-700 text-lg px-2">×</button>
                </div>`;
            }).join('');
        }

        function showQuickAdd() {
            // Context-aware quick add
            const activeView = document.querySelector('.view-container.active').id;
            if(activeView === 'view-goals') createGoal();
            else if(activeView === 'view-debt') quickAction('DEBTOR', 'debt');
            else quickAction('IN', 'gen');
        }

        function quickAction(type, goalId) {
            const amount = prompt(`Amount for ${type}:`);
            if (!amount || isNaN(amount)) return;
            const now = new Date();
            history.push({
                type, amount: parseFloat(amount), goalId,
                date: now.toLocaleDateString('en-GB', {day:'2-digit', month:'short'}),
                time: now.toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'})
            });
            localStorage.setItem('sov_v2_history', JSON.stringify(history));
            updateUI();
        }

        function createGoal() {
            const name = prompt("Envelope/Goal Name:");
            const target = prompt("Target (₦):");
            if (name && target) {
                goals.push({ id: 'g' + Date.now(), name, target: parseFloat(target) });
                localStorage.setItem('sov_v2_goals', JSON.stringify(goals));
                updateUI();
            }
        }

        function deleteTx(idx) { if(confirm("Permanently delete this entry?")) { history.splice(idx, 1); localStorage.setItem('sov_v2_history', JSON.stringify(history)); updateUI(); } }
        function deleteGoal(id) { if(confirm("Remove goal and unassign funds?")) { goals = goals.filter(g
